# Proyecto de Xcode de Fueguitos, generado con XcodeGen (en la Mac de GitHub Actions).
# La web (index.html, íconos, manifest) se copia a ios/public antes de generar.
name: Fueguitos
options:
  bundleIdPrefix: com.nicostrijland
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Capacitor:
    url: https://github.com/ionic-team/capacitor-swift-pm.git
    from: 7.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  Fueguitos:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: public
        type: folder
        buildPhase: resources
    dependencies:
      - package: Capacitor
        product: Capacitor
      - package: Capacitor
        product: Cordova
      - target: FueguitosWidget
      - sdk: HealthKit.framework
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicostrijland.fueguitos]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        aps-environment: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fueguitos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Fueguitos lee tus entrenamientos y minutos de meditación de hoy para anotar tu día solo, sin que tengas que tocar nada."
        NSCameraUsageDescription: "Para sacar la foto del día y la de tu jugador en los torneos."
        NSPhotoLibraryUsageDescription: "Para elegir la foto del día o la de tu jugador en los torneos."
        CFBundleURLTypes:
          - CFBundleURLName: com.nicostrijland.fueguitos
            CFBundleURLSchemes: [fueguitos]
        LSApplicationQueriesSchemes: [whatsapp, spotify]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicostrijland.fueguitos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

  FueguitosWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicostrijland.fueguitos]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Fueguitos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicostrijland.fueguitos.widget
