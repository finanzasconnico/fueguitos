<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Casaca</title>
<meta name="description" content="La app del plantel: convocatoria, pizarra, estadísticas y la carta de cada jugador.">
<meta name="theme-color" content="#EEF5EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1611" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Casaca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Cancha de día: blanco cal, verde césped, casaca amarilla. De noche: césped bajo los reflectores. */
:root{
  --bg:#EEF5EC; --card:#FFFFFF; --ink:#10231A; --muted:#5A6E62; --line:#D6E5D8;
  --grass:#14964A; --grass-dark:#0D7038; --grass-soft:#DCF2E2; --grass-ink:#0B5A2C;
  --bib:#D8F23A; --bib-ink:#3E4A00;
  --gold:#E9A800; --gold-soft:#FFF1C2; --gold-ink:#7A5200;
  --coral:#F0533E; --coral-dark:#C43A28; --coral-soft:#FFE3DD; --coral-ink:#8F2414;
  --sky:#2E7FD9; --sky-soft:#E0EEFB; --sky-ink:#174E8C;
  --field:#FFFFFF; --nav:rgba(255,255,255,.95); --scrim:rgba(10,30,20,.5); --toast:#10231A; --toast-ink:#FFFFFF;
  --pitch1:#1E9A50; --pitch2:#23A658; --chalk:rgba(255,255,255,.85);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --f-body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Big Shoulders Display","Bricolage Grotesque",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1611; --card:#12221A; --ink:#E8F3EC; --muted:#9BB3A5; --line:#22392C;
    --grass:#2DB866; --grass-dark:#178A47; --grass-soft:#143524; --grass-ink:#8FE3B1;
    --bib-ink:#E5F77A;
    --gold-soft:#3A2E08; --gold-ink:#FFD45C;
    --coral-soft:#3D1A14; --coral-ink:#FFA597;
    --sky-soft:#13263A; --sky-ink:#8CC2F7;
    --field:#0F1D16; --nav:rgba(11,22,17,.94); --scrim:rgba(0,0,0,.6); --toast:#E8F3EC; --toast-ink:#0B1611;
    --pitch1:#156F3A; --pitch2:#187A40; --chalk:rgba(255,255,255,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
::selection{background:var(--grass);color:#fff}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.section{margin-top:24px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.section-title h2{font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(100px + var(--safe-b))}

/* Barra de arriba: selector de equipo + perfil */
.status{position:sticky;top:0;z-index:25;background:var(--nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:var(--safe-t);border-bottom:2px solid var(--line)}
.status .inner{max-width:520px;margin:0 auto;padding:8px 12px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.teamsel{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;padding:6px 10px 6px 4px;border-radius:14px;min-width:0}
.teamsel:active{background:var(--line)}
.teamsel .em{font-size:26px;line-height:1}
.teamsel .chev{color:var(--muted);font-size:14px}
.teamsel .role{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--grass-ink);background:var(--grass-soft);padding:2px 7px;border-radius:999px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;flex:none;text-transform:uppercase}
.av.lg{width:56px;height:56px;font-size:21px}

/* Botones gorditos, como en Fueguitos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:17px;background:var(--grass);color:#fff;box-shadow:0 4px 0 var(--grass-dark);width:100%;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--grass-dark)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-dark)}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 #1C5EA8}
.btn.bib{background:var(--bib);color:#2A3300;box-shadow:0 4px 0 #A9C21B}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px;width:auto;box-shadow:0 3px 0 var(--grass-dark)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}
.btn.sm:active{transform:translateY(3px)}
.link{color:var(--sky);font-weight:700;font-size:15px}
.link.muted{color:var(--muted)}
.link.danger{color:var(--coral)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}

.card{background:var(--card);border-radius:20px;padding:16px;border:2px solid var(--line)}
.card.tap{display:block;width:100%;text-align:left}
.card.tap:active{background:var(--grass-soft)}
.field{display:block}
.field>span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.input{width:100%;min-height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:var(--field);font-size:17px}
.input:focus{border-color:var(--grass);outline:none}
textarea.input{padding:12px 14px;min-height:80px;resize:vertical}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--grass-soft);color:var(--grass-ink)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.coral{background:var(--coral-soft);color:var(--coral-ink)}
.pill.sky{background:var(--sky-soft);color:var(--sky-ink)}
.banner{border-radius:16px;padding:12px 14px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center}
.banner.gold{background:var(--gold-soft);color:var(--gold-ink)}
.banner.sky{background:var(--sky-soft);color:var(--sky-ink)}
.banner.coral{background:var(--coral-soft);color:var(--coral-ink)}
.banner.ok{background:var(--grass-soft);color:var(--grass-ink)}

/* Elegir entre opciones */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--line);padding:4px;border-radius:16px}
.seg button{min-height:44px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.06)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;white-space:nowrap}
.chip.on{border-color:var(--grass);background:var(--grass-soft);color:var(--grass-ink)}

/* Stepper */
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:800;display:grid;place-items:center}
.stepper button:active{background:var(--grass-soft)}
.stepper output{min-width:44px;text-align:center;font-size:24px;font-weight:800;font-family:var(--f-num)}
.statrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.statrow:last-child{border-bottom:0}
.statrow b{font-size:17px}

/* Voy / Duda / No voy */
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsvp button{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;gap:2px}
.rsvp button span{font-size:20px}
.rsvp button.on.voy{background:var(--grass);border-color:var(--grass);color:#fff}
.rsvp button.on.duda{background:var(--gold);border-color:var(--gold);color:#3A2800}
.rsvp button.on.no_voy{background:var(--coral);border-color:var(--coral);color:#fff}

/* Partido */
.match{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.mdate{width:52px;height:56px;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mdate b{font-family:var(--f-num);font-size:24px}
.mdate small{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-top:2px}
.mres{font-family:var(--f-num);font-size:26px;font-weight:900;letter-spacing:.02em;text-align:right;line-height:1}
.wdl{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:800;font-size:13px;color:#fff}
.wdl.G{background:var(--grass)}.wdl.E{background:var(--gold);color:#3A2800}.wdl.P{background:var(--coral)}.wdl.N{background:var(--line);color:var(--muted)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.stars i{font-style:normal;color:var(--line)}
.scoreboard{background:linear-gradient(160deg,#0F3A22,#0B2417);color:#fff;border-radius:22px;padding:18px 16px;text-align:center;position:relative;overflow:hidden}
.scoreboard::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border:3px solid rgba(255,255,255,.08);border-radius:50%}
.scoreboard .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:8px}
.scoreboard .tn{font-weight:800;font-size:17px;line-height:1.15}
.scoreboard .sc{font-family:var(--f-num);font-size:54px;font-weight:900;line-height:1;letter-spacing:.04em}
.scoreboard .meta{font-size:13px;opacity:.8;font-weight:600}
.hero{background:linear-gradient(160deg,var(--grass),var(--grass-dark));color:#fff;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero h2{font-size:26px;margin-top:4px}
.hero .meta{font-size:15px;opacity:.9;margin-top:4px;font-weight:600}
.hero .rsvp button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .rsvp button.on.voy{background:#fff;color:var(--grass-dark);border-color:#fff}
.hero .count{font-size:14px;font-weight:700;margin-top:10px;opacity:.95}

/* Cartas de jugador */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{--c1:#C9D3CC;--c2:#9AA9A0;--ink:#1D2A22;position:relative;aspect-ratio:3/4;border-radius:18px 18px 18px 18px;background:linear-gradient(155deg,var(--c1),var(--c2));color:var(--ink);padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;width:100%;clip-path:polygon(0 0,82% 0,100% 12%,100% 100%,0 100%)}
.pc::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.10) 0 10px,transparent 10px 22px);pointer-events:none}
.pc.bronce{--c1:#E6B98C;--c2:#B57B45;--ink:#3A2210}
.pc.plata{--c1:#E9EEF1;--c2:#A9B6BF;--ink:#1E2A33}
.pc.oro{--c1:#FCE38A;--c2:#D9A520;--ink:#3B2A00}
.pc.elite{--c1:#1A5C35;--c2:#0B2A18;--ink:#F4F9D2}
.pc.elite .pc-ov{color:var(--bib)}
.pc.out{filter:grayscale(.75);opacity:.75}
.pc-top{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;align-items:center;line-height:.9;z-index:1}
.pc-ov{font-family:var(--f-num);font-weight:900;font-size:36px}
.pc-pos{font-weight:800;font-size:12px;letter-spacing:.06em}
.pc-st{position:absolute;right:10px;top:26px;font-size:16px;z-index:1}
.pc-face{margin-top:20px;width:58%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:34px;position:relative;z-index:1}
.pc-name{margin-top:auto;font-weight:800;font-size:17px;line-height:1.1;max-width:100%;position:relative;z-index:1;text-transform:uppercase;letter-spacing:.02em}
.pc-sub{font-size:12px;font-weight:700;opacity:.8;position:relative;z-index:1;margin-top:2px}
.pc.big{max-width:280px;margin:0 auto}
.pc.big .pc-ov{font-size:58px}
.pc.big .pc-pos{font-size:15px}
.pc.big .pc-face{width:46%;font-size:46px;margin-top:26px}
.pc.big .pc-name{font-size:24px;margin-top:10px}
.pc-attrs{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-top:10px;font-weight:800;font-size:15px;position:relative;z-index:1}
.pc-attrs span{display:flex;gap:6px;justify-content:space-between}
.pc-attrs b{font-family:var(--f-num);font-size:18px}
.pc.big{aspect-ratio:auto;padding-bottom:16px}

/* Listas */
.list{display:grid;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card);width:100%;text-align:left}
.lrow:active{background:var(--grass-soft)}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t small{color:var(--muted);font-weight:600;font-size:13px}
.rate{font-family:var(--f-num);font-weight:900;font-size:22px;min-width:40px;text-align:center;border-radius:10px;padding:2px 6px}
.r-hi{background:var(--grass);color:#fff}.r-ok{background:var(--grass-soft);color:var(--grass-ink)}.r-mid{background:var(--gold-soft);color:var(--gold-ink)}.r-lo{background:var(--coral-soft);color:var(--coral-ink)}.r-na{background:var(--bg);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpis div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.kpis b{display:block;font-family:var(--f-num);font-size:28px;font-weight:900;line-height:1}
.kpis span{font-size:12px;font-weight:700;color:var(--muted)}

/* Planilla tipo Excel */
.sheetwrap{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--card)}
table.pl{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
table.pl th,table.pl td{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.pl th{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:var(--card);position:sticky;top:0}
table.pl th.l,table.pl td.l{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;border-right:2px solid var(--line);max-width:120px;overflow:hidden;text-overflow:ellipsis}
table.pl th.sort{cursor:pointer}
table.pl th.sort.on{color:var(--grass-ink)}
table.pl td .cell{display:inline-block;min-width:32px;border-radius:8px;padding:2px 4px;font-family:var(--f-num);font-weight:800;font-size:16px}
table.pl tr:last-child td{border-bottom:0}
table.pl.tight th,table.pl.tight td{padding:7px 5px}
table.pl.tight th.l,table.pl.tight td.l{max-width:130px}
table.pl td.me{font-weight:800}

/* Pizarra */
.pitch{position:relative;width:100%;aspect-ratio:68/100;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch1) 0 10%,var(--pitch2) 10% 20%);touch-action:none;user-select:none;-webkit-user-select:none}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;touch-action:none;z-index:2}
.tok .dot{width:44px;height:44px;border-radius:50%;background:var(--bib);color:#2A3300;display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25);border:3px solid #fff}
.tok.gk .dot{background:#FFB020}
.tok.empty .dot{background:rgba(255,255,255,.18);border:3px dashed rgba(255,255,255,.8);color:#fff;box-shadow:none}
.tok.hurt .dot{background:var(--coral);color:#fff}
.tok .nm{font-size:12px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok.drag{z-index:5}
.tok.drag .dot{transform:scale(1.12)}
.tok.note .dot::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--sky);border:2px solid #fff;transform:translate(16px,-16px)}
.bench{display:flex;flex-wrap:wrap;gap:6px}

/* Navegación de abajo */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:2px solid var(--line);padding-bottom:var(--safe-b);z-index:30}
nav.tabs .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;font-weight:700;color:var(--muted);min-height:58px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--grass)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(76px + var(--safe-b));z-index:20;width:auto;padding:0 18px;border-radius:999px;min-height:52px}

/* Hojas desde abajo */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + var(--safe-b));max-height:92dvh;overflow:auto;animation:sheet .22s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
@keyframes sheet{from{transform:translateY(40%)}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--muted);opacity:.45;margin:0 auto 14px}
.sheet h2{margin-bottom:4px}

function formationSlots(f){
  const rows = f.split('-').map(Number);
  const out = [{ x: 50, y: 91, gk: true }];
  const n = rows.length;
  rows.forEach((cnt, i) => {
    const y = n === 1 ? 50 : 76 - i * (60 / (n - 1));
    for (let j = 0; j < cnt; j++){
      const span = cnt === 1 ? 0 : Math.min(80, 22 * (cnt - 1));
      const x = cnt === 1 ? 50 : 50 - span/2 + j * (span / (cnt - 1));
      out.push({ x: Math.round(x*10)/10, y: Math.round(y*10)/10 });
    }
  });
  return out;
}

let netOnline = true;
async function rpc(fn, args={}){
  let res;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args), signal: ctl.signal
    });
  } catch(e){
    const err = new Error('Sin señal. Revisá tu internet y probá de nuevo.'); err.offline = true;
    setNet(false); throw err;
  } finally { clearTimeout(timer); }
  setNet(true);
  const txt = await res.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!res.ok){
    const code = (data && data.message) || '';
    if (code === 'SESION_INVALIDA'){ LS.del('casaca_token'); S.token = null; }
    const err = new Error(ERRORS[code] || 'Algo falló. Probá de nuevo en un rato.'); err.code = code; throw err;
  }
  return data;
}
function setNet(on){ if (netOnline !== on){ netOnline = on; const b = $('#offline'); if (b) b.hidden = on; } }

async function loadMe(){ S.me = await rpc('fc_me', P()); LS.set('casaca_me', JSON.stringify(S.me)); }
async function loadTeam(){
  const teams = S.me.teams;

/* ============ Cálculos ============ */
function votingOpen(x){ return x.played && x.result_at && (Date.now() - new Date(x.result_at).getTime()) < 48*36e5; }
function mvpOf(x){
  const vs = S.T.votes.filter(v => v.match_id === x.id);
  if (!vs.length || votingOpen(x)) return [];
  const c = {}; vs.forEach(v => c[v.voted_id] = (c[v.voted_id] || 0) + 1);
  const max = Math.max(...Object.values(c));
  return Object.keys(c).filter(k => c[k] === max);
}
function wdl(x){
  if (!x.played) return null;
  if (x.goals_for == null || x.goals_against == null) return 'N';
  return x.goals_for > x.goals_against ? 'G' : x.goals_for < x.goals_against ? 'P' : 'E';
}
const playedMatches = () => S.T.matches.filter(x => x.played);
function nextMatch(){
  const now = Date.now() - 3*36e5;
  const up = S.T.matches.filter(x => !x.played && (!x.starts_at || new Date(x.starts_at).getTime() > now));
  up.sort((a,b) => (a.starts_at ? new Date(a.starts_at) : Infinity) - (b.starts_at ? new Date(b.starts_at) : Infinity));
  return up[0] || null;
}
function agg(mid){
  const played = new Set(playedMatches().map(x => x.id));
  const rows = S.T.stats.filter(s => s.member_id === mid && s.played && played.has(s.match_id));
  const rs = rows.map(s => s.dt_rating).filter(r => r != null).map(Number);
  const figs = playedMatches().filter(x => mvpOf(x).includes(mid)).length;
  const tc = trainCompliance(mid);
  return {
    pj: rows.length,
    goals: rows.reduce((a,s) => a + s.goals, 0),
    assists: rows.reduce((a,s) => a + s.assists, 0),
    yellow: rows.reduce((a,s) => a + s.yellow, 0),
    red: rows.filter(s => s.red).length,
    avg: rs.length ? rs.reduce((a,b) => a+b, 0) / rs.length : null,
    rated: rs.length, figs,
    att: played.size ? rows.length / played.size : null,
    tdone: tc.done, tcount: tc.count, ent: tc.count ? Math.round(tc.done / tc.count * 100) : null
  };
}
// Puntaje sugerido (1–100) a partir de lo que pasó en la cancha. El DT decide si lo usa.
function suggested(mid){
  const a = agg(mid);
  if (a.rated < 2) return null;
  let v = 40 + a.avg * 5;
  v += Math.min(6, (a.goals / a.pj) * 6);
  v += Math.min(4, (a.assists / a.pj) * 5);
  if (a.att != null) v += Math.max(-5, Math.min(5, (a.att - .6) * 12));
  v += Math.min(3, a.figs);
  return Math.max(1, Math.min(99, Math.round(v)));
}

/* ============ Hojas ============ */
let layerInHistory = false, skipPop = false;
function openSheet(html, onClose){
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;
  if (!layerInHistory){ history.pushState({ layer: 1 }, ''); layerInHistory = true; }
  const scrim = $('#scrim'), sheet = scrim.querySelector('.sheet');
  scrim.addEventListener('click', (e) => { if (e.target === scrim){ closeSheet(); onClose && onClose(); } });
  sheet._onClose = onClose;
  return sheet;
}
function closeSheet(){
  $('#layer').innerHTML = '';
  setTimeout(() => { if (layerInHistory && !$('#layer').innerHTML){ layerInHistory = false; skipPop = true; history.back(); } }, 60);
}
window.addEventListener('popstate', () => {
  if (skipPop){ skipPop = false; return; }
  layerInHistory = false;
  const sh = $('#layer .sheet'); const cb = sh && sh._onClose;
  $('#layer').innerHTML = '';
  cb && cb();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#layer').innerHTML) closeSheet(); });
function confirmSheet(title, body, okLabel, onOk, danger = true){
  const el = openSheet(`<h2>${title}</h2><p class="muted" style="margin:6px 0 18px">${body}</p>
    <div class="stack"><button class="btn ${danger ? 'coral' : ''}" id="cf-ok">${okLabel}</button><button class="btn ghost" id="cf-no">Cancelar</button></div>`);
  $('#cf-no', el).onclick = closeSheet;
  $('#cf-ok', el).onclick = async () => { $('#cf-ok', el).disabled = true; await onOk(); };
}
function stepperHTML(id, val, label){ return `<div class="stepper" data-step="${id}"><button type="button" data-d="-1" aria-label="Menos ${label}">−</button><output id="${id}">${val}</output><button type="button" data-d="1" aria-label="Más ${label}">+</button></div>`; }
function bindSteppers(root, limits = {}){
  $$('.stepper[data-step]', root).forEach(s => {
    const o = $('output', s), [min, max, step, start] = limits[s.dataset.step] || [0, 30, 1];
    $$('button', s).forEach(b => b.onclick = () => {
      let v = parseFloat(o.textContent.replace(',', '.'));
      // Sin valor todavía: el primer toque arranca en `start` (ej. un 6 para el puntaje).
      if (isNaN(v)) v = start ?? min; else v = Math.max(min, Math.min(max, v + step * +b.dataset.d));
      o.textContent = fmt1(v); o.dataset.v = v; vibrate(8);
    });
  });
}
const stepVal = (root, id) => { const v = parseFloat($('#' + id, root).textContent.replace(',', '.')); return isNaN(v) ? null : v; };

function bindPitchDrag(){
  const pitch = $('#pitch');
  $$('.tok', pitch).forEach(t => {
    let sx, sy, moved = false, id = null;
    t.addEventListener('pointerdown', (e) => { id = e.pointerId; t.setPointerCapture(id); sx = e.clientX; sy = e.clientY; moved = false; });
    t.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
      moved = true; t.classList.add('drag');
      const r = pitch.getBoundingClientRect();
      const x = Math.max(4, Math.min(96, (e.clientX - r.left) / r.width * 100)), y = Math.max(3, Math.min(97, (e.clientY - r.top) / r.height * 100));
      t.style.left = x + '%'; t.style.top = y + '%';
      const s = PZ.slots[+t.dataset.i]; s.x = Math.round(x*10)/10; s.y = Math.round(y*10)/10;
    });
    t.addEventListener('pointerup', (e) => {
      if (e.pointerId !== id) return; id = null; t.classList.remove('drag');
      if (moved){ PZ.dirty = true; const b = $('#pz-save'); if (b) b.disabled = false; }
      else slotSheet(+t.dataset.i);
    });
    t.addEventListener('pointercancel', () => { id = null; t.classList.remove('drag'); });
  });
}

function trainCompliance(mid){
  let done = 0, count = 0;
  trainings().forEach(t => { const l = tlog(t.id, mid); if (tDone(l)){ done++; count++; } else if (tPast(t)) count++; });
  return { done, count };
}
function trainPendingForMe(){
  const me = member(meId()); if (!me || !me.plays) return [];
  return trainings().filter(t => {
    const l = tlog(t.id, meId());
    if (t.kind === 'casa') return !tDone(l) && !(l && l.status === 'no_puedo') && !tPast(t);
    return !tPast(t) && !l;
  }).sort((a,b) => (tWhen(a) ? new Date(tWhen(a)) : Infinity) - (tWhen(b) ? new Date(tWhen(b)) : Infinity));
}
function tProgress(t){
  const pl = players();
  const done = pl.filter(m => tDone(tlog(t.id, m.id))).length;
  return { done, total: pl.length };
}
function trainCard(t){
  const l = tlog(t.id, meId()), pr = tProgress(t), w = tWhen(t);
  const myPill = l ? `<span class="pill ${tDone(l) ? 'ok' : l.status === 'rechazado' || l.status === 'ausente' ? 'coral' : l.status === 'no_puedo' ? '' : 'sky'}">${TSTATUS[l.status][0]} ${TSTATUS[l.status][1]}</span>`
    : !tPast(t) && member(meId()) && member(meId()).plays ? `<span class="pill gold">${t.kind === 'casa' ? 'Pendiente' : 'Confirmá'}</span>` : '';
  return `<button class="card tap" data-train="${t.id}" style="padding:12px 14px">
    <span class="row" style="align-items:flex-start"><span style="font-size:28px;line-height:1">${t.kind === 'casa' ? '🏠' : '🏟️'}</span>
      <span class="grow"><b class="ell" style="display:block;font-size:17px">${esc(t.title)}</b>
        <span class="small muted">${t.kind === 'casa' ? (w ? `Hasta el ${fmtWhen(w)}` : 'Sin fecha límite') : fmtWhen(w)}${t.venue ? ' · ' + esc(t.venue) : ''}</span></span>
      ${t.mandatory ? '<span class="pill coral">Obligatorio</span>' : ''}</span>
    <span class="row" style="margin-top:10px;gap:10px"><span class="bar grow"><i style="width:${pr.total ? Math.round(pr.done / pr.total * 100) : 0}%"></i></span><span class="mini">${pr.done}/${pr.total} ${t.kind === 'casa' ? 'lo hicieron' : 'fueron'}</span>${myPill}</span>
  </button>`;
}

async function trainLog(tid, mid, p, msg){
  try { await rpc('fc_training_log', { ...P(), p_training: tid, p_member: mid, p }); vibrate(15); await refresh(); if (msg) toast(msg); return true; }
  catch(e){ toast(e.message, 3500); return false; }
}
function trainReasonSheet(t){
  const R = ['🤕 Lesión','💼 Trabajo','✈️ Viaje','🤒 Enfermo','👨‍👩‍👧 Familia','📚 Estudio'];
  const el = openSheet(`<h2>¿Por qué no podés?</h2><p class="muted">${t.mandatory ? 'Es obligatorio: el DT necesita saber el motivo.' : 'Así el DT sabe con quién cuenta.'}</p>

    <input class="input section" id="tr-o" maxlength="120" placeholder="Otro motivo">
    <button class="btn coral section" id="tr-ok">No puedo</button>`);

  };

// Achica la foto antes de subirla (las pruebas no necesitan alta resolución).
function compressPhoto(file, max = 900, limit = 250000){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .72, out = c.toDataURL('image/jpeg', q);
      while (out.length > limit && q > .3){ q -= .1; out = c.toDataURL('image/jpeg', q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer esa foto. Probá con otra.')); };
    img.src = url;
  });
}
function proofSheet(t){
  const l = tlog(t.id, meId());
  let photo = null;
  const el = openSheet(`<h2>${esc(t.title)}</h2><p class="muted">${t.proof ? 'Subí una foto como prueba: la ve todo el equipo.' : 'Contá cómo te fue (la foto es opcional).'}</p>

    <div class="card section row between" style="padding:10px 16px"><b>Minutos</b>${stepperHTML('pf-m', l && l.minutes ? l.minutes : 30, 'minutos')}</div>

    <p class="tiny muted" style="margin-top:10px;text-align:center">Pronto: conectar Strava, Garmin y otras apps para que quede la prueba sola.</p>`);
  bindSteppers(el, { 'pf-m': [0, 600, 5] });

  };
  $('#pf-ok', el).onclick = async () => {
    if (t.proof && !photo && !(l && l.has_photo)) return toast('Falta la foto de prueba 📸');
    const b = $('#pf-ok', el); b.disabled = true; b.textContent = 'Subiendo…';
    const ok = await trainLog(t.id, null, { status: 'hecho', minutes: stepVal(el, 'pf-m'), note: $('#pf-n', el).value.trim(), ...(photo ? { photo } : {}) }, '¡Bien ahí! Entrenamiento cumplido 💪');
    if (ok) closeSheet(); else { b.disabled = false; b.textContent = '✅ Listo, lo hice'; }
  };

function attendanceSheet(t){
  const rows = players().slice().sort((a,b) => a.name.localeCompare(b.name));
  const state = {}; rows.forEach(m => { const l = tlog(t.id, m.id); state[m.id] = l && l.status === 'presente' ? 'presente' : l && l.status === 'ausente' ? 'ausente' : l && l.status === 'voy' ? 'presente' : null; });
  const el = openSheet(`<h2>Asistencia</h2><p class="muted">${esc(t.title)} · tocá para marcar quién estuvo. Arrancan marcados los que dijeron que iban.</p>
    <div class="card section" style="padding:0 14px" id="at">${rows.map(m => { const l = tlog(t.id, m.id); return `<div class="dtrow"><span class="who"><span class="av" style="width:32px;height:32px;font-size:13px;background:${avColor(m.name)}">${esc(initials(m.name))}</span><span style="min-width:0"><b style="display:block">${esc(m.name)}</b><span class="mini">${l ? TSTATUS[l.status][1] + (l.reason ? ' · ' + esc(l.reason) : '') : 'Sin respuesta'}</span></span></span>
      <div class="seg" data-m="${m.id}" style="width:150px"><button type="button" data-v="presente" class="${state[m.id] === 'presente' ? 'on' : ''}">✅</button><button type="button" data-v="ausente" class="${state[m.id] === 'ausente' ? 'on' : ''}">❌</button></div></div>`; }).join('')}</div>
    <button class="btn section" id="at-ok">Guardar asistencia</button>`);
  $$('#at .seg', el).forEach(sg => $$('button', sg).forEach(b => b.onclick = () => { const id = sg.dataset.m; state[id] = state[id] === b.dataset.v ? null : b.dataset.v; $$('button', sg).forEach(x => x.classList.toggle('on', x.dataset.v === state[id])); }));
  $('#at-ok', el).onclick = async () => {
    const b = $('#at-ok', el); b.disabled = true; b.textContent = 'Guardando…';
    const jobs = rows.filter(m => state[m.id] && (tlog(t.id, m.id) || {}).status !== state[m.id])
      .map(m => rpc('fc_training_log', { ...P(), p_training: t.id, p_member: m.id, p: { status: state[m.id] } }));
    try { await Promise.all(jobs); closeSheet(); await refresh(); toast('Asistencia guardada ✅'); } catch(e){ toast(e.message); b.disabled = false; b.textContent = 'Guardar asistencia'; }
  };
}

function renderTabla(){

  ({ ranking: tablaRanking, planilla: tablaPlanilla, torneo: tablaTorneo, equipo: tablaEquipo })[v]($('#tb'));

function tablaRanking(box){
  const showR = S.T.team.ratings_public || isDT();
  const rows = players().map(m => ({ m, a: agg(m.id) })).filter(o => o.a.pj || o.a.tcount);
  const SORTS = [...(showR ? [['avg','Puntaje']] : []), ['pj','Partidos'], ['goals','Goles'], ['assists','Asistencias'], ['figs','Figura'], ['ent','Entrenos']];
  if (!SORTS.some(s => s[0] === S.sortBy)) S.sortBy = SORTS[0][0];
  const k = S.sortBy;
  const minPj = Math.max(1, Math.ceil(playedMatches().length / 3));
  const list = rows.filter(o => k === 'ent' ? o.a.tcount > 0 : k === 'avg' ? (o.a.avg != null && o.a.pj >= minPj) : o.a.pj > 0)
    .sort((a,b) => (b.a[k] ?? -1) - (a.a[k] ?? -1) || b.a.pj - a.a.pj || a.m.name.localeCompare(b.m.name));
  const val = (a) => k === 'avg' ? fmt1(a.avg) : k === 'ent' ? `${a.ent}%` : a[k];
  const medal = (i) => ['🥇','🥈','🥉'][i] || `<span class="num" style="font-size:20px;color:var(--muted)">${i+1}</span>`;
  box.innerHTML = `<div class="chips scroll" style="margin-bottom:12px">${SORTS.map(([s,l]) => `<button class="chip ${s === k ? 'on' : ''}" data-s="${s}">${l}</button>`).join('')}</div>
    ${k === 'avg' ? `<p class="tiny muted" style="margin:-4px 0 10px">Promedio de los puntajes del DT. Entran los que jugaron ${plural(minPj,'partido','partidos')} o más.</p>` : ''}
    ${list.length ? `<div class="list">${list.map((o, i) => `<button class="lrow" data-p="${o.m.id}" style="${o.m.id === meId() ? 'border-color:var(--grass)' : ''}"><span style="width:30px;text-align:center;font-size:22px">${medal(i)}</span><span class="av" style="width:34px;height:34px;font-size:13px;background:${avColor(o.m.name)}">${esc(initials(o.m.name))}</span><span class="t"><b>${esc(o.m.name)}</b><small>${k === 'ent' ? `${o.a.tdone} de ${o.a.tcount} entrenamientos` : `${o.a.pj} PJ · ${o.a.goals} G · ${o.a.assists} A`}</small></span><span class="rate ${k === 'avg' ? rateCls(o.a.avg) : 'r-na'}" style="${k !== 'avg' ? 'color:var(--ink)' : ''}">${val(o.a)}</span></button>`).join('')}</div>`
      : `<div class="card empty muted">Todavía no hay datos para este ranking.</div>`}
    ${!showR ? `<p class="small muted" style="margin-top:12px">🔒 Los puntajes del DT son privados en este equipo: cada uno ve el suyo en Inicio.</p>` : ''}`;
  $$('[data-s]', box).forEach(b => b.onclick = () => { S.sortBy = b.dataset.s; tablaRanking(box); });
  $$('[data-p]', box).forEach(b => b.onclick = () => playerSheet(b.dataset.p));
}
// La vista del Excel: jugadores × partidos.
function tablaPlanilla(box){
  const showR = S.T.team.ratings_public || isDT();
  const ms = playedMatches();
  const rows = players().map(m => ({ m, a: agg(m.id) })).sort((a,b) => (b.a.avg ?? -1) - (a.a.avg ?? -1) || b.a.pj - a.a.pj || a.m.name.localeCompare(b.m.name));
  if (!ms.length){ box.innerHTML = `<div class="card empty muted">Cuando haya partidos jugados, acá ves la planilla completa.</div>`; return; }
  const cell = (m, x) => {
    const s = S.T.stats.find(z => z.match_id === x.id && z.member_id === m.id);
    if (!s || !s.played) return '<span class="muted">·</span>';

function tablaEquipo(box){
  const ms = playedMatches();
  if (!ms.length){ box.innerHTML = `<div class="card empty muted">Cuando haya partidos jugados, acá ves cómo rinde el equipo.</div>`; return; }
  const bucket = (x) => !x.difficulty ? null : x.difficulty <= 2 ? 'Fáciles (★–★★)' : x.difficulty === 3 ? 'Parejos (★★★)' : 'Difíciles (★★★★+)';
  const groups = {};
  ms.forEach(x => { const b = bucket(x); if (!b) return; groups[b] = groups[b] || { G:0, E:0, P:0, n:0 }; const r = wdl(x); if (groups[b][r] != null) groups[b][r]++; groups[b].n++; });
  // Duplas: cuando juegan juntos, ¿cómo le va al equipo?
  const withRes = ms.filter(x => wdl(x) !== 'N');
  const pairs = {};
  withRes.forEach(x => {
    const ids = S.T.stats.filter(s => s.match_id === x.id && s.played).map(s => s.member_id).filter(id => member(id)).sort();
    for (let i = 0; i < ids.length; i++) for (let j = i+1; j < ids.length; j++){ const k = ids[i] + '|' + ids[j]; pairs[k] = pairs[k] || { n:0, w:0 }; pairs[k].n++; if (wdl(x) === 'G') pairs[k].w++; }
  });
  const minN = Math.max(2, Math.ceil(withRes.length / 2));
  const best = Object.entries(pairs).filter(([,v]) => v.n >= minN).sort((a,b) => b[1].w/b[1].n - a[1].w/a[1].n || b[1].n - a[1].n).slice(0, 5);
  let streak = 0, streakType = null;
  for (const x of ms.slice().reverse()){ const r = wdl(x); if (r === 'N') continue; if (!streakType) streakType = r; if (r === streakType) streak++; else break; }
  const scorers = players().map(m => ({ m, g: agg(m.id).goals })).filter(o => o.g).sort((a,b) => b.g - a.g).slice(0, 5);
  box.innerHTML = `
    ${streakType ? `<div class="banner ${streakType === 'G' ? 'ok' : streakType === 'E' ? 'gold' : 'coral'}">${streakType === 'G' ? '🔥' : streakType === 'E' ? '🤝' : '🧊'} <span>${streakType === 'G' ? `Racha de <b>${plural(streak,'victoria','victorias')}</b> seguidas` : streakType === 'E' ? `${plural(streak,'empate','empates')} seguidos` : `${plural(streak,'derrota','derrotas')} seguidas. A dar vuelta la página.`}</span></div>` : ''}
    ${scorers.length ? `<div class="section"><div class="section-title"><h2>Goleadores</h2></div><div class="list">${scorers.map((o,i) => `<div class="lrow" style="padding:8px 12px"><span style="width:26px;text-align:center">${['🥇','🥈','🥉'][i] || i+1}</span><span class="t"><b>${esc(o.m.name)}</b></span><span class="num" style="font-size:24px;font-weight:900">${o.g}</span></div>`).join('')}</div></div>` : ''}
    <div class="section"><div class="section-title"><h2>Según el rival</h2></div>
      ${Object.keys(groups).length ? `<div class="list">${Object.entries(groups).map(([k,v]) => `<div class="lrow" style="padding:10px 12px"><span class="t"><b>${k}</b><small>${plural(v.n,'partido','partidos')}</small></span><span class="row" style="gap:4px"><span class="wdl G">${v.G}</span><span class="wdl E">${v.E}</span><span class="wdl P">${v.P}</span></span></div>`).join('')}</div>`
        : `<div class="card small muted">Poné la dificultad del rival (★) en cada partido y acá ves cómo le va al equipo contra fáciles y difíciles.</div>`}
    </div>
    <div class="section"><div class="section-title"><h2>Duplas que ganan</h2></div>
      ${best.length ? `<div class="list">${best.map(([k,v]) => { const [a,b] = k.split('|').map(member); return `<div class="lrow" style="padding:10px 12px"><span class="t"><b>${esc(a.name)} + ${esc(b.name)}</b><small>Juntos: ${plural(v.n,'partido','partidos')}</small></span><span class="rate ${v.w/v.n >= .6 ? 'r-hi' : v.w/v.n >= .4 ? 'r-ok' : 'r-mid'}" style="font-size:18px">${Math.round(v.w/v.n*100)}%</span></div>`; }).join('')}</div>`
        : `<div class="card small muted">Con resultados cargados y más partidos, acá aparecen las duplas que más ganan juntas.</div>`}
    </div>`;
}

// Sugiere qué jugador de la planilla oficial es cada uno (por apodo, nombre o iniciales). El DT confirma.
function guessPlayer(m, players){
  const n = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const nick = n(m.name).replace(/[()]/g, ' ').split(/\s+/).filter(Boolean);
  let best = null, bestScore = 0;
  players.forEach(p => {
    const parts = n(p.name).split(/\s+/).filter(Boolean), ini = parts.map(x => x[0]).join('');
    let sc = 0;
    nick.forEach(k => {
      if (k.length >= 2 && ini === k) sc += 3;
      parts.forEach(w => { if (k.length >= 3 && (w.startsWith(k.slice(0, 4)) || k.startsWith(w.slice(0, 4)))) sc += w === parts[0] ? 1 : 2; });
    });
    if (sc > bestScore){ bestScore = sc; best = p; }
  });
  return bestScore >= 2 ? best : null;
}

      <label class="field"><span>Nombre</span><input class="input" id="st-n" maxlength="40" value="${esc(t.name)}"></label></div>
      <label class="field"><span>Categoría o torneo</span><input class="input" id="st-c" maxlength="40" value="${esc(t.category || '')}" placeholder="Ej: Alto Nono · Primera"></label>
      <div class="field"><span>¿Qué juegan?</span><div class="seg" id="st-f">${FORMATS.map(([n,l]) => `<button type="button" data-n="${n}" class="${n === size ? 'on' : ''}">${l.replace('Fútbol ','F')}</button>`).join('')}</div><div class="hint">Cambia las formaciones de la pizarra.</div></div>
      <div class="field"><span>¿Quién ve los puntajes del DT?</span><div class="seg" id="st-p"><button type="button" data-v="1" class="${pub ? 'on' : ''}">Todo el plantel</button><button type="button" data-v="0" class="${!pub ? 'on' : ''}">Cada uno el suyo</button></div><div class="hint">Por defecto los ve todo el equipo. Si preferís, cada uno ve solo el suyo.</div></div>
      <button class="btn" type="submit">Guardar</button>
    </form>
    <div class="card section"><b>Códigos de invitación</b><p class="small muted" style="margin:4px 0 10px">Si un código se compartió de más, generá uno nuevo. El viejo deja de funcionar.</p>
      <div class="grid2"><button class="btn ghost sm" style="width:100%" id="st-nc">Nuevo de jugadores</button><button class="btn ghost sm" style="width:100%" id="st-nd">Nuevo de DT</button></div></div>
    <button class="btn ghost section" id="st-lg">🏆 ${S.LG ? 'Torneo conectado: ' + esc(S.LG.torneo_name || S.LG.site) : 'Conectar el torneo oficial'}</button>`);
  $('#st-lg', el).onclick = () => { closeSheet(); setTimeout(leagueSetSheet, 80); };
  $$('#st-f button', el).forEach(b => b.onclick = () => { size = +b.dataset.n; $$('#st-f button', el).forEach(x => x.classList.toggle('on', x === b)); });
  $$('#st-p button', el).forEach(b => b.onclick = () => { pub = b.dataset.v === '1'; $$('#st-p button', el).forEach(x => x.classList.toggle('on', x === b)); });
  const save = async (p, msg) => { try { await rpc('fc_team_settings', { ...P(), p_team: S.teamId, p }); closeSheet(); await loadMe(); await refresh(); toast(msg); } catch(e){ toast(e.message); } };
  $('#st', el).onsubmit = (e) => { e.preventDefault(); if (size !== t.players_on_field) PZ = null; save({ name: $('#st-n', el).value.trim(), emoji: $('#st-e', el).value.trim(), category: $('#st-c', el).value.trim(), players_on_field: size, ratings_public: pub }, 'Ajustes guardados'); };
  $('#st-nc', el).onclick = () => save({ new_code: true }, 'Código de jugadores nuevo');
  $('#st-nd', el).onclick = () => save({ new_dt_code: true }, 'Código de DT nuevo');
}

/* ============ Listo ============ */
window.addEventListener('online', () => { if (S.T) refresh(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.T && !$('#layer').innerHTML) refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>
