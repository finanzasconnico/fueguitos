<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fueguitos</title>
<meta name="description" content="Mantené el fueguito de deporte, lectura y meditación con tus amigos.">
<meta name="theme-color" content="#FFF4EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170E0B" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fueguitos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4EC; --card:#FFFFFF; --ink:#26140E; --muted:#7A5F55; --line:#F2DDD0;
  --fire:#FF5A1F; --fire-dark:#CC3F0B; --fire-soft:#FFE3D3;
  --gold:#FFB800; --ember:#FF2E63; --ice:#3AA9E6; --ice-dark:#1E86C0; --ice-soft:#E2F3FC;
  --ok:#23A566; --ok-soft:#DDF5E8; --danger:#D6364A;
  --gray-flame:#DCC9BF; --gray-flame-2:#EFE1D8;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --field:#FFFFFF; --nav:rgba(255,255,255,.96); --party:#1E0F0A; --toast:#26140E; --toast-ink:#FFFFFF;
  --ok-ink:#16603F; --ok-line:#BFE8D2; --fire-ink:#8A3208; --ice-ink:#155F88;
  --heat1:#FFD3BC; --heat2:#FF9E6E; --heat-ice:#A9DCF6;
  color-scheme:light;
}
/* Modo oscuro: se usa mucho de noche, antes del corte de las 5 AM */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#170E0B; --card:#241611; --ink:#FBEFE8; --muted:#C2A69A; --line:#3E2A21;
    --fire-dark:#B83A0C; --fire-soft:#41200F; --ice-soft:#132A38; --ice-dark:#4DB5EE; --ok-soft:#14301F;
    --gray-flame:#5A4439; --gray-flame-2:#735A4D;
    --field:#1D120E; --nav:rgba(23,14,11,.94); --party:#0E0705; --toast:#FBEFE8; --toast-ink:#170E0B;
    --ok-ink:#7DDBA8; --ok-line:#2C5A40; --fire-ink:#FFB08A; --ice-ink:#8FD2F7;
    --heat1:#6A3420; --heat2:#B9552A; --heat-ice:#2A5F80;
    color-scheme:dark;
  }
}
::selection{background:var(--fire);color:#fff}
input{caret-color:var(--fire)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,label,input,.habit{touch-action:manipulation}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--ice-dark)}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px;border-radius:8px}
.wrap{max-width:480px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(96px + var(--safe-b))}
.wrap.with-bar{padding-bottom:calc(160px + var(--safe-b))}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.section{margin-top:26px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}

/* Botones gorditos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:17px;background:var(--fire);color:#fff;box-shadow:0 4px 0 var(--fire-dark);transition:transform .06s,box-shadow .06s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--fire-dark)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ice{background:var(--ice);box-shadow:0 4px 0 var(--ice-dark)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.green{background:var(--ok);box-shadow:0 4px 0 #17804E}
.btn.danger{background:var(--danger);box-shadow:0 4px 0 #A12233}
.link.muted{color:var(--muted);font-weight:600}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px;width:auto}
.link{color:var(--ice-dark);font-weight:700;font-size:15px}
.link.danger{color:var(--danger)}

.card{background:var(--card);border-radius:20px;padding:16px;border:2px solid var(--line)}
.field{display:block}
.field span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.input{width:100%;min-height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:var(--field);font-size:17px}
.input:focus{border-color:var(--ice);outline:none}
textarea.input{padding:12px 14px;min-height:80px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

/* Encabezado */
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.top .date{font-size:15px;color:var(--muted);font-weight:600}

/* Tarjetas de hábito */
.habits{display:grid;gap:12px}
.habit{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 14px 12px 10px;text-align:left;width:100%;position:relative;transition:border-color .12s,background .12s}
.habit.sel{border-color:var(--fire);background:var(--fire-soft)}
.habit.done{border-color:var(--ok-line)}
.habit.failed{border-color:var(--fire)}
.habit.late{opacity:.6}
.nightq{display:flex;gap:8px;margin-top:8px}
.habits .flamebox{cursor:pointer}
.ring{position:relative;width:58px;height:58px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--fire);transition:stroke-dasharray .4s}
.ring.full .fg{stroke:var(--ok)}
.ring b{font-size:14px;font-weight:800}
.ring.full b{color:var(--ok);font-size:20px}
.calstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.calstats div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.calstats b{display:block;font-size:22px;font-weight:800}
.calstats span{font-size:12px;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px}
.cal em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-weight:700;font-size:14px;border:2px solid transparent}
.cal span.fut{color:var(--muted);opacity:.5}
.cal span.hecho,.calkey.hecho{background:var(--fire);color:#fff}
.cal span.hielo,.calkey.hielo{background:var(--heat-ice)}
.cal span.descanso,.calkey.descanso{background:var(--line)}
.cal span.miss,.calkey.miss{border:2px dashed var(--line);color:var(--muted)}
.cal span.today{box-shadow:0 0 0 2px var(--ink)}
.calkey{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;box-sizing:border-box}
.gst{margin-bottom:12px}
.ava{position:relative;display:inline-block;flex:none;border-radius:50%;overflow:visible}
.ava svg{position:absolute;left:10%;top:8%;width:80%;height:84%}
.ava i{position:absolute;font-style:normal;line-height:1;transform:translateX(-50%)}
.ava .ava-h{left:50%;top:-14%;font-size:.42em}
.ava .ava-body{left:50%;top:14%;font-size:.66em}
.shopit.lock .prev{filter:grayscale(1) brightness(.6);opacity:.45}
.shopit.lock b{color:var(--muted)}
.ava .ava-g{left:50%;top:50%;font-size:.3em}
.ava .ava-x{left:86%;top:60%;font-size:.3em}
.eggcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:14px 0 0;font:inherit;color:inherit}
.eggimg{width:64px;height:64px;flex:none;animation:wobble 2.4s ease-in-out infinite}
.eggimg svg{width:100%;height:100%}
@keyframes wobble{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.eggimg{animation:none}}
.hatch{display:inline-block;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.coins{font-weight:800;font-size:18px;background:var(--fire-soft);padding:6px 12px;border-radius:999px}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shopit{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:inherit;color:inherit}
.shopit.on{border-color:var(--fire);background:var(--fire-soft)}
.shopit.cant{opacity:.55}
.shopit .prev{height:62px;display:grid;place-items:center}
.shopit b{font-size:14px}
.avcard{display:flex;gap:16px;align-items:center}
.onb h1{margin-top:6px}
.onb .lead{font-size:17px;margin:6px 0 16px}
.onb-dots{display:flex;gap:6px;margin-top:8px}
.onb-dots i{width:26px;height:6px;border-radius:6px;background:var(--line)}
.onb-dots i.on{background:var(--fire)}
.onb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--card);min-height:104px;font:inherit;color:inherit}
.onb-card .e{font-size:30px;line-height:1}
.onb-card b{font-size:16px;line-height:1.2}
.onb-card .tick{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.onb-card.on{border-color:var(--fire);background:var(--fire-soft)}
.onb-card.on .tick{background:var(--fire);border-color:var(--fire);color:#fff}
.onb-do{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--card);text-align:left;font:inherit;color:inherit}
.onb-do .e{font-size:28px}
.onb-do b{flex:1;font-size:17px}
.onb-do .tag{font-weight:800;font-size:14px;color:#fff;background:var(--fire);padding:8px 12px;border-radius:12px;white-space:nowrap}
.onb-do.done{border-color:var(--ok-line)}
.onb-do.done .tag{background:var(--ok)}
.nudges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hrow.bench>div:first-child{opacity:.6}
button.week.pair{width:100%;text-align:left;display:block;margin:0;font:inherit;color:inherit}
.week.pair .big{font-size:20px;font-weight:800}
.cue{margin-top:2px}
.gst .big{font-size:24px;font-weight:800;line-height:1.1}
.habit.done .progress>i{background:var(--ok)}
.nightq .btn{flex:1;min-height:40px}
button.undo{background:none;border:0;padding:0;display:block;margin-top:8px;font-family:inherit;cursor:pointer}
.goal{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}
.goal.near{color:var(--fire-ink)}
.check.x{background:var(--fire);border-color:var(--fire)}
.flamebox{position:relative;width:74px;height:78px;display:grid;place-items:center}
.flamebox svg{width:58px;height:72px}
.flamebox .n{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-weight:800;font-size:22px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.flamebox.off .n{color:var(--muted);text-shadow:none}
.habit .name{font-weight:800;font-size:19px;display:flex;align-items:center;gap:6px}
.meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink)}
.plan{border-color:var(--fire)}
.pses{margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--fire-soft);color:var(--fire-ink)}
.pses b{font-size:17px}
.pill.ice{background:var(--ice-soft);color:var(--ice-dark)}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.fire{background:var(--fire-soft);color:var(--fire-ink)}
.check{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.habit.sel .check{background:var(--fire);border-color:var(--fire)}
.habit.done .check{background:var(--ok);border-color:var(--ok)}
.undo{font-size:12px;font-weight:700;color:var(--muted);text-decoration:underline;margin-top:4px}

.banner{border-radius:16px;padding:12px 14px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.banner.ice{background:var(--ice-soft);color:var(--ice-ink)}
.banner.ok{background:var(--ok-soft);color:var(--ok-ink)}
.banner.fire{background:var(--fire-soft);color:var(--fire-ink)}

/* Motivación */
.quote{position:relative;margin:0 0 16px;padding:14px 16px 14px 46px;border-radius:18px;background:var(--fire-soft);color:var(--fire-ink)}
.quote p{margin:0;font-weight:700;font-size:17px;line-height:1.3;text-wrap:balance}
.quote .qmark{position:absolute;left:12px;top:4px;font-size:52px;font-weight:800;color:var(--fire);line-height:1}
.banner.urgent{border:2px solid var(--fire)}
.music{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line);text-decoration:none;color:var(--ink)}
.music:last-child{border-bottom:0}
.music .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--fire-soft)}
.music b{display:block;font-size:16px}
.music .go{margin-left:auto;font-weight:800;color:var(--ok-ink);font-size:14px;flex:none}

/* PIN y extras */
.input.pin{letter-spacing:.5em;font-size:22px;font-weight:800;text-align:center;max-width:180px}
details.more summary{cursor:pointer;font-weight:700;color:var(--ice-dark);font-size:15px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.nudge{border-color:var(--fire)}
.push-card{background:var(--fire-soft)}
.plist{margin:0 0 12px;padding-left:18px}.plist li{margin:2px 0}

/* Subsecciones del grupo */
.week{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.wrow{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;font-size:15px}
.wrow b{font-size:20px;font-variant-numeric:tabular-nums}
.gav{display:inline-grid;place-items:center;border-radius:18px;background:var(--fire-soft);object-fit:cover;flex:none}
.gname{overflow-wrap:break-word;hyphens:auto;font-size:clamp(24px,7.5vw,30px)}
.achs{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 14px}
.achemo{flex:1;font-size:20px;letter-spacing:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ach{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.ach .aemo{font-size:30px;width:40px;text-align:center;filter:grayscale(1);opacity:.45}
.ach.on{border-color:var(--ok-line)}.ach.on .aemo{filter:none;opacity:1}
.gacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.gacts .btn{width:100%}
.code-in{text-transform:uppercase;letter-spacing:.18em;font-weight:800;text-align:center}
.code-in.big{font-size:28px;min-height:62px}
.code-in::placeholder{letter-spacing:.18em;opacity:.35}
.member{cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .12s,border-color .12s}
.member:active{transform:scale(.98);border-color:var(--fire)}
.gifthint{font-size:15px}
.gdescr{margin:-8px 0 14px;color:var(--muted);font-size:15px}
.subtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--line);margin:0 0 16px}
.subtabs button{min-height:40px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.subtabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Compartido */
.share{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:2px solid var(--line)}
.share:last-child{border-bottom:0}
.share .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--fire-soft)}
.share .stitle{display:block;font-weight:800;font-size:16px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.share .react{flex:none}

/* Torneos */
.emojis button.on{border-color:var(--fire);background:var(--fire-soft)}
.fmt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--card);min-height:84px}
.fmt.on{border-color:var(--fire);background:var(--fire-soft)}
.fmt .small{color:var(--muted);font-weight:600}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.prow .link{font-size:18px;padding:0 6px}
.avbtn{border-radius:50%}
.avpick{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.avpick button{font-size:22px;width:40px;height:40px;border-radius:12px}
.pav{display:inline-grid;place-items:center;border-radius:50%;flex:none;object-fit:cover;color:#fff;font-weight:800;line-height:1}
.tview .inner{max-width:960px}
.duel{cursor:pointer}
.dgrid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.dside{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.dnick{font-weight:700;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dscore{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.dside.lead .dscore{color:var(--fire-ink)}
.dvs{font-size:26px;font-weight:800;color:var(--muted)}
.dplus{min-height:36px;padding:0 16px}
.serie{display:grid;gap:4px;margin-bottom:10px}
.sp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:4px 0}
.sp b{font-size:26px;font-variant-numeric:tabular-nums}
.sp.lead b{color:var(--fire-ink)}
.cur{background:var(--bg);border-radius:14px;padding:10px 12px}
.cur .prow2{grid-template-columns:auto 1fr auto auto;padding:8px 0}
.rrow{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px}
.rin{text-align:center;font-size:24px;font-weight:800;flex:1}
.rsign{min-width:48px}
.prow2{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line)}
.prow2.lead .dscore{color:var(--fire-ink)}
.pts{min-width:52px;text-align:right;padding:2px 4px;border-radius:10px}
.pts:active{background:var(--fire-soft)}
.pm{display:flex;gap:6px}.pm .btn{min-width:44px;min-height:40px;padding:0 10px;font-size:18px}
.tallies{display:inline-flex;flex-wrap:wrap;gap:4px;max-width:118px;justify-content:flex-end}
.tally{width:22px;height:24px;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.dend{background:var(--fire-soft);color:var(--fire-ink);border-radius:12px;padding:8px 12px;font-size:15px;margin-bottom:8px}
.drow{display:grid;grid-template-columns:20px auto 1fr auto auto;align-items:center;gap:10px;padding:8px 0;border-top:2px solid var(--line)}

// Aviso con botones (anotado → foto / deshacer).
function snack(html, ms = 6000){
  document.querySelectorAll('.snack, .toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'snack'; t.setAttribute('role', 'status'); t.innerHTML = html;
  document.body.appendChild(t); clearTimeout(snack.timer); snack.timer = setTimeout(() => t.remove(), ms);
  return t;
}
function toast(msg, ms=2400){
  document.querySelectorAll('.toast').forEach(x => x.remove()); // uno a la vez, sin encimarse
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); let ok=false; try { ok = document.execCommand('copy'); } catch(_){} ta.remove(); return ok;
  }
}
function vibrate(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
let audioCtx;
function beep(freq=880, dur=0.18, times=1){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i=0;i<times;i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + i*0.28;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.start(t0); o.stop(t0+dur+0.02);
    }
  } catch(e){}
}

  YA_SE_JUGO_SIGUIENTE: 'Ese resultado ya definió el partido siguiente. Borrá primero el de la ronda siguiente.'
};
async function rpc(fn, args={}){
  let res;
  const ctl = 'AbortController' in window ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 12000) : null;
  try {
    res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args), signal: ctl ? ctl.signal : undefined
    });
  } catch(e){
    const err = new Error('Sin conexión. Revisá tu internet y probá de nuevo.'); err.offline = true;
    setNet(false); throw err;
  } finally { clearTimeout(timer); }
  setNet(true);
  const txt = await res.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!res.ok){
    const code = (data && data.message) || '';
    if (code === 'SESION_INVALIDA'){ LS.del('racha_token'); S.token = null; }
    throw new Error(ERRORS[code] || 'Algo falló. Probá de nuevo en un rato.');
  }
  return data;
}

/* ============ Sin señal: bandeja de salida y caché ============ */
// Lo que se anota sin señal queda acá (en orden) y se sube solo cuando vuelve la conexión.
const OUTBOX_KEY = 'fueguitos_outbox';
const outboxGet = () => { try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); } catch(e){ return []; } };
const outboxSet = (a) => { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(a)); return true; } catch(e){ return false; } };
let netOnline = navigator.onLine !== false, flushing = false;
function setNet(on){ if (netOnline !== on){ netOnline = on; renderNet(); if (on) flushOutbox(); } }
function enqueue(fn, args, label){
  const box = outboxGet();
  box.push({ fn, args, label, t: Date.now() });
  if (!outboxSet(box)){
    // Sin lugar (una foto muy pesada): se guarda sin la foto.
    if (args && args.p_photo){ box[box.length - 1].args = { ...args, p_photo: null }; if (outboxSet(box)){ toast('Sin señal: la foto no entró, pero se anotó igual.', 3500); renderNet(); return; } }
    toast('No hay lugar para guardar sin señal. Probá cuando vuelva la conexión.', 4000); return;
  }
  renderNet();
}
// Llamada que, si no hay señal, se guarda para después. Si ya hay cosas esperando, se pone en la fila para respetar el orden.
// `withDay`: si queda en la fila, se guarda el día real en que se hizo (corte a las 5 AM, como el servidor).
const localToday = () => { const d = new Date(Date.now() - 5 * 36e5); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
async function rpcQ(fn, args, label, withDay){
  const queued = () => { enqueue(fn, withDay ? { ...args, p_day: localToday() } : args, label); return { queued: true }; };
  if (outboxGet().length){ const q = queued(); flushOutbox(); return q; }
  try { return await rpc(fn, args); }
  catch(e){ if (e.offline) return queued(); throw e; }
}
async function flushOutbox(){
  if (flushing || !S.token) return;
  let box = outboxGet(); if (!box.length) return;
  flushing = true; renderNet();
  let sent = 0;
  while (box.length){
    const it = box[0];
    try { await rpc(it.fn, it.args); sent++; }
    catch(e){
      if (e.offline) break;
      toast(`No se pudo subir "${it.label}": ${e.message}`, 4000); // error real (ej. duelo terminado): se descarta
    }
    box.shift(); outboxSet(box);
  }
  flushing = false; renderNet();
  if (sent){
    toast(`☁️ Listo: se subió lo que anotaste sin señal (${sent}).`, 3000);
    try { await loadMe(); if (S.groupId && S.group) await loadGroup(); if (S.groupId) await loadDuels(S.groupId); renderMain(); } catch(e){}
  }
}
function renderNet(){
  let el = document.getElementById('net');
  const n = outboxGet().length;
  if (netOnline && !n){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement('div'); el.id = 'net'; el.setAttribute('role', 'status'); document.body.appendChild(el); el.onclick = () => flushOutbox(); }
  el.className = netOnline ? 'net sync' : 'net';
  el.textContent = !netOnline ? `☁️ Sin señal${n ? ` · ${n} por subir` : ''}` : flushing ? `☁️ Subiendo ${n}…` : `☁️ ${n} por subir · tocá para reintentar`;
}
window.addEventListener('online', () => setNet(true));
window.addEventListener('offline', () => setNet(false));
setInterval(() => { if (outboxGet().length) flushOutbox(); }, 30000);
// Caché para abrir la app sin señal.
const cacheSet = (k, v) => { try { localStorage.setItem('fueguitos_c_' + k, JSON.stringify(v)); } catch(e){} };
const cacheGet = (k) => { try { return JSON.parse(localStorage.getItem('fueguitos_c_' + k) || 'null'); } catch(e){ return null; } };

const S = {
  token: LS.get('racha_token'),
  me: null, history: [],
  tab: 'hoy',
  groupId: LS.get('racha_group'),
  group: null, groupLoading: false,
  sel: new Set(),
  pendingJoin: null, quick: null,
  onboarding: false,
  lifts: null, acts: null, pendingActivity: null,
  gsub: ['racha','compartido','duelos'].includes(LS.get('fueguitos_gsub')) ? LS.get('fueguitos_gsub') : 'racha',
  shares: {}, tourns: {}, duels: {}, week: {}, ach: {}
};
const P = () => ({ p_token: S.token });

async function loadMe(){
  S.me = await rpc('api_me', P());
  cacheSet('me', S.me);
  rpc('api_history', P()).then(h => { S.history = h || []; if (S.tab === 'hoy' || S.tab === 'perfil') renderMain(); }).catch(()=>{});
}
async function loadGroup(){
  const groups = S.me?.groups || [];
  if (!groups.length){ S.group = null; return; }
  if (!groups.find(g => g.id === S.groupId)) S.groupId = groups[0].id;
  LS.set('racha_group', S.groupId);
  S.groupLoading = true;
  try { S.group = await rpc('api_group', { ...P(), p_group: S.groupId }); cacheSet('group_' + S.groupId, S.group); }
  catch(e){ const c = e.offline && cacheGet('group_' + S.groupId); if (c) S.group = c; else throw e; }
  finally { S.groupLoading = false; }
}

/* ============ Arranque ============ */
async function boot(){
  const q = new URLSearchParams(location.search);
  if (q.get('k')) { S.token = q.get('k'); LS.set('racha_token', S.token); }
  if (q.get('g')) S.pendingJoin = q.get('g').toUpperCase();
  if (q.get('anotar')) S.quick = q.get('anotar');
  S.rapido = q.get('rapido') === '1';
  S.rutina = q.get('rutina');
  if (['hoy','grupo','torneos','rutinas','perfil'].includes(q.get('tab'))) S.tab = q.get('tab');
  // Dentro de WhatsApp/Instagram se deja el link intacto, para que "Abrir en el navegador" conserve la invitación.
  if (q.toString() && !inAppBrowser()) history.replaceState(null, '', location.pathname);

  if (!S.token){ renderWelcome(); maybeInstallGuide(); return; }
  try {
    await loadMe();
  } catch(e){
    if (!S.token){ renderWelcome(); return; }
    const c = e.offline && cacheGet('me');
    if (!c){ renderOffline(e.message); return; }
    S.me = c; setNet(false);
  }
  await afterLogin();
  flushOutbox();
  maybeInstallGuide();
  syncPush().then(() => { if (IS_NATIVE && S.me && !S.onboarding) renderMain(); });
  autoHealth();
}

async function afterLogin(){
  if (S.pendingJoin){
    try {
      const g = await rpc('api_join_group', { ...P(), p_code: S.pendingJoin });
      S.groupId = g.id; LS.set('racha_group', g.id);
      toast(`Te sumaste a ${g.name} 🔥`);
      S.me = await rpc('api_me', P());
    } catch(e){ toast(e.message, 3500); }
    S.pendingJoin = null;
  }
  if (!S.me.habits.length){ S.onboarding = true; renderOnboarding(); return; }
  renderShell();
  loadAvatar();
  if (S.rutina === 'tiempo'){ S.rutina = null; runTime(); }
  if (S.quick){
    const h = S.me.habits.find(x => x.name.toLowerCase() === S.quick.toLowerCase());
    S.quick = null;
    if (h && S.rapido) quickToggle(h);
    else if (h && !h.done_today){ S.sel = new Set([h.id]); openCheckinSheet(); }
  }
}

const UA = navigator.userAgent;
const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /android/i.test(UA);
// Navegadores metidos adentro de otras apps (WhatsApp, Instagram…): no dejan instalar.
const inAppBrowser = () => /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(UA);

// Cartel grande la primera vez que se entra desde el navegador del celu.
function maybeInstallGuide(){
  if (isStandalone() || !(isIOS || isAndroid)) return;
  if (LS.get('fueguitos_guia') && !inAppBrowser()) return;
  const inApp = inAppBrowser();
  const iosOther = isIOS && /CriOS|FxiOS|EdgiOS/i.test(UA);
  // En iPhone la app instalada no comparte datos con Safari: se lleva la invitación o la cuenta copiando un link.
  const hasPin = !!(S.me && S.me.user.has_pin);
  const carry = S.token && !hasPin ? `${appBase()}?k=${S.token}` : (!S.token && S.pendingJoin ? inviteLink(S.pendingJoin) : '');
  let arrow = 'tr', title, steps;
  if (inApp){
    title = 'Abrila en el navegador';
    steps = [`Tocá el menú <b>⋮</b> o <b>···</b> ${isIOS ? '(arriba o abajo a la derecha)' : 'arriba a la derecha'}.`, `Elegí <b>Abrir en ${isIOS ? 'Safari' : 'Chrome'}</b> (o "Abrir en el navegador").`, 'Ahí te mostramos cómo instalarla.'];
  } else if (isIOS){
    arrow = iosOther ? 'tr' : 'br';
    title = 'Instalá Fueguitos';
    steps = [
      ...(carry ? [`Primero tocá <b>${S.token ? 'Copiar mi cuenta' : 'Copiar mi invitación'}</b> (acá abajo).`] : []),
      iosOther ? 'Tocá <b>Compartir</b> <span class="ios-share" aria-hidden="true"></span> arriba a la derecha.' : 'Tocá <b>···</b> abajo a la derecha y después <b>Compartir</b> <span class="ios-share" aria-hidden="true"></span> (en iPhone más viejos, Compartir está abajo al medio).',
      'Bajá y elegí <b>Agregar a pantalla de inicio</b>.',
      S.token && hasPin ? 'Abrí Fueguitos desde el ícono nuevo y entrá con tu apodo y PIN.' : carry ? 'Abrí Fueguitos desde el ícono nuevo, tocá <b>Ya tengo cuenta</b> y pegá el link abajo de todo.' : 'Abrí Fueguitos desde el ícono nuevo y creá tu cuenta ahí.',
      'Ahí adentro activá los <b>avisos 🔔</b>: así no perdés la racha.'
    ];
  } else {
    title = 'Instalá Fueguitos';
    steps = deferredInstall ? ['Tocá el botón naranja. Listo, queda en tu pantalla como cualquier app.'] : ['Tocá el menú <b>⋮</b> arriba a la derecha.', 'Elegí <b>Instalar app</b> (o "Agregar a pantalla principal").', 'Abrí Fueguitos desde el ícono nuevo.'];
  }
  const g = document.createElement('div');
  g.className = 'guide'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-modal', 'true'); g.setAttribute('aria-label', title);
  g.innerHTML = `${(inApp || !deferredInstall || isIOS) ? `<div class="garrow ${arrow}" aria-hidden="true"><svg viewBox="0 0 48 72"><path d="M24 70V8M8 24 24 6l16 18" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>` : ''}
    <div class="gcard">
      <div class="glogo">${flameSVG(true)}</div>
      <h2>${title}</h2>
      <p class="muted" style="margin:6px 0 14px">Queda con su ícono en tu pantalla, a pantalla completa, como cualquier app.</p>
      <ol class="gsteps">${steps.map(x => `<li>${x}</li>`).join('')}</ol>
      ${!inApp && carry ? `<button class="btn ice" id="g-copy">${S.token ? 'Copiar mi cuenta' : 'Copiar mi invitación'}</button>` : ''}
      ${!inApp && !isIOS && deferredInstall ? '<button class="btn" id="g-inst">Instalar Fueguitos</button>' : ''}
      <button class="link" id="g-skip" style="display:block;margin:14px auto 0">${inApp ? 'Seguir acá igual' : 'Ahora no, seguir en el navegador'}</button>
    </div>`;
  document.body.appendChild(g);
  const close = () => { LS.set('fueguitos_guia', '1'); g.remove(); };
  $('#g-skip', g).onclick = close;
  const c = $('#g-copy', g); if (c) c.onclick = async () => { (await copy(carry)) ? toast('Copiado. Ahora instalala 👇', 3000) : toast(carry, 6000); };
  const i = $('#g-inst', g); if (i) i.onclick = async () => { deferredInstall.prompt(); const r = await deferredInstall.userChoice; deferredInstall = null; if (r.outcome === 'accepted') close(); };
}

const pinInput = (id, ph = '••••') => `<input class="input pin" id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="${ph}">`;

// Entrar desde otro dispositivo: apodo + PIN. También acepta el link de acceso o una invitación.
function haveAccountSheet(){
  const el = openSheet(`<h2>Entrar a mi cuenta</h2>
    <p class="muted">Con tu apodo y tu PIN entrás desde cualquier celu.</p>
    <form class="stack section" id="lg">
      <label class="field"><span>Apodo</span><input class="input" id="lg-n" maxlength="30" autocomplete="username" placeholder="Tu apodo"></label>
      <label class="field"><span>PIN</span>${pinInput('lg-p')}</label>
      <button class="btn" type="submit">Entrar</button>
      <button type="button" class="link small" id="lg-forgot">¿Te olvidaste el PIN?</button>
    </form>
    <details class="section more"><summary>No tengo PIN / tengo un link o invitación</summary>
      <p class="muted small">Pegá tu link de acceso (Perfil → Copiar mi link) o el link de invitación de tu grupo.</p>
      <div class="stack">
        <input class="input" id="h-link" inputmode="url" autocomplete="off" placeholder="https://fueguitos.vercel.app/?k=…">
        <div class="grid2">${navigator.clipboard && navigator.clipboard.readText ? '<button class="btn ghost sm" style="width:100%" id="h-paste">Pegar</button>' : '<span></span>'}<button class="btn ice sm" style="width:100%" id="h-go">Usar link</button></div>
      </div>
    </details>`);
  $('#lg', el).onsubmit = async (e) => {
    e.preventDefault();
    const n = $('#lg-n', el).value.trim(), pin = $('#lg-p', el).value;
    if (!n || !/^\d{4}$/.test(pin)){ toast('Poné tu apodo y los 4 números del PIN'); return; }
    const b = e.target.querySelector('button'); b.disabled = true;
    try {
      const r = await rpc('api_login', { p_nick: n, p_pin: pin });
      if (r.ok){ LS.set('racha_token', r.token); location.replace(location.pathname + (S.pendingJoin ? `?g=${S.pendingJoin}` : '')); return; }
      toast({ SIN_PIN: 'Esa cuenta todavía no tiene PIN. Entrá con tu link de acceso (abajo) y creá el PIN en Perfil.',
              PIN_BLOQUEADO: `Demasiados intentos. Probá de nuevo en ${r.min || 15} min.`,
              LOGIN_INVALIDO: r.quedan != null ? `Apodo o PIN incorrecto. Te quedan ${r.quedan} intentos.` : 'Apodo o PIN incorrecto.' }[r.error] || 'No se pudo entrar.', 4200);
    } catch(err){ toast(err.message); }
    b.disabled = false;
  };
  $('#lg-forgot', el).onclick = () => forgotPinSheet($('#lg-n', el).value.trim());
  const p = $('#h-paste', el); if (p) p.onclick = async () => { try { $('#h-link', el).value = (await navigator.clipboard.readText()).trim(); } catch(e){ toast('Mantené apretado el cuadro y tocá Pegar'); } };
  $('#h-go', el).onclick = () => {
    const raw = $('#h-link', el).value.trim(); let k = null, g = null;
    try { const u = new URL(raw); k = u.searchParams.get('k'); g = u.searchParams.get('g'); } catch(e){}
    if (!k && /^[0-9a-f-]{36}$/i.test(raw)) k = raw;
    if (!g && /^[a-z]{6}$/i.test(raw)) g = raw;
    if (k){ LS.set('racha_token', k); location.replace(location.pathname); return; }
    if (g){ S.pendingJoin = g.toUpperCase(); closeSheet(); renderWelcome(); toast('Invitación lista. Poné tu apodo 🔥'); return; }
    toast('Ese link no parece de Fueguitos. Revisalo.');
  };
}

const VAPID = 'BNI5NZVkLJbDX8l1e32yE__SU_NzbJMWF0tBVc5eAoB7K0VU84HXuraEqiGI37FrwWz8tzD9_jNg1-YRJwjHeoE';
const PUSH_FN = `${SB_URL}/functions/v1/push-recordatorios`;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
// En iPhone solo funcionan con la app instalada en la pantalla de inicio.
const pushNeedsInstall = () => isIOS && !isStandalone();
const b64u = (s) => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushSubscribe(){
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
  const j = sub.toJSON();
  await rpc('api_push_subscribe', { ...P(), p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
}
async function enablePushNative(){
  const r = await nat('registerPush');
  if (!r || !r.granted){ S.npush = 'denied'; toast('Sin permiso no te podemos avisar. Activalo en Ajustes → Fueguitos → Notificaciones.', 4200); return false; }
  try {
    await rpc('api_push_subscribe_apns', { ...P(), p_device: r.token });
    S.npush = 'granted';
    if (S.me.user.remind_hour == null){ await rpc('api_set_reminder', { ...P(), p_hour: 22 }); S.me.user.remind_hour = 22; }
    toast('¡Listo! Te avisamos si te falta anotar 🔔'); return true;
  } catch(e){ toast('No se pudo activar: ' + e.message, 4000); return false; }
}
async function enablePush(){
  if (IS_NATIVE) return enablePushNative();
  if (!pushSupported()){ toast('Este navegador no permite avisos'); return false; }
  if (pushNeedsInstall()){ toast('En iPhone los avisos andan con la app instalada. Instalala primero.', 4000); return false; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted'){ toast('Sin permiso no te podemos avisar. Lo podés activar en los ajustes del celu.', 4200); return false; }
  try {
    await pushSubscribe();
    if (S.me.user.remind_hour == null){ await rpc('api_set_reminder', { ...P(), p_hour: 22 }); S.me.user.remind_hour = 22; }
    toast('¡Listo! Te avisamos si te falta anotar 🔔'); return true;

}

      const x = (r.results || [])[0] || {}, hh = S.me.habits.find(y => y.id === h.id) || h;

  const pr = (S.av.progress || []).filter(x => x.next).sort((a, b) => (a.next_days - a.run) - (b.next_days - b.run))[0];
  if (!pr) return '<div style="margin-bottom:10px"></div>';
  const c = CHARS[pr.next];
  return `<div class="small" style="margin-bottom:10px">Próximo: ${c[0]} <b>${esc(c[1])}</b> · ${pr.run} de ${pr.next_days} días de ${esc(pr.habit)}</div>`;
}
function eggCard(){
  const a = S.av; if (!a || a.hatched) return '';
  return `<button class="week eggcard" id="egg"><span class="eggimg">${eggSVG(a.fed)}</span><span><b>🥚 Tu huevito</b><span class="small" style="display:block;margin-top:2px">Comé un fueguito por día: en ${a.need} días distintos nace tu muñequito.</span>
    <span class="progress" style="margin-top:8px;display:block"><i style="width:${Math.round(a.fed / a.need * 100)}%"></i></span><span class="small muted" style="display:block;margin-top:4px">${a.fed} de ${a.need} días</span></span></button>`;
}
function unlockSheet(ids){
  const id = ids[ids.length - 1], c = CHARS[id]; if (!c) return;
  const pr = (S.av.progress || []).find(x => x.theme === c[2]);
  vibrate([40, 80, 40]); beep(659, .12); setTimeout(() => beep(988, .2), 140);
  const el = openSheet(`<div style="text-align:center"><div class="hatch">${userAv(S.me.user.nick, { h: true, eq: { ...(S.av.eq || {}), p: id } }, 120)}</div>
      <h2 style="margin-top:10px">¡Desbloqueaste ${esc(c[1])}! ${c[0]}</h2>
      <p class="muted">${c[3]} días seguidos${pr ? ` de ${esc(pr.habit)}` : ''}.${c[3] >= 66 ? ' Según la ciencia, ese hábito ya es automático. 🧠' : ''}</p></div>
    <div class="stack section"><button class="btn" id="ul-use">Usarlo de avatar</button><button class="btn ghost" id="ul-no">Después</button></div>`);
  $('#ul-use', el).onclick = async () => { try { S.av = await rpc('api_avatar_equip', { ...P(), p_slot: 'p', p_item: id }); S.me.user.avatar = { h: true, eq: S.av.eq, name: S.av.name }; closeSheet(); renderMain(); toast(`¡${c[1]} es tu nuevo avatar!`); } catch(e){ toast(e.message); } };
  $('#ul-no', el).onclick = () => { closeSheet(); renderMain(); };
}
function hatchSheet(){
  vibrate([40, 80, 40, 80, 60]); beep(523, .12); setTimeout(() => beep(659, .12), 130); setTimeout(() => beep(784, .2), 260);
  const el = openSheet(`<div style="text-align:center"><div class="hatch">${userAv(S.me.user.nick, { h: true, eq: {} }, 128)}</div>
      <h2 style="margin-top:10px">¡Nació tu fueguito! 🎉</h2><p class="muted">Ahora es tu avatar en la app. Cada fueguito que anotás te da una moneda 🪙 para comprarle cosas (de regalo, 10). Y si sostenés un hábito 7, 21, 45 y 66 días seguidos, desbloqueás muñequitos de su temática.</p></div>
    <div class="stack section"><label class="field"><span>¿Cómo se llama?</span><input class="input" id="hn" maxlength="20" placeholder="Ej: Chispita"></label>
      <button class="btn" id="hn-ok">Ir a la tienda</button><button class="btn ghost" id="hn-later">Después</button></div>`);
  const save = async () => { const n = $('#hn', el).value.trim(); if (n) try { S.av = await rpc('api_avatar_name', { ...P(), p_name: n }); S.me.user.avatar.name = n; } catch(e){} };
  $('#hn-ok', el).onclick = async () => { await save(); shopSheet(); };
  $('#hn-later', el).onclick = async () => { await save(); closeSheet(); renderMain(); };
}
function shopSheet(slot = 'p'){
  const a = S.av; if (!a) return;
  if (!a.hatched){ toast(`Primero tiene que nacer: te faltan ${a.need - a.fed} días con fueguito 🥚`); return; }
  const owned = new Set([...(a.owned || []), 'c:naranja', 'p:chispita']), eq = a.eq || {};
  const myThemes = [...new Set((a.progress || []).map(x => x.theme))];
  const runOf = (th) => Math.max(0, ...(a.progress || []).filter(x => x.theme === th).map(x => x.run));
  const habitOf = (th) => ((a.progress || []).find(x => x.theme === th) || {}).habit || '';
  const cat = slot === 'p' ? ['p', 'Personaje', [['p:chispita', 'Chispita', 0], ...myThemes.flatMap(th => Object.entries(CHARS).filter(([, c]) => c[2] === th).map(([id, c]) => [id, c[1], 0]))]] : AV_SHOP.find(c => c[0] === slot);
  const el = openSheet(`<div class="row between" style="align-items:center"><h2>🛍️ Tienda</h2><span class="coins">🪙 ${a.coins}</span></div>
    <div style="display:grid;place-items:center;margin:10px 0">${userAv(S.me.user.nick, { h: true, eq }, 120)}<div class="small muted" style="margin-top:6px;font-weight:700">${esc(a.name || 'Tu fueguito')}</div></div>
    <div class="chips">${[['p', 'Personaje'], ...AV_SHOP].map(c => `<button class="chip ${c[0] === slot ? 'on' : ''}" data-slot="${c[0]}">${c[1]}</button>`).join('')}</div>
    ${slot === 'p' ? '<p class="small muted" style="margin:0 0 10px">Cada hábito tiene su temática. Se desbloquean con 7, 21, 45 y 66 días seguidos de ese hábito, contando uno por día. A los 66 días, según la ciencia, ya es automático 🧠</p>' : ''}
    ${slot === 'c' && eq.p && eq.p !== 'p:chispita' ? '<p class="small muted" style="margin:0 0 10px">El color es para Chispita 🔥. Los demás muñequitos ya tienen el suyo.</p>' : ''}
    <div class="shop">${slot !== 'c' && slot !== 'p' ? `<button class="shopit ${!eq[slot] ? 'on' : ''}" data-item=""><span class="prev">${userAv(S.me.user.nick, { h: true, eq: { ...eq, [slot]: undefined } }, 56)}</span><b>Sin nada</b><span class="small muted">${!eq[slot] ? 'Puesto' : 'Sacar'}</span></button>` : ''}
      ${cat[2].map(([id, name, price]) => { const has = owned.has(id), on = (eq[slot] || (slot === 'c' ? 'c:naranja' : slot === 'p' ? 'p:chispita' : '')) === id;
        if (slot === 'p' && !has){ const c = CHARS[id], run = runOf(c[2]);
          return `<button class="shopit lock" data-lock="${id}"><span class="prev">${userAv(S.me.user.nick, { h: true, eq: { ...eq, p: id } }, 56)}</span><b>${name}</b><span class="small">🔒 ${c[3]} días</span><span class="small muted">vas ${Math.min(run, c[3])}</span></button>`; }
        return `<button class="shopit ${on ? 'on' : ''} ${!has && price > a.coins ? 'cant' : ''}" data-item="${id}"><span class="prev">${userAv(S.me.user.nick, { h: true, eq: { ...eq, [slot]: id } }, 56)}</span><b>${name}</b><span class="small ${has ? 'muted' : ''}">${on ? 'Puesto' : has ? 'Tuyo' : `🪙 ${price}`}</span></button>`; }).join('')}</div>
    <p class="hint">Cada fueguito que anotás te da una moneda.</p>
    <div class="section"><button class="btn ghost" data-close-sheet>Listo</button></div>`);
  el.querySelector('[data-close-sheet]').onclick = () => { closeSheet(); renderMain(); };
  el.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => shopSheet(b.dataset.slot));
  el.querySelectorAll('[data-lock]').forEach(b => b.onclick = () => { const c = CHARS[b.dataset.lock], run = runOf(c[2]);
    toast(`${c[0]} ${c[1]}: ${c[3]} días seguidos de ${habitOf(c[2])}. Vas ${run}, te ${c[3] - run === 1 ? 'falta 1' : `faltan ${c[3] - run}`} 💪`, 4000); });
  el.querySelectorAll('[data-item]').forEach(b => b.onclick = async () => {
    const id = b.dataset.item, item = cat[2].find(x => x[0] === id);
    try {
      if (!id) S.av = await rpc('api_avatar_equip', { ...P(), p_slot: slot, p_item: null });
      else if (owned.has(id) || id === 'p:chispita') S.av = id === 'c:naranja' ? await rpc('api_avatar_equip', { ...P(), p_slot: 'c', p_item: null }) : await rpc('api_avatar_equip', { ...P(), p_slot: slot, p_item: id });
      else {
        if (item[2] > a.coins){ toast(`Te faltan ${item[2] - a.coins} monedas. Cada fueguito suma una 🪙`, 3200); return; }
        S.av = await rpc('api_avatar_buy', { ...P(), p_item: id }); vibrate([30, 60, 30]); beep(880, .12); toast(`🎉 Compraste: ${item[1]}`);
      }
      S.me.user.avatar = { h: true, eq: S.av.eq, name: S.av.name }; S.group = S.group && { ...S.group };
      shopSheet(slot);
    } catch(e){ toast(e.message, 3200); }
  });
}

/* ============ Arranque: elegir → primer fueguito → avisos ============ */
const ONB_TPL = [
  { e: '💧', name: 'Tomar agua', wpp: 'Agua', goal: 8, unit: 'vasos', remind: true },
  { e: '🌙', name: 'Dormirme antes de las 12', wpp: 'Dormir', next: true },
  { e: '📵', name: 'Sin Instagram', wpp: 'Sin Instagram', kind: 'evitar' },
];
function renderOnboarding(){
  const step = S.onb || 'elegir', hs = S.me.habits;
  const dots = ['elegir', 'primero', 'avisos'].map(k => `<i class="${k === step ? 'on' : ''}"></i>`).join('');
  if (step === 'elegir'){
    const av = S.me.available;
    const tpls = ONB_TPL.map((t, i) => ({ ...t, i })).filter(t => !av.some(h => h.name.toLowerCase() === t.name.toLowerCase()));
    const card = (key, e, name, on, sub) => `<button class="onb-card ${on ? 'on' : ''}" data-onb="${key}" aria-pressed="${on}"><span class="e" aria-hidden="true">${esc(e)}</span><b>${esc(name)}</b>${sub ? `<span class="small muted">${esc(sub)}</span>` : ''}<span class="tick" aria-hidden="true">✓</span></button>`;
    $('#app').innerHTML = `<div class="wrap onb">
      <div class="onb-dots" aria-label="Paso 1 de 3">${dots}</div>
      <h1>Hola, ${esc(S.me.user.nick)} 👋</h1>
      <p class="muted lead">¿Qué querés sostener todos los días? Tocá uno o dos. Después podés sumar más.</p>
      <div class="onb-grid">${av.map(h => card(h.id, h.emoji, h.name, h.active, h.group_name ? `de ${h.group_name}` : '')).join('')}${tpls.map(t => card('tpl:' + t.i, t.e, t.name, false, '')).join('')}</div>
      <button class="link" id="onb-own" style="display:block;margin:14px auto 0">+ Crear uno a mi medida</button>
      <div class="section"><button class="btn" id="onb-next" ${hs.length ? '' : 'disabled'}>Seguir</button>
        <p class="hint" style="text-align:center">${hs.length ? '¿Ya venías con racha en WhatsApp? La cargás después en Perfil → Corregir racha.' : 'Elegí al menos uno.'}</p></div></div>`;
    document.querySelectorAll('[data-onb]').forEach(b => b.onclick = async () => {
      if (b.disabled) return; b.disabled = true;
      const key = b.dataset.onb;
      try {
        if (key.startsWith('tpl:')){
          const t = ONB_TPL[+key.slice(4)];
          const h = await rpc('api_save_habit', { ...P(), p_group: null, p_id: null, p_name: t.name, p_emoji: t.e, p_wpp: t.wpp, p_days: [0,1,2,3,4,5,6],
            p_ice_every: 14, p_max_ice: t.kind === 'evitar' ? 0 : 2, p_kind: t.kind || 'hacer', p_next: !!t.next, p_goal: t.goal || null, p_unit: t.unit || null, p_remind: !!t.remind });
          await rpc('api_set_habit', { ...P(), p_habit: h.id, p_active: true, p_streak: 0, p_ice: 0, p_left: h.ice_every });
        } else {
          const h = S.me.available.find(x => x.id === key);
          await rpc('api_set_habit', { ...P(), p_habit: h.id, p_active: !h.active, ...(h.active ? {} : { p_streak: 0, p_ice: 0, p_left: h.ice_every }) });
        }
        S.me = await rpc('api_me', P()); vibrate(15); renderOnboarding();
      } catch(e){ toast(e.message); b.disabled = false; }
    });
    $('#onb-own').onclick = () => habitEditor(null, null, () => renderOnboarding());
    $('#onb-next').onclick = () => { S.onb = 'primero'; renderOnboarding(); };
    return;
  }
  if (step === 'primero'){
    const can = hs.filter(h => h.kind !== 'evitar' && !h.next_day);
    const any = hs.some(h => h.kind !== 'evitar' && h.done_today);
    $('#app').innerHTML = `<div class="wrap onb">
      <div class="onb-dots" aria-label="Paso 2 de 3">${dots}</div>
      <h1>¿Ya hiciste alguno hoy? 🔥</h1>
      <p class="muted lead">Anotalo y prendés tu primer fueguito ahora mismo.</p>
      <div class="stack">${can.map(h => `<button class="onb-do ${h.done_today ? 'done' : ''}" data-first="${h.id}" ${h.done_today ? 'disabled' : ''}><span class="e" aria-hidden="true">${esc(h.emoji)}</span><b>${esc(h.name)}</b><span class="tag">${h.done_today ? '✓ Anotado' : h.goal ? `Ya hice los ${h.goal} ${esc(h.unit || '')}` : 'Ya lo hice'}</span></button>`).join('')}</div>
      ${hs.some(h => h.kind === 'evitar' || h.next_day) ? '<p class="hint">Los de dejar algo se tildan solos, y los de la noche se confirman a la mañana siguiente.</p>' : ''}
      <div class="section"><button class="btn ${any ? '' : 'ghost'}" id="onb-next">${any ? 'Seguir' : 'Todavía no, después'}</button></div></div>`;
    document.querySelectorAll('[data-first]').forEach(b => b.onclick = async () => {
      const h = hs.find(x => x.id === b.dataset.first); b.disabled = true;
      try {
        const r = h.goal ? await rpc('api_count', { ...P(), p_habit: h.id, p_delta: h.goal }) : await rpc('api_checkin', { ...P(), p_habits: [h.id], p_photo: null, p_note: null });
        const x = (r.results || [])[0] || {};
        S.me.habits = r.habits;
        if (x.early || x.late){ toast(x.early ? `Se anota desde las ${opensAt(h)}.` : `Hoy ya se pasó la hora (${h.deadline}).`, 3500); renderOnboarding(); return; }
        const hh = r.habits.find(y => y.id === h.id) || h;
        vibrate([30, 60, 30]); beep(660, .12); setTimeout(() => beep(990, .16), 120);
        $('#layer').innerHTML = `<div class="tickscreen" role="dialog" aria-modal="true"><div class="bigtick">🔥</div><h2>${any ? `${esc(h.name)} anotado` : '¡Tu primer fueguito!'}</h2><p class="lbl">${esc(h.emoji)} ${esc(h.name)} · Día ${hh.streak}</p><div class="btns"><button class="btn" id="t-ok">¡Vamos!</button></div></div>`;
        pushLayer();
        $('#t-ok').onclick = () => { closeSheet(); renderOnboarding(); };
      } catch(e){ toast(e.message); b.disabled = false; }
    });
    $('#onb-next').onclick = () => { S.onb = 'avisos'; renderOnboarding(); };
    return;
  }
  // Paso 3: avisos. Si no se pueden pedir (ya están, bloqueados o el navegador no deja), se saltea.
  const finish = () => { S.onboarding = false; S.onb = null; renderShell(); };
  const st = pushState();
  if (st !== 'default' && st !== 'instalar'){ finish(); return; }
  $('#app').innerHTML = `<div class="wrap onb">
    <div class="onb-dots" aria-label="Paso 3 de 3">${dots}</div>
    <div style="font-size:64px;line-height:1;margin-top:10px" aria-hidden="true">🔔</div>
    <h1>Último paso: los avisos</h1>
    <p class="muted lead">Sin avisos, la app no te puede ayudar a sostener la racha.</p>
    <ul class="plist"><li>Te avisamos a la noche si te falta anotar</li><li>Te enterás cuando tus amigos entrenan</li><li>Nada de spam: como mucho uno o dos por día</li></ul>
    ${st === 'instalar' ? '<p class="banner ice" style="margin-top:14px">En iPhone los avisos solo andan con Fueguitos instalada en la pantalla de inicio. Son 3 toques.</p>' : ''}
    <div class="stack section"><button class="btn" id="onb-push">${st === 'instalar' ? 'Ver cómo instalarla' : 'Activar avisos'}</button>
      ${st === 'default' ? '<p class="hint" style="text-align:center;margin:0">El celu te va a preguntar: tocá <b>Permitir</b>.</p>' : ''}
      <button class="link" id="onb-skip" style="align-self:center;margin-top:6px">Ahora no</button></div></div>`;
  $('#onb-push').onclick = async () => {
    if (st === 'instalar'){ finish(); LS.del('fueguitos_guia'); maybeInstallGuide(); return; }
    await enablePush(); finish();
  };
  $('#onb-skip').onclick = () => { LS.set('fueguitos_push_snooze', String(Date.now())); finish(); };
}

function habitToggleRows(av, full){
  if (!av.length) return '<p class="muted">No hay hábitos disponibles.</p>';
  return av.map(h => {
    const mine = S.me.habits.find(x => x.id === h.id);
    const origin = h.mine ? (h.group_name ? `tuyo · compartido con ${esc(h.group_name)}` : 'tuyo') : h.group_name ? `de ${esc(h.owner || h.group_name)}${h.owner ? ` · ${esc(h.group_name)}` : ''}` : '';
    return `<div class="hrow">
      <div>
        <div style="font-weight:800;font-size:17px">${esc(h.emoji)} ${esc(h.name)}</div>
        <div class="small muted">${daysLabel(h.days)} · hielo cada ${h.ice_every} días${origin ? ` · ${origin}` : ''}</div>
        ${mine && (mine.custom_days || mine.rest_per_week) ? `<div class="small" style="font-weight:700">📅 Tus días: ${esc(ruleText(mine.days, mine.rest_per_week))}</div>` : ''}
        ${mine ? `<div class="row" style="gap:14px"><button class="link small" data-rules="${h.id}">📅 Mis días</button><button class="link small" data-adjust="${h.id}">Corregir racha</button></div>` : ''}
        ${full && h.mine ? `<div class="row" style="gap:14px;margin-top:2px"><button class="link small" data-hown="${h.id}">Editar</button>${S.me.groups.length ? `<button class="link small" data-hshare="${h.id}">${h.group_id ? 'Compartir en otro grupo' : 'Compartir con el grupo'}</button>` : ''}${h.group_id ? `<button class="link small danger" data-hunshare="${h.id}">Dejar de compartir</button>` : ''}</div>` : ''}
      </div>
      <button class="toggle ${h.active ? 'on' : ''}" role="switch" aria-checked="${h.active}" aria-label="${esc(h.name)}" data-toggle="${h.id}"></button>
    </div>`;
  }).join('');
}
function bindHabitToggles(rerender){
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const h = S.me.available.find(x => x.id === b.dataset.toggle);
    if (h.active){
      try { await rpc('api_set_habit', { ...P(), p_habit: h.id, p_active: false }); S.me = await rpc('api_me', P()); rerender(); toast(`${h.name} desactivado. Tu racha queda guardada.`); }
      catch(e){ toast(e.message); }
    } else openActivateSheet(h, false, rerender);
  });
  document.querySelectorAll('[data-hown]').forEach(b => b.onclick = () => { const h = S.me.available.find(x => x.id === b.dataset.hown); habitEditor(S.me.habits.find(x => x.id === h.id) || h, null, rerender); });
  document.querySelectorAll('[data-hshare]').forEach(b => b.onclick = () => shareHabitSheet(S.me.available.find(x => x.id === b.dataset.hshare), rerender));
  document.querySelectorAll('[data-hunshare]').forEach(b => b.onclick = async () => {
    try { await rpc('api_share_habit', { ...P(), p_habit: b.dataset.hunshare, p_group: null }); S.me = await rpc('api_me', P()); S.group = null; rerender(); toast('Ya no está compartido. Quienes lo activaron lo siguen teniendo.', 3500); }
    catch(e){ toast(e.message); }
  });
  document.querySelectorAll('[data-rules]').forEach(b => b.onclick = () => rulesSheet(S.me.habits.find(x => x.id === b.dataset.rules), rerender));
  document.querySelectorAll('[data-adjust]').forEach(b => b.onclick = () => {
    const h = S.me.available.find(x => x.id === b.dataset.adjust);
    openActivateSheet(h, true, rerender);
  });
}

function stepper(id, val, min, max){
  return `<div class="stepper" data-stepper="${id}" data-min="${min}" data-max="${max}"><button type="button" data-d="-1" aria-label="Menos">−</button><output id="${id}">${val}</output><button type="button" data-d="1" aria-label="Más">+</button></div>`;
}
function bindSteppers(root){
  root.querySelectorAll('[data-stepper]').forEach(s => {
    const out = s.querySelector('output'); const min = +s.dataset.min, max = +s.dataset.max;
    s.querySelectorAll('button').forEach(b => b.onclick = () => { out.value = out.textContent = Math.max(min, Math.min(max, (+out.textContent) + (+b.dataset.d))); });
  });
}

// Con las reglas del hábito, la racha define sola cuánto falta para el próximo hielo.
const leftFor = (streak, every) => every - (streak % every);
const iceFor = (streak, every, max) => Math.min(max, Math.floor(streak / every));
function openActivateSheet(h, adjusting, rerender){
  const mine = S.me.habits.find(x => x.id === h.id);
  const streak = mine ? mine.streak : 0;
  let iceTouched = !!mine;
  const el = openSheet(`
    <h2>${esc(h.emoji)} ${adjusting ? 'Corregir' : 'Activar'} ${esc(h.name)}</h2>
    <p class="muted">${adjusting ? 'Ajustá la racha si algo quedó mal. Lo demás se calcula solo.' : '¿Ya venías con racha? Poné los días que llevás. Si arrancás de cero, dejalo en 0.'}</p>
    <div class="stack section">
      <label class="field"><span>Días de racha 🔥</span><input class="input" id="a-streak" type="number" inputmode="numeric" min="0" max="9999" value="${streak}"></label>
      <div class="grid2">
        <div class="field"><span>Hielos que tenés 🧊</span>${stepper('a-ice', mine ? mine.ice : 0, 0, h.max_ice)}</div>
        <div class="field"><span>Faltan para hielo ⌛</span><div class="calc"><div><b id="a-left">${leftFor(streak, h.ice_every)}</b> días</div><div class="hint" style="margin:2px 0 0">calculado solo</div></div></div>
      </div>
      <p class="hint">Se gana un hielo cada ${h.ice_every} días anotados (máximo ${h.max_ice}). Si ya usaste alguno, bajalo.</p>
      <button class="btn" id="a-save">${adjusting ? 'Guardar' : 'Activar'}</button>
    </div>`);
  bindSteppers(el);
  const streakVal = () => Math.max(0, parseInt($('#a-streak', el).value || '0', 10) || 0);
  el.querySelector('[data-stepper="a-ice"]').addEventListener('click', () => { iceTouched = true; });

/* ============ Hojas ============ */
/* El botón "atrás" de Android cierra la hoja/pantalla abierta en vez de salir de la app. */
let layerInHistory = false, skipPop = false;
function pushLayer(){ if (!layerInHistory){ history.pushState({ layer: 1 }, ''); layerInHistory = true; } }
function popLayer(){
  // Se espera un instante: si enseguida se abre otra capa (ej. el festejo), reusa la misma entrada.
  setTimeout(() => { if (layerInHistory && !$('#layer').innerHTML){ layerInHistory = false; skipPop = true; history.back(); } }, 60);
}
function closeLayer(){ $('#layer .runner') ? closeRunner() : closeSheet(); }
window.addEventListener('popstate', () => {
  if (skipPop){ skipPop = false; return; }
  layerInHistory = false;
  if ($('#layer .runner')){ clearInterval(RT); RT = null; keepAwake(false); }
  $('#layer').innerHTML = '';
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#layer').innerHTML) closeLayer(); });

function openSheet(html, onClose){
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;
  pushLayer();
  const scrim = $('#scrim'), sheet = scrim.querySelector('.sheet');
  const dismiss = () => { slideAway(scrim, sheet, () => { if ($('#layer').contains(scrim)){ $('#layer').innerHTML = ''; popLayer(); } }); onClose && onClose(); };
  scrim.addEventListener('click', (e) => { if (e.target === scrim) dismiss(); });
  dragToClose(scrim, sheet, dismiss);
  return sheet;
}
function closeSheet(){ $('#layer').innerHTML = ''; popLayer(); }

// La hoja se va deslizando hacia abajo y el fondo se aclara; después se ejecuta `done`.
function slideAway(scrim, sheet, done){
  if (scrim.dataset.closing) return;
  scrim.dataset.closing = '1';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  sheet.style.transition = reduce ? 'none' : 'transform .22s cubic-bezier(.4,0,1,1)';
  scrim.style.transition = reduce ? 'none' : 'background-color .22s';
  sheet.style.transform = 'translateY(105%)';
  scrim.style.backgroundColor = 'rgba(0,0,0,0)';
  setTimeout(done, reduce ? 0 : 220);
}
// Arrastrar hacia abajo para cerrar: desde la rayita, o desde cualquier lado si la hoja está scrolleada arriba de todo.
function dragToClose(scrim, sheet, dismiss){
  let y0 = 0, t0 = 0, dy = 0, dragging = false, allowed = false, fromGrab = false;
  const bg = getComputedStyle(scrim).backgroundColor;
  sheet.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const onGrab = e.target.closest('.grab') || e.touches[0].clientY - sheet.getBoundingClientRect().top < 44;
    // En campos de texto o listas que scrollean de costado, no se arrastra la hoja.
    fromGrab = !!onGrab;
    allowed = (onGrab || sheet.scrollTop <= 0) && !e.target.closest('input, textarea, select, .chips, .bracket, .emojis');
    y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!allowed) return;
    const d = e.touches[0].clientY - y0;
    if (!dragging && (d < 6 || (!fromGrab && sheet.scrollTop > 0))) return;
    dragging = true; dy = Math.max(0, d);
    e.preventDefault();
    sheet.style.transition = 'none';
    sheet.style.transform = `translateY(${dy}px)`;
    scrim.style.backgroundColor = bg.replace(/[\d.]+\)$/, m => (parseFloat(m) * Math.max(0, 1 - dy / sheet.offsetHeight)).toFixed(3) + ')');
  }, { passive: false });
  sheet.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    const speed = dy / Math.max(1, Date.now() - t0);
    if (dy > Math.min(140, sheet.offsetHeight * .3) || (speed > .6 && dy > 30)) dismiss();
    else {
      sheet.style.transition = 'transform .2s cubic-bezier(.2,.9,.3,1)'; sheet.style.transform = '';
      scrim.style.transition = 'background-color .2s'; scrim.style.backgroundColor = '';
    }
  });
}

// Anillo del día: cuánto de lo de hoy ya cerraste (los de cantidad suman de a poco).
function dayRing(hs){
  const req = hs.filter(h => h.required_today); if (!req.length) return '';
  const done = req.filter(h => h.done_today).length;
  const part = req.reduce((a, h) => a + (h.done_today ? 1 : h.goal ? Math.min(h.count_today || 0, h.goal) / h.goal : 0), 0) / req.length;
  const C = 2 * Math.PI * 20, full = done === req.length;
  return `<div class="ring ${full ? 'full' : ''}" role="img" aria-label="Hoy: ${done} de ${req.length} hábitos">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" cx="24" cy="24" r="20" stroke-opacity="${part > 0 ? 1 : 0}" stroke-dasharray="${(C * part).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 24 24)"/></svg>
    <b>${full ? '✓' : `${done}/${req.length}`}</b></div>`;
}

// Calendario del mes de un hábito, con racha, récord y % cumplido del último mes.
function calendarSheet(h){
  const today = S.me.today, by = {};
  const hist = (S.history || []).filter(x => x.habit_id === h.id);
  hist.forEach(x => { if (by[x.day] !== 'hecho') by[x.day] = x.kind; });
  if (h.done_today) by[today] = 'hecho'; else if (by[today] === 'hecho') delete by[today];
  const first = hist.reduce((a, x) => x.day < a ? x.day : a, today);
  let req = 0, ok = 0;
  for (let i = 0; i < 30; i++){
    const d = addDays(today, -i); if (d < first) break;
    const k = by[d];
    if (k === 'hecho'){ ok++; req++; }
    else if (k === 'descanso') continue;
    else if (i > 0 && (k || h.days.includes(parseDay(d).getDay()))) req++;
  }
  const pct = req ? Math.round(ok / req * 100) : null;
  let cur = parseDay(today); cur.setDate(1);
  const minMonth = parseDay(addDays(today, -125)); minMonth.setDate(1);
  const el = openSheet(`<h2>${esc(h.emoji)} ${esc(h.name)}</h2>
    <div class="calstats"><div><b>${h.streak}</b><span>🔥 racha</span></div><div><b>${h.best || h.streak}</b><span>🏆 récord</span></div><div><b>${pct === null ? '–' : pct + '%'}</b><span>✅ último mes</span></div></div>
    <div class="row between section" style="align-items:center"><button class="link" id="cal-prev" aria-label="Mes anterior">‹ Anterior</button><b id="cal-title"></b><button class="link" id="cal-next" aria-label="Mes siguiente">Siguiente ›</button></div>
    <div class="cal" id="cal"></div>
    <p class="small" style="margin:12px 0 0">🧠 ${h.streak >= 66 ? '¡Pasaste los 66 días! Según la ciencia, este hábito ya es automático.' : `Día ${h.streak} de 66. Un estudio del University College London encontró que un hábito tarda en promedio 66 días en volverse automático.`}</p>
    <p class="hint" style="margin-top:12px"><span class="calkey hecho"></span> Hecho &nbsp; <span class="calkey hielo"></span> Hielito &nbsp; <span class="calkey descanso"></span> Descanso &nbsp; <span class="calkey miss"></span> No se hizo</p>
    <div class="section"><button class="btn ghost" data-close-sheet>Listo</button></div>`);
  const paint = () => {
    const y = cur.getFullYear(), m = cur.getMonth(), n = new Date(y, m + 1, 0).getDate();
    $('#cal-title', el).textContent = `${MONTHS[m][0].toUpperCase()}${MONTHS[m].slice(1)} ${y}`;
    let html = DAYS.map(d => `<em>${d}</em>`).join('') + '<span class="no"></span>'.repeat(cur.getDay());
    for (let d = 1; d <= n; d++){
      const day = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, k = by[day];
      const miss = !k && day < today && day >= first && h.days.includes(new Date(y, m, d).getDay());
      html += `<span class="${k === 'hecho' ? 'hecho' : k === 'hielo' ? 'hielo' : k === 'descanso' ? 'descanso' : (k === 'falla' || miss) ? 'miss' : ''} ${day === today ? 'today' : ''} ${day > today ? 'fut' : ''}">${d}</span>`;
    }
    $('#cal', el).innerHTML = html;
    $('#cal-prev', el).style.visibility = cur > minMonth ? '' : 'hidden';
    $('#cal-next', el).style.visibility = (y * 12 + m) < (parseDay(today).getFullYear() * 12 + parseDay(today).getMonth()) ? '' : 'hidden';
  };
  $('#cal-prev', el).onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); paint(); };
  $('#cal-next', el).onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); paint(); };
  el.querySelector('[data-close-sheet]').onclick = closeSheet;
  paint();
}

// Hábitos con cantidad por día (8 vasos de agua): +1 con un toque, o todo de una.
function countCard(h){
  const done = h.done_today, n = done ? h.goal : Math.min(h.count_today || 0, h.goal), u = h.unit ? ' ' + esc(h.unit) : '';
  const less = `<button type="button" class="undo" data-count="${h.id}" data-d="-1">Restar uno</button>`;
  return `<div class="habit count ${done ? 'done' : ''}" data-hid="${h.id}">

    <div>
      <div class="name">${esc(h.name)} <span aria-hidden="true">${esc(h.emoji)}</span></div>${h.cue ? `<div class="small muted cue">🕒 ${esc(h.cue)}</div>` : ''}
      <div class="meta"><span class="pill ${done ? 'ok' : 'fire'}">${n}/${h.goal}${u}</span><span class="pill ice">🧊 ${h.ice}/${h.max_ice}</span><span class="pill">⌛ ${h.left_for_ice}</span></div>
      <div class="progress" style="margin-top:8px" role="progressbar" aria-valuemin="0" aria-valuemax="${h.goal}" aria-valuenow="${n}"><i style="width:${Math.round(n / h.goal * 100)}%"></i></div>
      ${done ? `${goalLine(h)}${less}`
        : `<div class="nightq"><button type="button" class="btn sm" data-count="${h.id}" data-d="1" aria-label="Sumar uno a ${esc(h.name)}">+1</button><button type="button" class="btn sm ghost" data-count="${h.id}" data-d="${h.goal}">Todo ✓</button></div>${n > 0 ? less : ''}`}
    </div>
    <div class="check" aria-hidden="true">${done ? '✓' : ''}</div>
  </div>`;
}
async function countTap(h, d){
  const prev = S.me.habits;
  const n0 = h.done_today ? h.goal : Math.min(h.count_today || 0, h.goal), n1 = Math.max(0, Math.min(h.goal, n0 + d));
  S.me.habits = prev.map(x => x.id === h.id ? { ...x, count_today: n1 } : x); renderHoy(); vibrate(15);
  try {
    const r = await rpcQ('api_count', { ...P(), p_habit: h.id, p_delta: d }, `${h.name} ${d > 0 ? '+' : ''}${d}`, true);
    if (r.queued){
      if (n1 >= h.goal && !h.done_today) localCheckin([h.id]);
      else if (n1 < h.goal && h.done_today) S.me.habits = S.me.habits.map(x => x.id === h.id ? { ...x, done_today: false, streak: Math.max(0, x.streak - 1) } : x);
      renderHoy(); return;
    }
    S.me.habits = r.habits; renderHoy();
    if (r.completed){
      const hh = r.habits.find(x => x.id === h.id) || h, x = (r.results || [])[0] || {};
      vibrate([30, 60, 30]); beep(660, .12); setTimeout(() => beep(990, .16), 120);
      toast(`¡Meta cumplida! ${h.name}: día ${hh.streak} 🔥${x.earned_ice ? ' · ganaste un hielito 🧊' : ''}`, 3800);
    }
  } catch(e){ S.me.habits = prev; renderHoy(); toast(e.message, 3500); }
}

// Qué objetivo mostrar: el récord si está al alcance, si no, el próximo hito.
const HITO_LIST = [3, 7, 14, 21, 30, 50, 100, 150, 200, 365, 500, 730, 1000];
function goalLine(h){
  const st = h.streak || 0, best = h.best || 0;
  if (best > st && st > 0 && (st >= best / 2 || best - st <= 30)) return `<div class="goal near">🔥 Te ${best - st === 1 ? 'falta 1' : `faltan ${best - st}`} para tu récord (${best})</div>`;
  if (best > 0 && st >= best && st > 7) return `<div class="goal near">🏆 ¡Estás en tu récord!</div>`;
  if (st < 66) return `<div class="goal">🧠 ${st ? `Día ${st} de 66` : '66 días'}: ahí ya es automático</div>`;
  const next = HITO_LIST.find(x => x > st);
  return next ? `<div class="goal">🎯 Próximo: ${next} días${best > st ? ` · 🏆 récord ${best}` : ''}</div>` : '';
}

// ¿Ya pasó la hora límite? Misma cuenta que el servidor: minutos desde las 5 AM.
const dayMin = (hh, mm) => ((hh * 60 + mm - 300 + 1440) % 1440);
function isLate(h){
  if (!h.deadline) return false;
  const [hh, mm] = h.deadline.split(':').map(Number), now = new Date();
  return dayMin(now.getHours(), now.getMinutes()) >= dayMin(hh, mm);
}

// Se puede anotar desde 4 horas antes de la hora límite (dormir antes de las 12 → desde las 20).
function isEarly(h){
  if (!h.deadline) return false;
  const [hh, mm] = h.deadline.split(':').map(Number), now = new Date();
  return dayMin(now.getHours(), now.getMinutes()) < dayMin(hh, mm) - 240;
}
const opensAt = (h) => { const [hh, mm] = h.deadline.split(':').map(Number); const st = dayMin(hh, mm) - 240 <= 0 ? 300 : ((hh * 60 + mm - 240) + 1440) % 1440; return `${String(Math.floor(st / 60)).padStart(2, '0')}:${String(st % 60).padStart(2, '0')}`; };

// Anotar con un toque: queda anotado al instante; la foto y el detalle se suman después si querés.
async function quickAnotar(h){
  const prev = S.me.habits;
  S.prevBest = Object.fromEntries(prev.map(x => [x.id, x.best || 0]));
  localCheckin([h.id]); renderHoy(); vibrate([20, 40, 20]); beep(660, .1);
  try {
    const r0 = await rpcQ('api_checkin', { ...P(), p_habits: [h.id], p_photo: null, p_note: null }, `anotar ${h.name}`, true);
    let x = {};
    if (!r0.queued){
      x = (r0.results || [])[0] || {}; S.me.habits = r0.habits; renderHoy();
      if (x.early || x.late){ toast(x.early ? `Todavía es temprano: se anota desde las ${opensAt(h)}.` : `Hoy ya se pasó la hora (${h.deadline}). Mañana hay revancha 💪`, 3500); return; }
    }
    const hh = S.me.habits.find(y => y.id === h.id) || h, pb = S.prevBest[h.id] || 0;
    if (HITOS[hh.streak] || x.earned_ice || (pb >= 7 && hh.streak > pb)) celebrate([{ habit_id: h.id, name: h.name, emoji: h.emoji, streak: hh.streak, ice: hh.ice, left_for_ice: hh.left_for_ice, earned_ice: !!x.earned_ice }]);
    else {
      const sn = snack(`<span>🔥 <b>${esc(h.name)}</b> · día ${hh.streak}${r0.queued ? ' ☁️' : ''}</span><button data-sf>📸 Foto</button><button data-su>Deshacer</button>`);
      $('[data-sf]', sn).onclick = () => { sn.remove(); S.sel = new Set([h.id]); openCheckinSheet(); };
      $('[data-su]', sn).onclick = async () => { sn.remove(); try { S.me.habits = await rpc('api_undo_checkin', { ...P(), p_habit: h.id }); renderHoy(); toast(`${h.name} desanotado`); } catch(e){ toast(e.message, 3500); } };
    }
    S.group = null;
    rpc('api_history', P()).then(r => { S.history = r || []; }).catch(() => {});
  } catch(e){ S.me.habits = prev; renderHoy(); toast(e.message, 3500); }
}
// Anotación local (sin señal): mismas cuentas que el servidor, para ver el fueguito al instante.
function localCheckin(ids){
  const results = [];
  S.me.habits = S.me.habits.map(h => {
    if (!ids.includes(h.id) || h.done_today) return h;
    const x = { ...h, done_today: true, streak: h.streak + 1, left_for_ice: h.left_for_ice - 1 };
    let earned = false;
    if (x.left_for_ice <= 0){ x.left_for_ice = h.ice_every; if (x.ice < x.max_ice){ x.ice++; earned = true; } }
    results.push({ habit_id: h.id, name: h.name, emoji: h.emoji, streak: x.streak, ice: x.ice, left_for_ice: x.left_for_ice, earned_ice: earned });
    return x;
  });
  return { habits: S.me.habits, results };
}

function readDetail(el, det){
  if (!det.kind) return null;
  const num = (id) => { const i = $(id, el); if (!i || i.value === '') return null; return parseFloat(i.value.replace(',', '.')); };
  const km = num('#d-km'), min = num('#d-min'), kg = num('#d-kg'), reps = num('#d-reps');
  const ex = $('#d-ex', el) ? capEx($('#d-ex', el).value) : '';
  if (km != null && !(km > 0 && km <= 500)) return { error: 'Revisá la distancia' };
  if (min != null && !(min > 0 && min <= 1440)) return { error: 'Revisá el tiempo' };
  if (kg != null && !(kg >= 0 && kg <= 1000)) return { error: 'Revisá el peso' };
  const [ic, label] = ACT[det.kind];
  const parts = [km ? `${String(km).replace('.', ',')} km` : '', min ? `${min} min` : '', ex && kg != null ? `${ex} ${kgTxt(kg)}${reps ? ` × ${reps}` : ''}` : ''].filter(Boolean);
  return { kind: det.kind, km, minutes: min ? Math.round(min) : null, ex, kg, reps: reps ? Math.round(reps) : null, summary: `${ic} ${label}${parts.length ? ' · ' + parts.join(' · ') : ''}` };
}

function compress(file, max = 1080, limit = 900000){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.75, out = c.toDataURL('image/jpeg', q);
      while (out.length > limit && q > 0.35){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

function tallySVG(n){
  if (n > 40) return `<span class="dscore">${n}</span>`;
  const groups = Math.ceil(n / 5) || 0; let out = '';
  for (let g = 0; g < groups; g++){

    if (k === 5) lines += '<line x1="0" y1="18" x2="21" y2="6"/>';
    out += `<svg class="tally" viewBox="0 0 22 24" aria-hidden="true">${lines}</svg>`;
  }
  return `<span class="tallies" aria-label="${n} puntos">${out || '<span class="muted small">—</span>'}</span>`;
}

const duelLeader = (d) => { const ps = [...d.players].sort((x, y) => y.wins - x.wins || (y.points || 0) - (x.points || 0)); const top = ps[0];
  return (ps.length < 2 || top.wins > ps[1].wins || (top.points || 0) > (ps[1].points || 0)) && (top.wins || top.points) ? top : null; };

  try {
    const r = await rpcQ('api_duel_add', { ...P(), p_duel: id, p_winner: winner || null, p_note: note || null }, 'partido');
    vibrate(30);
    if (r.queued){
      const d0 = (S.duels[G.group.id] || []).find(x => x.id === id);
      if (d0){ const w0 = d0.players.find(u => u.id === winner); if (w0) w0.wins++; else d0.draws++; d0.games++;
        d0.last.unshift({ id: 'local' + Date.now(), winner: winner || null, note: note || null, at: new Date().toISOString() }); saveDuelsCache(G.group.id); }
    } else await loadDuels(G.group.id);
    const d = S.duels[G.group.id].find(x => x.id === id); renderGrupo();
    if (d){ const w = d.players.find(u => u.id === winner); toast(w ? `+1 ${w.nick} · lleva ${w.wins}` : '🤝 Empate'); }
  } catch(e){ toast(e.message); }
}
// Puntos: se actualiza en pantalla al instante y se manda en orden (para tocar +1 rápido varias veces).
let duelQueue = Promise.resolve();
function duelScore(G, id, uid, delta, setTo){
  const d = (S.duels[G.group.id] || []).find(x => x.id === id), u = d && d.players.find(x => x.id === uid);
  if (!u) return;
  const fl = d.mode === 'rondas' ? -100000 : 0;
  u.points = setTo != null ? Math.max(fl, setTo) : Math.max(fl, (u.points || 0) + delta);
  vibrate(12);
  const box = $('#gsub'); if (box && S.gsub === 'duelos'){ const card = box.querySelector(`[data-duel="${id}"]`); if (card) card.outerHTML = duelCard(d); bindDuelCards(G); }
  duelQueue = duelQueue.then(async () => {
    try {
      const r = await rpcQ('api_duel_points', { ...P(), p_duel: id, p_user: uid, p_delta: setTo != null ? null : delta, p_set: setTo != null ? setTo : null }, `punto de ${d.activity}`);
      if (r.queued){
        if (d.target && u.points >= d.target){ const w = localCloseRound(d); renderGrupo(); partidaTerminada(d, w); }
        saveDuelsCache(G.group.id); return;
      }
      if (r.won){ await loadDuels(G.group.id); renderGrupo(); partidaTerminada(d, r.winner); }
    } catch(e){ toast(e.message); await loadDuels(G.group.id); renderGrupo(); }
  });
}
// Cierre de partida local (misma regla que el servidor): gana el que más, o el que menos; empate si igualan.
function localCloseRound(d){
  const sorted = [...d.players].sort((x, y) => d.lowest_wins ? (x.points || 0) - (y.points || 0) : (y.points || 0) - (x.points || 0));
  const tie = sorted.length > 1 && (sorted[0].points || 0) === (sorted[1].points || 0);
  const w = tie ? null : sorted[0];
  if (w) w.wins++;
  d.games++; if (!w) d.draws++;
  d.last.unshift({ id: 'local' + Date.now(), winner: w ? w.id : null, note: sorted.map(u => `${u.nick} ${u.points || 0}`).join(' · '), at: new Date().toISOString() });
  d.players.forEach(u => u.points = 0);
  return w ? w.id : null;
}

async function closeRound(G, id){
