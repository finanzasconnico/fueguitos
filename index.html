// Orden de siembra estándar: 1 contra el último, y los mejores se cruzan recién en la final.
function seedOrder(n){ let a = [1, 2]; while (a.length < n){ const m = a.length * 2; a = a.flatMap(x => [x, m + 1 - x]); } return a; }
function koMatches(entrants){
  let size = 2; while (size < entrants.length) size *= 2;
  const order = seedOrder(size), rounds = Math.log2(size), out = [];
  for (let r = 1; r <= rounds; r++) for (let s = 0; s < size / 2 ** r; s++){
    const m = { stage: 'ko', grp: null, round: r, slot: s, a: null, b: null };
    if (r === 1){ const ea = entrants[order[2*s] - 1], eb = entrants[order[2*s + 1] - 1]; m.a = ea === undefined ? null : ea; m.b = eb === undefined ? null : eb; }
    out.push(m);
  }
  return out;
}
function roundRobin(idxs, grp){
  const l = [...idxs]; if (l.length % 2) l.push(null);
  const n = l.length, out = [];
  for (let r = 0; r < n - 1; r++){
    let slot = 0;
    for (let i = 0; i < n / 2; i++){ const a = l[i], b = l[n - 1 - i]; if (a !== null && b !== null) out.push({ stage: 'grupo', grp, round: r + 1, slot: slot++, a, b }); }
    l.splice(1, 0, l.pop());
  }
  return out;
}
const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  };

const passN = () => +(LS.get('t_pass_' + TV.t.id) || 2);
function standings(ps, ms){
  const t = Object.fromEntries(ps.map(p => [p.id, { p, pj: 0, pts: 0, gf: 0, gc: 0, dif: 0 }]));
  ms.filter(m => m.played).forEach(m => {
    const A = t[m.a], B = t[m.b]; if (!A || !B) return;
    const sa = m.sa ?? (m.winner === m.a ? 1 : 0), sb = m.sb ?? (m.winner === m.b ? 1 : 0);
    A.pj++; B.pj++; A.gf += sa; A.gc += sb; B.gf += sb; B.gc += sa;
    if (m.winner === m.a) A.pts += 3; else if (m.winner === m.b) B.pts += 3; else { A.pts++; B.pts++; }
  });
  return Object.values(t).map(r => ({ ...r, dif: r.gf - r.gc })).sort((x, y) => y.pts - x.pts || y.dif - x.dif || y.gf - x.gf || x.p.seed - y.p.seed);
}
function matchCard(m, P_, bracket){
  const A = P_[m.a], B = P_[m.b], can = A && B;
  const side = (p, sc, won) => `<div class="bp ${won ? 'win' : ''} ${m.played && !won && m.winner ? 'lose' : ''}">${pAv(p, 26)}<span class="pname">${p ? esc(p.name) : (m.round === 1 && m.stage === 'ko' && m.played ? 'Pasa directo' : 'A definir')}</span><b>${sc ?? (m.played && won && m.sa == null ? '✓' : '')}</b></div>`;
  return `<button class="bmatch ${m.played ? 'done' : ''}" ${can ? `data-m="${m.id}"` : 'disabled'}>
    ${side(A, m.sa, m.played && m.winner && m.winner === m.a)}${side(B, m.sb, m.played && m.winner && m.winner === m.b)}
    ${!m.played && can ? '<span class="bplay">Cargar resultado</span>' : ''}</button>`;
}

// Liga: cuando se jugó todo, el primero de la tabla queda campeón (y si se borra un resultado, se reabre).
async function ligaCheck(){
  const lm = TV.matches.filter(m => m.stage === 'grupo');
  const all = lm.length && lm.every(m => m.played);
  const leader = all ? standings(TV.players, lm)[0].p.id : null;
  if ((TV.t.champion || null) === leader) return;
  try { await rpc('api_tournament_finish', { ...P(), p_t: TV.t.id, p_champion: leader }); await openTournament(TV.t.id); } catch(e){}
}
async function toKnockout(){
  const { players, matches } = TV;
  const grps = [...new Set(players.map(p => p.grp).filter(Boolean))].sort();
  const n = passN(), tables = grps.map(g => standings(players.filter(p => p.grp === g), matches.filter(m => m.stage === 'grupo' && m.grp === g)));
  // Siembra: todos los primeros, después los segundos… así los de un mismo grupo se cruzan lo más tarde posible.
  const seeds = [];
  for (let k = 0; k < n; k++) seeds.push(...tables.map(t => t[k]).filter(Boolean).sort((x, y) => y.pts - x.pts || y.dif - x.dif).map(r => r.p.id));
  if (seeds.length < 2){ toast('Hacen falta al menos 2 clasificados'); return; }
  try { await rpc('api_tournament_to_ko', { ...P(), p_t: TV.t.id, p_matches: koMatches(seeds) }); await openTournament(TV.t.id, 'llaves'); toast('¡Llaves armadas! 🔥'); }
  catch(e){ toast(e.message); }
}

// Toque o mantener apretado (450 ms) → acción. Después de mantener apretado se ignora el "click" del soltar,
// si no, cerraría la hoja que se acaba de abrir.
function bindPress(el, fn){
  let timer = null, fired = false, x0 = 0, y0 = 0;
  const cancel = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('pointerdown', (e) => {
    fired = false; x0 = e.clientX; y0 = e.clientY;
    timer = setTimeout(() => {
      fired = true; vibrate(15); fn();
      const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click', swallow, true); };
      document.addEventListener('click', swallow, true);
      setTimeout(() => document.removeEventListener('click', swallow, true), 700);
    }, 450);
  });
  el.addEventListener('pointermove', (e) => { if (Math.abs(e.clientX - x0) > 8 || Math.abs(e.clientY - y0) > 8) cancel(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, cancel));
  el.addEventListener('click', () => { if (!fired) fn(); });
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(); } });
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

// Acepta el código solo o el link de invitación entero (…?g=ABCDEF).
function parseGroupCode(raw){
  raw = String(raw || '').trim();
  try { const u = new URL(raw); const g = u.searchParams.get('g'); if (g) return g.toUpperCase(); } catch(e){}
  const m = raw.toUpperCase().match(/[A-Z]{6}/);
  return m ? m[0] : '';
}
async function joinByCode(code){
  const g = await rpc('api_join_group', { ...P(), p_code: code });
  S.groupId = g.id; LS.set('racha_group', g.id); S.me = await rpc('api_me', P()); S.group = null;
  closeSheet(); go('grupo'); vibrate([30, 60, 30]); toast(`Te sumaste a ${g.name} 🔥`);
  const full = S.me.groups.find(x => x.id === g.id); if (full) setTimeout(() => offerGroupRule(full), 700);
}
function joinGroupSheet(){
  const el = openSheet(`<h2>🔑 Unirme a un grupo</h2>
    <p class="muted">Poné el código de 6 letras o pegá el link de invitación.</p>
    <div class="stack section">
      <input class="input code-in big" id="j-code" maxlength="200" placeholder="ABCDEF" autocapitalize="characters" autocomplete="off" autofocus>
      ${navigator.clipboard && navigator.clipboard.readText ? '<button class="btn ghost" id="j-paste">Pegar el link</button>' : ''}
      <button class="btn ice" id="j-go">Unirme</button>
    </div>`);
  const inp = $('#j-code', el), go_ = $('#j-go', el);
  const tryJoin = async () => {
    const code = parseGroupCode(inp.value);
    if (code.length !== 6){ toast('El código son 6 letras'); return; }
    go_.disabled = true; go_.textContent = 'Uniéndote…';
    try { await joinByCode(code); } catch(err){ toast(err.message, 3500); go_.disabled = false; go_.textContent = 'Unirme'; }
  };
  // Cuando se completan las 6 letras (o se pega el link), se une solo.
  inp.oninput = () => { if (parseGroupCode(inp.value).length === 6 && (inp.value.trim().length === 6 || /g=/.test(inp.value))) tryJoin(); };
  go_.onclick = tryJoin;
  const pb = $('#j-paste', el); if (pb) pb.onclick = async () => { try { inp.value = (await navigator.clipboard.readText()).trim(); inp.oninput(); } catch(e){ toast('Mantené apretado el cuadro y tocá Pegar'); } };
  setTimeout(() => inp.focus(), 250);
}
/* ============ Reglas de días y descansos ============ */
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const ruleText = (days, rest) => `${days && days.length ? daysLabel(days) : 'Todos los días'}${rest ? ` · ${rest} ${rest === 1 ? 'descanso' : 'descansos'} por semana` : ''}`;
// Campos reutilizables (grupo y personal). Devuelve el html; `readRules(el)` lee lo elegido.
function rulesFields(days, rest){
  const on = new Set(days && days.length ? days : [0, 1, 2, 3, 4, 5, 6]);
  return `<div class="field"><span>Días que tocan</span><div class="days rules-days">${WEEK.map(d => `<button type="button" class="day ${on.has(d) ? 'on' : ''}" data-rd="${d}" aria-label="${DAY_NAMES[d]}">${DAYS[d]}</button>`).join('')}</div>
      <div class="hint">Si entrenás un día que no te toca, suma igual. Si faltás ese día, no pasa nada.</div></div>
    <div class="field rest-field"><span>Descansos por semana</span><div class="chips" style="margin:0">${[0, 1, 2].map(n => `<button type="button" class="chip ${(rest || 0) === n ? 'on' : ''}" data-rr="${n}">${n === 0 ? 'Ninguno' : n === 1 ? '1 día' : '2 días'}</button>`).join('')}</div>
      <div class="hint">Si faltás un día que te toca, el primero de la semana cuenta como descanso y la racha sigue (sin gastar hielito).</div></div>`;
}
function bindRules(el){
  el.querySelectorAll('[data-rd]').forEach(b => b.onclick = () => {
    b.classList.toggle('on');
    if (!el.querySelector('[data-rd].on')){ b.classList.add('on'); toast('Tiene que quedar al menos un día'); }
  });
  el.querySelectorAll('[data-rr]').forEach(b => b.onclick = () => { el.querySelectorAll('[data-rr]').forEach(x => x.classList.toggle('on', x === b)); });
}
function readRules(el){
  const days = [...el.querySelectorAll('[data-rd].on')].map(b => +b.dataset.rd).sort();
  const rest = +((el.querySelector('[data-rr].on') || {}).dataset || {}).rr || 0;
  return { days, rest };
}

    $('#g-help', el).textContent = pair ? 'Te damos un link para mandarle. Cada día que anotan los dos, la racha suma.' : 'Después te damos el link para invitar a tus amigos.';
    $('#g-submit', el).textContent = pair ? 'Crear racha de a dos' : 'Crear grupo';
  });
  $('#f-create2', el).onsubmit = async (e) => {
    e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true;
    try {
      const g = await rpc('api_create_group', { ...P(), p_name: pair ? 'Racha de a dos' : $('#g-name2', el).value, p_pair: pair });
      const r = readRules(el); if (r.days.length === 7) r.days = [];
      if (!pair && (r.days.length || r.rest)){
        await rpc('api_set_group_rules', { ...P(), p_group: g.id, p_days: r.days, p_rest: r.rest });
        const sp = S.me.habits.find(isSport);
        if (sp && $('#g-mine', el).checked) await rpc('api_set_habit_rules', { ...P(), p_habit: sp.id, p_days: r.days, p_rest: r.rest });
      }
      S.groupId = g.id; LS.set('racha_group', g.id); S.me = await rpc('api_me', P()); closeSheet(); S.group = null;
      go('grupo'); setTimeout(() => shareInvite(g), 400);
    } catch(err){ toast(err.message); b.disabled = false; }
  };
  setTimeout(() => $('#g-name2', el).focus(), 250);
}

function habitEditor(h, groupId = null, after){
  let days = h ? [...h.days] : [0,1,2,3,4,5,6];
  let autoIce = !h;
  let kind = h ? (h.kind || 'hacer') : 'hacer';
  const EM = ['🏃','🚴','🏊','⚽','📚','🧘','💧','🥗','😴','🌙','✍️','🎸','🧠','📵','🚭','🍺','🍬','📱','🙏','🚶','🏋️','🦉','🗣️','🎹','🧹','💊','🦷','🌅','🍎'];
  // Hábitos ya armados: un toque y queda todo cargado.
  const TPL = [
    { e: '💧', t: 'Agua', name: 'Tomar agua', wpp: 'Agua', goal: 8, unit: 'vasos', remind: true },
    { e: '📚', t: 'Leer', name: 'Leer', wpp: 'Lectura', goal: 10, unit: 'páginas' },
    { e: '🌙', t: 'Dormir temprano', name: 'Dormirme antes de las 12', wpp: 'Dormir', next: true },
    { e: '🌅', t: 'Madrugar', name: 'Levantarme antes de las 7', wpp: 'Madrugar', dl: '07:00' },
    { e: '🧘', t: 'Meditar', name: 'Meditar', wpp: 'Meditación' },
    { e: '💪', t: 'Flexiones', name: 'Flexiones', wpp: 'Flexiones', goal: 20, unit: 'flexiones' },
    { e: '🦉', t: 'Duolingo', name: 'Duolingo', wpp: 'Duolingo' },
    { e: '📵', t: 'Sin Instagram', name: 'Sin Instagram', wpp: 'Sin Instagram', kind: 'evitar' },
    { e: '🚭', t: 'Dejar de fumar', name: 'Sin fumar', wpp: 'Sin fumar', kind: 'evitar' },
  ];
  const el = openSheet(`<h2>${h ? 'Editar hábito' : 'Crear hábito'}</h2>
    <div class="stack section">
      ${h ? '' : `<div class="field"><span>Empezá con uno armado (o armá el tuyo abajo)</span><div class="chips" style="margin-bottom:0">${TPL.map((t, i) => `<button type="button" class="chip" data-tpl="${i}">${t.e} ${t.t}</button>`).join('')}</div></div>`}
      ${h ? `<p class="small muted" style="margin:0">${kind === 'evitar' ? '🚫 Hábito para dejar algo: se tilda solo cada día.' : '✅ Hábito para hacer algo.'}</p>` : `<div class="field"><span>¿Qué tipo de hábito?</span><div class="grid2">
        <button type="button" class="fmt" data-hk="hacer"><b>✅ Hacer algo</b><span class="small">Lo anotás cuando lo hacés. Ej: leer, tomar agua.</span></button>
        <button type="button" class="fmt" data-hk="evitar"><b>🚫 Dejar algo</b><span class="small">Se tilda solo. Lo destildás si caíste. Ej: Instagram, fumar.</span></button></div></div>`}
      <label class="field"><span>Nombre</span><input class="input" id="h-name" maxlength="30" placeholder="${kind === 'evitar' ? 'Ej: Sin Instagram' : 'Ej: Tomar agua'}" value="${esc(h ? h.name : '')}"></label>
      <div class="field"><span>Emoji</span><input class="input" id="h-emoji" maxlength="4" style="width:80px;text-align:center;font-size:24px" value="${esc(h ? h.emoji : '🔥')}">
        <div class="emojis">${EM.map(e => `<button type="button" data-em="${e}">${e}</button>`).join('')}</div></div>
      <label class="field"><span>Cómo aparece en el mensaje de WhatsApp</span><input class="input" id="h-wpp" maxlength="20" placeholder="Ej: Agua" value="${esc(h ? h.wpp_label : '')}"><div class="hint">Queda así: <b id="h-prev"></b></div></label>
      <div class="field"><span>Días que cuenta</span><div class="days" id="h-days">${DAYS.map((d,i) => `<button type="button" class="day" data-day="${i}" aria-label="${DAY_NAMES[i]}">${d}</button>`).join('')}</div>
        <div class="hint">Los días sin marcar son libres: no suman obligación ni cortan la racha.</div></div>
      <details class="more" id="h-more" ${h && (h.goal || h.next_day || h.deadline || h.cue) ? 'open' : ''}><summary>＋ Más opciones: cuándo, cantidad, de la noche, hora límite</summary><div class="stack">
      <label class="field"><span>¿Cuándo lo hacés? (opcional)</span><input class="input" id="h-cue" maxlength="40" placeholder="Ej: después del café" value="${esc(h && h.cue ? h.cue : '')}">
        <div class="hint">Atarlo a algo que ya hacés ayuda a no olvidarte. Aparece en la tarjeta y en el aviso.</div></label>
      <div class="field" id="h-goal-box"><span>¿Tiene cantidad por día? (opcional)</span>
        <div class="row" style="gap:10px"><input class="input" id="h-goal" type="number" inputmode="numeric" min="2" max="200" placeholder="8" style="max-width:90px" value="${h && h.goal ? h.goal : ''}"><input class="input" id="h-unit" maxlength="12" placeholder="vasos" value="${esc(h && h.unit ? h.unit : '')}"></div>
        <div class="hint">Ej: 8 vasos de agua, 10 páginas. Sumás de a uno con un toque, o todo de una.</div>
        <div class="row" style="gap:10px;margin-top:8px"><span class="small">💧 ¿Agua? Tu peso:</span><input class="input" id="h-kg" type="number" inputmode="numeric" placeholder="kg" style="max-width:90px"></div>
        <div class="hint" id="h-kg-out">Te calcula los vasos por día.</div>
        <label class="row small" style="gap:8px;margin-top:8px"><input type="checkbox" id="h-remind" ${h && h.remind_day ? 'checked' : ''}> 🔔 Avisarme durante el día si vengo atrasado (máximo 3 avisos)</label></div>
      <div class="field" id="h-next-box"><label class="row small" style="gap:8px"><input type="checkbox" id="h-next" ${h && h.next_day ? 'checked' : ''}> 🌙 Es de la noche: lo confirmo a la mañana siguiente</label>
        <div class="hint">Para no agarrar el celu antes de dormir. Al otro día la app te pregunta "¿Anoche cumpliste?" y contestás con un toque.</div></div>
      <div class="field" id="h-dl-box"><span>¿Tiene hora límite? (opcional)</span>
        <div class="row" style="gap:10px"><input class="input" id="h-dl" type="time" style="max-width:150px" value="${esc(h && h.deadline ? h.deadline : '')}"><button type="button" class="link small" id="h-dl-x">Sin hora</button></div>
        <div class="hint">Ej: "Levantarme antes de las 7" → 07:00. Se anota con un toque, en las 4 horas previas a esa hora, y te avisamos 30 min antes.</div></div>
      </div></details>
      <div class="grid2" id="h-ices">
        <div class="field"><span>Hielo cada</span>${stepper('h-ice', h ? h.ice_every : 14, 1, 90)}<div class="hint">días anotados</div></div>
        <div class="field"><span>Máximo de hielos</span>${stepper('h-max', h ? h.max_ice : 2, 0, 5)}</div>
      </div>
      <p class="hint" id="h-rule"></p>
      <p class="banner fire" id="h-noice" style="display:none;margin:0">🚫 Para dejar algo no hay hielitos: la idea es cortar del todo. Si caés, la racha vuelve a cero, pero tu récord y el total de días quedan.</p>
      <button class="btn" id="h-save">${h ? 'Guardar cambios' : 'Crear hábito'}</button>
      ${h ? '<button class="link danger" id="h-del">Eliminar hábito</button>' : ''}
    </div>`);
  bindSteppers(el);
  const paintKind = () => {
    el.querySelectorAll('[data-hk]').forEach(b => b.classList.toggle('on', b.dataset.hk === kind));
    $('#h-ices', el).style.display = $('#h-rule', el).style.display = $('#h-more', el).style.display = kind === 'evitar' ? 'none' : '';
    $('#h-goal-box', el).style.display = $('#h-next', el).checked ? 'none' : '';
    $('#h-dl-box', el).style.display = $('#h-next', el).checked || $('#h-goal', el).value ? 'none' : '';
    $('#h-noice', el).style.display = kind === 'evitar' ? '' : 'none';
    $('#h-name', el).placeholder = kind === 'evitar' ? 'Ej: Sin Instagram, dejar de fumar' : 'Ej: Tomar agua';
    if (kind === 'evitar' && !h && !$('#h-emoji', el).dataset.touched) $('#h-emoji', el).value = '🚫';
  };
  el.querySelectorAll('[data-hk]').forEach(b => b.onclick = () => { kind = b.dataset.hk; paintKind(); paint(); });
  const paint = () => {
    el.querySelectorAll('[data-day]').forEach(b => b.classList.toggle('on', days.includes(+b.dataset.day)));
    if (autoIce) $('#h-ice', el).textContent = Math.max(1, days.length * 2);
    const name = $('#h-wpp', el).value || $('#h-name', el).value || 'Hábito';
    $('#h-prev', el).textContent = `${name} día 6${$('#h-emoji', el).value}🔥`;
    $('#h-rule', el).textContent = `${days.length} veces por semana → un hielo cada ${$('#h-ice', el).textContent} días (el doble del hábito semanal).`;
  };
  el.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { const d = +b.dataset.day; days = days.includes(d) ? days.filter(x => x !== d) : [...days, d]; if (!days.length) days = [d]; paint(); });
  el.querySelectorAll('[data-em]').forEach(b => b.onclick = () => { $('#h-emoji', el).value = b.dataset.em; $('#h-emoji', el).dataset.touched = '1'; paint(); });
  ['#h-name','#h-wpp','#h-emoji'].forEach(s => $(s, el).oninput = paint);
  el.querySelector('[data-stepper="h-ice"]').addEventListener('click', () => { autoIce = false; setTimeout(paint); });
  $('#h-dl-x', el).onclick = () => { $('#h-dl', el).value = ''; };
  $('#h-next', el).onchange = (e) => { e.target.dataset.touched = '1'; paintKind(); };
  $('#h-goal', el).oninput = paintKind;
  // Agua según el peso: regla general de 35 ml por kilo, en vasos de 250 ml.
  $('#h-kg', el).oninput = (e) => {
    const kg = +e.target.value; if (!(kg >= 30 && kg <= 200)){ $('#h-kg-out', el).textContent = 'Te calcula los vasos por día.'; return; }
    const vasos = Math.max(4, Math.min(16, Math.round(kg * 35 / 250)));
    $('#h-goal', el).value = vasos; $('#h-unit', el).value = 'vasos'; paintKind();
    $('#h-kg-out', el).textContent = `≈ ${(vasos * .25).toFixed(1).replace('.', ',')} litros por día: ${vasos} vasos. Es una guía general, no una indicación médica.`;
  };
  el.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => {
    const t = TPL[+b.dataset.tpl];
    el.querySelectorAll('[data-tpl]').forEach(x => x.classList.toggle('on', x === b));
    kind = t.kind || 'hacer'; days = [0,1,2,3,4,5,6]; autoIce = true;
    $('#h-name', el).value = t.name; $('#h-wpp', el).value = t.wpp; $('#h-emoji', el).value = t.e; $('#h-emoji', el).dataset.touched = '1';
    $('#h-goal', el).value = t.goal || ''; $('#h-unit', el).value = t.unit || ''; $('#h-remind', el).checked = !!t.remind;
    $('#h-next', el).checked = !!t.next; $('#h-dl', el).value = t.dl || '';
    $('#h-more', el).open = !!(t.goal || t.next || t.dl);
    paintKind(); paint();
  });
  // Sugerencias según el nombre: dormir → se confirma a la mañana; levantarse → 07:00.
  $('#h-name', el).addEventListener('input', (e) => {
    if (h || $('#h-dl', el).value || kind !== 'hacer') return;
    const v = e.target.value;
    const em = $('#h-emoji', el), nx = $('#h-next', el), gl = $('#h-goal', el);
    if (/agua|hidrat/i.test(v) && !gl.value && !nx.checked){ gl.value = 8; $('#h-unit', el).value = 'vasos'; $('#h-remind', el).checked = true; $('#h-more', el).open = true; if (!em.dataset.touched) em.value = '💧'; paintKind(); return; }
    if (/dorm|acost|cama/i.test(v)) $('#h-more', el).open = true;
    if (/dorm|acost|cama/i.test(v)){ if (!nx.dataset.touched && !nx.checked){ nx.checked = true; paintKind(); } if (!em.dataset.touched) em.value = '🌙'; }
    else if (nx.checked) return;
    else if (/levant|despert|madrug/i.test(v)){ $('#h-dl', el).value = '07:00'; if (!em.dataset.touched) em.value = '🌅'; }
  });
  paint(); paintKind();
  $('#h-save', el).onclick = async (e) => {
    const name = $('#h-name', el).value.trim(); if (!name){ toast('Ponele un nombre'); return; }
    e.target.disabled = true;
    try {
      const saved = await rpc('api_save_habit', { ...P(), p_group: h ? (h.group_id || null) : groupId, p_id: h ? h.id : null, p_name: name, p_emoji: $('#h-emoji', el).value, p_wpp: $('#h-wpp', el).value,
        p_days: days.sort(), p_ice_every: +$('#h-ice', el).textContent, p_max_ice: +$('#h-max', el).textContent, p_kind: kind, p_deadline: kind === 'hacer' && !$('#h-next', el).checked ? ($('#h-dl', el).value || null) : null, p_next: kind === 'hacer' && $('#h-next', el).checked,
        p_goal: kind === 'hacer' && !$('#h-next', el).checked && +$('#h-goal', el).value >= 2 ? Math.round(+$('#h-goal', el).value) : null, p_unit: $('#h-unit', el).value.trim() || null, p_remind: $('#h-remind', el).checked, p_cue: $('#h-cue', el).value.trim() || null });
      // Un hábito nuevo queda activado para quien lo creó.
      if (!h) await rpc('api_set_habit', { ...P(), p_habit: saved.id, p_active: true, p_streak: 0, p_ice: 0, p_left: saved.ice_every });
      if (!h && kind === 'evitar'){
        if (APP_RX.test(name)) setTimeout(() => appBlockSheet({ name }), 600);
        else setTimeout(() => toast('Listo: se tilda solo cada día. Si caés, tocalo en Hoy.', 4000), 3900);
      }
      S.me = await rpc('api_me', P()); if (S.group) await loadGroup().catch(() => {}); closeSheet();
      after ? await after() : renderMain();
      toast(h ? 'Hábito actualizado' : groupId ? 'Hábito creado y compartido con el grupo. Ya lo tenés activado.' : 'Hábito creado y activado. Si querés, compartilo con tu grupo.', 3800);
    } catch(err){ toast(err.message); e.target.disabled = false; }
  };
  const d = $('#h-del', el); if (d) d.onclick = () => confirmSheet(`¿Eliminar ${h.name}?`, h.group_id ? 'Deja de aparecer para vos y para todos los del grupo.' : 'Deja de aparecer en tu lista.', 'Eliminar hábito', async () => {
    await rpc('api_archive_habit', { ...P(), p_habit: h.id }); S.me = await rpc('api_me', P()); if (S.group) await loadGroup().catch(() => {});
    after ? await after() : renderMain();
  });
}

const EJERCICIOS = ['Press plano', 'Press inclinado', 'Sentadilla', 'Peso muerto', 'Press militar', 'Remo con barra', 'Dominadas', 'Hip thrust', 'Prensa', 'Curl de bíceps'];
const capEx = (t) => { t = String(t).trim().replace(/\s+/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1); };
const kgTxt = (n) => `${Number(n).toLocaleString('es-AR', { maximumFractionDigits: 2 })} kg`;
const shortDate = (iso) => { const d = new Date(iso); return `${d.getDate()}/${d.getMonth()+1}`; };
async function loadLifts(){
  try { S.lifts = await rpc('api_lifts', P()); } catch(e){ S.lifts = S.lifts || []; }
  const box = $('#lifts'); if (box && S.tab === 'rutinas'){ box.innerHTML = liftsBlock(); bindLifts(); }
}
function liftGroups(){
  const g = {};
  (S.lifts || []).forEach(l => { const k = l.exercise.toLowerCase(); (g[k] = g[k] || { name: capEx(l.exercise), items: [] }).items.push(l); });
  return Object.values(g).map(x => ({ ...x, best: x.items.reduce((a, l) => Math.max(a, +l.kg), 0), last: x.items[0] }))
    .sort((a, b) => new Date(b.last.created_at) - new Date(a.last.created_at));
}
function liftsBlock(){
  if (!S.lifts) return '<div class="spinner" style="margin:12px auto"></div>';
  const gs = liftGroups();
  if (!gs.length) return '<p class="muted" style="margin:0">Anotá cuánto levantás en cada ejercicio (ej: Press plano 80 kg × 8) y seguí tu progreso. Cada récord nuevo se festeja.</p>';
  return gs.map(x => `<button class="hrow" style="width:100%;text-align:left" data-lift="${esc(x.name)}">
    <div><div style="font-weight:800;font-size:17px">${esc(x.name)}</div><div class="small muted">Último: ${kgTxt(x.last.kg)}${x.last.reps ? ` × ${x.last.reps}` : ''} · ${shortDate(x.last.created_at)}</div></div>
    <span class="pill fire">🏆 ${kgTxt(x.best)}</span></button>`).join('');
}
function bindLifts(){
  document.querySelectorAll('[data-lift]').forEach(b => b.onclick = () => liftHistory(b.dataset.lift));
}
function liftHistory(name){
  const x = liftGroups().find(g => g.name === name); if (!x) return;
  const el = openSheet(`<h2>${esc(x.name)}</h2><p class="muted">Récord: <b>${kgTxt(x.best)}</b> · ${x.items.length} ${x.items.length === 1 ? 'marca' : 'marcas'}</p>
    <div class="card section">${x.items.map(l => `<div class="hrow"><div><b>${kgTxt(l.kg)}</b>${l.reps ? ` × ${l.reps}` : ''}${+l.kg === x.best ? ' 🏆' : ''}<div class="small muted">${shortDate(l.created_at)}${l.note ? ` · ${esc(l.note)}` : ''}</div></div><button class="link small danger" data-ldel="${l.id}">Borrar</button></div>`).join('')}</div>
    <div class="section"><button class="btn" id="l-more">Cargar otra marca</button></div>`);
  $('#l-more', el).onclick = () => liftSheet(x.name);
  el.querySelectorAll('[data-ldel]').forEach(b => b.onclick = async () => {
    try { await rpc('api_lift_delete', { ...P(), p_id: b.dataset.ldel }); S.lifts = S.lifts.filter(l => l.id !== b.dataset.ldel); closeSheet(); renderRutinas(); toast('Marca borrada'); }
    catch(err){ toast(err.message); }
  });
}
function liftSheet(name){
  const seen = new Set(), known = [...liftGroups().map(g => g.name), ...EJERCICIOS].filter(e => !seen.has(e.toLowerCase()) && seen.add(e.toLowerCase())).slice(0, 10);
  const el = openSheet(`<h2>🏋️ Cargar peso</h2>
    <div class="stack section">
      <label class="field"><span>Ejercicio</span><input class="input" id="l-ex" maxlength="40" placeholder="Ej: Press plano" value="${esc(name)}"></label>
      <div class="chips" style="flex-wrap:wrap;margin:0">${known.map(e => `<button type="button" class="chip" data-lex="${esc(e)}">${esc(e)}</button>`).join('')}</div>
      <div class="grid2">
        <label class="field"><span>Peso (kg)</span><input class="input" id="l-kg" type="number" inputmode="decimal" min="0" max="1000" step="0.5" placeholder="80"></label>
        <label class="field"><span>Repeticiones</span><input class="input" id="l-reps" type="number" inputmode="numeric" min="1" max="200" placeholder="8"></label>
      </div>
      <label class="field"><span>Nota (opcional)</span><input class="input" id="l-note" maxlength="140" placeholder="Ej: con spotter, última serie al fallo"></label>
      <button class="btn" id="l-save">Guardar marca</button>
    </div>`);
  el.querySelectorAll('[data-lex]').forEach(b => b.onclick = () => { $('#l-ex', el).value = b.dataset.lex; $('#l-kg', el).focus(); });
  $('#l-save', el).onclick = async (e) => {
    const ex = capEx($('#l-ex', el).value), kg = parseFloat(($('#l-kg', el).value || '').replace(',', '.')), reps = parseInt($('#l-reps', el).value, 10);
    if (!ex){ toast('Elegí el ejercicio'); return; }
    if (!(kg >= 0 && kg <= 1000)){ toast('Poné el peso en kg'); return; }
    e.target.disabled = true;
    try {
      const r = await rpc('api_lift_add', { ...P(), p_exercise: ex, p_kg: kg, p_reps: reps > 0 ? reps : null, p_note: $('#l-note', el).value || null });
      closeSheet(); S.lifts = null; renderRutinas();
      if (r && r.pr && r.prev != null){ vibrate([30, 60, 30]); beep(660, .12); setTimeout(() => beep(990, .16), 120); toast(`🏆 ¡Récord nuevo en ${ex}! ${kgTxt(kg)} (antes ${kgTxt(r.prev)})`, 4000); }
      else toast(`Marca guardada: ${ex} ${kgTxt(kg)} 💪`);
    } catch(err){ toast(err.message); e.target.disabled = false; }
  };
}

const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0]; // lunes primero
// Viernes a domingo, el plan arranca el lunes que viene (si no, la semana 1 queda casi vacía).
const planStart = () => { const dw = parseDay(S.me.today).getDay(); return [5, 6, 0].includes(dw) ? addDays(mondayOf(S.me.today), 7) : mondayOf(S.me.today); };
const mondayOf = (d) => { const x = parseDay(d); const k = (x.getDay() + 6) % 7; return addDays(d, -k); };
// Qué toca un día dado del plan: { w, i, s } o null si es descanso / fuera del plan.
function planSession(day){
  const pl = S.me && S.me.user.plan; if (!pl || !PLANES[pl.id]) return null;
  const P_ = PLANES[pl.id], w = Math.floor((parseDay(mondayOf(day)) - parseDay(pl.start)) / (7 * 864e5));
  if (w < 0 || w >= P_.weeks) return { out: true, w };
  const order = DOW_ORDER.filter(d => pl.days.includes(d)), i = order.indexOf(parseDay(day).getDay());
  if (i < 0) return { rest: true, w };
  const ses = P_.week(w)[i];
  return ses ? { w, i, s: ses } : { rest: true, w };
}
function nextSession(){
  for (let k = 1; k <= 7; k++){ const d = addDays(S.me.today, k), x = planSession(d); if (x && x.s) return { d, ...x }; }
  return null;
}
function planLog(ses){
  const h = S.me.habits.find(isSport);
  if (!h){ toast('Activá Deporte en Perfil para anotarlo'); return; }
  if (h.done_today){ toast(`${h.name} ya está anotado hoy ✅`); return; }
  S.pendingActivity = { kind: 'correr', minutes: null, km: ses.km || null };
  S.sel = new Set([h.id]); go('hoy'); openCheckinSheet();
}
function planCard(compact){
  const pl = S.me.user.plan; if (!pl || !PLANES[pl.id]) return '';
  const P_ = PLANES[pl.id], x = planSession(S.me.today);
  if (x && x.out && x.w < 0){ const nx0 = nextSession(); return compact ? '' : `<div class="card plan"><div class="row between"><h3>${P_.emoji} ${esc(P_.name)}</h3><span class="small muted">Arranca pronto</span></div><p class="small" style="margin:6px 0 0">Primera salida: <b>${nx0 ? DAY_NAMES[parseDay(nx0.d).getDay()] + ' · ' + esc(nx0.s.t) : 'el lunes'}</b>. ¡A prepararse!</p><div class="row" style="gap:16px;margin-top:12px"><button class="link" id="pl-see">Ver el plan completo</button><button class="link danger" id="pl-stop">Dejar el plan</button></div></div>`; }
  if (x && x.out && x.w >= P_.weeks) return `<div class="card plan"><h3>${P_.emoji} ${esc(P_.name)}: ¡plan terminado! 🎉</h3><p class="small muted" style="margin:6px 0 10px">Podés arrancar otro cuando quieras.</p>${compact ? '' : '<button class="link danger" id="pl-stop">Cerrar el plan</button>'}</div>`;
  const wk = x ? x.w : 0, sport = S.me.habits.find(isSport), done = sport && sport.done_today;
  const nx = !x || !x.s ? nextSession() : null;
  const body = x && x.s
    ? `<div class="pses"><b>${esc(x.s.t)}</b><div class="small">${esc(x.s.d)}</div></div>${done ? '<p class="small" style="margin:8px 0 0;font-weight:700">✅ Hecho hoy</p>' : '<button class="btn sm" id="pl-do" style="width:100%;margin-top:10px">Ya lo hice: anotar</button>'}`
    : `<p class="small" style="margin:6px 0 0">Hoy descansás 😌${nx ? ` · El ${DAY_NAMES[parseDay(nx.d).getDay()]}: <b>${esc(nx.s.t)}</b>` : ''}</p>`;
  if (compact && !(x && x.s && !done)) return '';
  return `<div class="card plan ${compact ? 'section' : ''}">
    <div class="row between"><h3>${compact ? '🏃 Hoy te toca' : `${P_.emoji} ${esc(P_.name)}`}</h3><span class="small muted">Semana ${Math.min(wk + 1, P_.weeks)} de ${P_.weeks}</span></div>
    ${compact ? '' : `<div class="progress" style="margin:8px 0 10px"><i style="width:${Math.min(100, (wk / P_.weeks) * 100)}%"></i></div>`}
    ${body}
    ${compact ? '' : '<div class="row" style="gap:16px;margin-top:12px"><button class="link" id="pl-see">Ver el plan completo</button><button class="link danger" id="pl-stop">Dejar el plan</button></div>'}
  </div>`;
}
function bindPlanCard(){

  const d = $('#pl-do'); if (d && x && x.s) d.onclick = () => planLog(x.s);
  const see = $('#pl-see'); if (see) see.onclick = planWeeksSheet;

}
function planSheet(id){
  const P_ = PLANES[id]; let days = [...P_.days];
  const el = openSheet(`<h2>${P_.emoji} ${esc(P_.name)}</h2>
    <p class="muted">${esc(P_.desc)} ${P_.weeks} semanas, ${P_.days.length} salidas por semana.</p>
    <div class="stack section">
      <div class="field"><span>¿Qué días podés correr? (elegí ${P_.days.length})</span><div class="days" id="pl-days">${DOW_ORDER.map(d => `<button type="button" class="day" data-pd="${d}">${DAYS[d]}</button>`).join('')}</div>
        <div class="hint">El fondo (la salida más larga) cae el último día que elijas: mejor un fin de semana.</div></div>
      <div class="card small">📅 ${planStart() === mondayOf(S.me.today) ? 'Arranca esta semana.' : `Arranca el ${fmtDay(planStart()).toLowerCase()}.`}</div>
      <p class="hint" style="margin:0">Es una guía general: escuchá a tu cuerpo, y si tenés alguna lesión o condición, consultá antes con un médico o un profe.</p>
      <button class="btn" id="pl-go">Empezar el plan</button>
    </div>`);
  const paint = () => el.querySelectorAll('[data-pd]').forEach(b => b.classList.toggle('on', days.includes(+b.dataset.pd)));
  el.querySelectorAll('[data-pd]').forEach(b => b.onclick = () => { const d = +b.dataset.pd; days = days.includes(d) ? days.filter(x => x !== d) : [...days, d]; paint(); });
  paint();
  $('#pl-go', el).onclick = async (e) => {
    if (days.length !== P_.days.length){ toast(`Elegí ${P_.days.length} días`); return; }
    e.target.disabled = true;
    const plan = { id, start: planStart(), days };
    try { await rpc('api_set_plan', { ...P(), p_plan: plan }); S.me.user.plan = plan; closeSheet(); renderMain(); toast(`¡Arrancó tu plan de ${P_.name}! 🔥`); }
    catch(err){ toast(err.message); e.target.disabled = false; }
  };
}
function planWeeksSheet(){
  const pl = S.me.user.plan, P_ = PLANES[pl.id], cur = (planSession(S.me.today) || {}).w || 0;
  const order = DOW_ORDER.filter(d => pl.days.includes(d));

  </div>`).join('')}</div>`);
}

let RT = null; // runner timer
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
function openRunner(html){
  $('#layer').innerHTML = `<div class="runner" role="dialog" aria-modal="true"><div class="inner">${html}</div></div>`;
  pushLayer();
  keepAwake(true);
  return $('#layer .runner');
}
function closeRunner(){ clearInterval(RT); RT = null; keepAwake(false); $('#layer').innerHTML = ''; popLayer(); }
const mmss = (s) => `${Math.floor(s/60)}:${String(Math.max(0, s%60)).padStart(2,'0')}`;
function countdown(seconds, onTick, onEnd){
  clearInterval(RT);
  const end = Date.now() + seconds*1000;
  const tick = () => { const left = Math.max(0, Math.round((end - Date.now())/1000)); onTick(left); if (left <= 0){ clearInterval(RT); RT = null; onEnd && onEnd(); } };
  tick(); RT = setInterval(tick, 250);
}
function runnerHeader(title){
  const music = myPlaylist() || spotifySearch(title.includes('Medita') ? 'meditacion relajacion' : 'beast mode');
  return `<div class="row between" style="margin-bottom:18px"><h2>${title}</h2><div class="row" style="gap:8px"><a class="btn ghost sm" href="${esc(music)}" target="_blank" rel="noopener" aria-label="Poner música">🎧</a><button class="btn ghost sm" data-close>Cerrar</button></div></div>`;
}
function finishBlock(habitName, msg){
  const h = S.me.habits.find(x => x.name === habitName);
  const can = h && !h.done_today;
  return `<div style="text-align:center;padding:30px 0"><div style="width:110px;height:136px;margin:0 auto">${flameSVG(true)}</div>
    <h2 style="margin-top:14px">${msg}</h2>
    ${can ? `<div class="section"><button class="btn" data-log="${h.id}">Anotar ${esc(h.name)}</button></div>` :
      h ? `<p class="muted">${esc(h.name)} ya está anotado hoy ✅</p>` : ''}
    <div class="section"><button class="btn ghost" data-close>Cerrar</button></div></div>`;
}
function bindRunnerCommon(el){
  el.querySelectorAll('[data-close]').forEach(b => b.onclick = closeRunner);
  el.querySelectorAll('[data-log]').forEach(b => b.onclick = () => { closeRunner(); S.sel = new Set([b.dataset.log]); go('hoy'); openCheckinSheet(); });
}

function runQty(){
  let serie = 1, done = new Set(), resting = false;
  const paint = () => {
    if (serie > R_QTY.series){ const el = openRunner(runnerHeader('Rutina por cantidad') + finishBlock('Deporte', '¡Rutina completa! 4 series 💪')); bindRunnerCommon(el); beep(880,.2,3); vibrate([200,100,200]); return; }
    const el = openRunner(`${runnerHeader('Rutina por cantidad')}
      <div class="row between"><h3>Serie ${serie} de ${R_QTY.series}</h3><span class="small muted">${done.size}/${R_QTY.ex.length}</span></div>
      <div class="progress" style="margin:10px 0 16px"><i style="width:${((serie-1)*R_QTY.ex.length + done.size)/(R_QTY.series*R_QTY.ex.length)*100}%"></i></div>
      ${resting ? `<div class="card" style="text-align:center"><div class="small muted">Descanso</div><div class="clock rest" id="clk">1:00</div><button class="btn ghost sm" id="skip" style="margin-top:12px">Saltar descanso</button></div>` :
      `<div class="stack">${R_QTY.ex.map((x,i) => `<button class="ex ${done.has(i) ? 'done' : ''}" data-ex="${i}"><span style="font-weight:700">${done.has(i) ? '✓ ' : ''}${x.n}</span><span class="reps" ${x.t ? `id="t${i}"` : ''}>${x.r}</span></button>`).join('')}</div>
      <p class="hint" style="text-align:center">Tocá cada ejercicio cuando lo termines.${R_QTY.ex.some(x=>x.t) ? ' La plancha arranca un cronómetro de 1 min.' : ''}</p>`}
    `);
    bindRunnerCommon(el);
    if (resting){
      countdown(R_QTY.rest, (l) => { const c = $('#clk'); if (c) c.textContent = mmss(l); if (l === 3 || l === 2 || l === 1) beep(520,.1); }, () => { beep(990,.25,2); vibrate(300); resting = false; serie++; done = new Set(); paint(); });
      $('#skip', el).onclick = () => { clearInterval(RT); resting = false; serie++; done = new Set(); paint(); };
      return;
    }
    el.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
      const i = +b.dataset.ex, x = R_QTY.ex[i];
      if (done.has(i)){ done.delete(i); paint(); return; }
      if (x.t && !b.dataset.running){
        b.dataset.running = '1';
        countdown(x.t, (l) => { const t = $('#t'+i); if (t) t.textContent = mmss(l); }, () => { beep(990,.25,2); vibrate(300); done.add(i); after(); });
        return;
      }
      clearInterval(RT); done.add(i); after();
    });
    function after(){
      if (done.size === R_QTY.ex.length){ if (serie < R_QTY.series) resting = true; else serie++; }
      paint();
    }
  };
  paint();
}

function runTime(){
  let round = 1, started = false, finished = false, left = R_TIME.min*60, paused = false;
  const reps = (x) => x.fixed ?? x.k * round;
  const paint = () => {
    if (finished){ const el = openRunner(runnerHeader('Rutina por tiempo') + finishBlock('Deporte', `¡Tiempo! Llegaste a la ronda ${round} 🔥`)); bindRunnerCommon(el); return; }
    const el = openRunner(`${runnerHeader('Rutina por tiempo')}
      <div class="clock" id="clk">${mmss(left)}</div>
      <div class="progress" style="margin:14px 0"><i id="bar" style="width:${(1 - left/(R_TIME.min*60))*100}%"></i></div>
      <div class="row between" style="margin-bottom:10px"><h3>Ronda ${round}</h3><span class="small muted">Sube 1 por ronda</span></div>
      <div class="stack">${R_TIME.ex.map(x => `<div class="ex"><span><b>${x.n}</b>${x.note ? `<br><span class="small muted">${x.note}</span>` : ''}</span><span class="reps">${reps(x)}</span></div>`).join('')}</div>
      <div class="section grid2">
        <button class="btn ghost" id="pause">${!started ? 'Empezar' : paused ? 'Seguir' : 'Pausa'}</button>
        <button class="btn" id="next" ${started ? '' : 'disabled'}>Ronda ${round+1}</button>
      </div>`);
    bindRunnerCommon(el);
    const start = () => countdown(left, (l) => { left = l; const c = $('#clk'); if (c) c.textContent = mmss(l); const b = $('#bar'); if (b) b.style.width = `${(1 - l/(R_TIME.min*60))*100}%`; if (l === 60) beep(700,.15,2); }, () => { beep(990,.3,3); vibrate([300,100,300]); finished = true; paint(); });
    $('#pause', el).onclick = () => {
      if (!started){ started = true; paused = false; paint(); start(); return; }
      if (paused){ paused = false; paint(); start(); } else { paused = true; clearInterval(RT); paint(); }
    };
    $('#next', el).onclick = () => { round++; vibrate(40); const run = !paused; paint(); if (run) start(); };
  };
  paint();
}

// Al terminar una actividad con cronómetro, se anota Deporte con el tiempo ya cargado.
function logWithMinutes(minutes, kind){
  const h = S.me.habits.find(isSport);
  closeRunner();
  if (!h){ toast('Activá Deporte en Perfil para anotarlo'); return; }
  if (h.done_today){ toast(`${h.name} ya está anotado hoy ✅`); return; }
  S.pendingActivity = { kind: kind || null, minutes: Math.max(1, Math.round(minutes)) };
  S.sel = new Set([h.id]); go('hoy'); openCheckinSheet();
}
function runCrono(){
  let t0 = null, acc = 0, laps = [];
  const now = () => acc + (t0 ? Date.now() - t0 : 0);
  const fmt = (ms) => { const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600); return (h ? h + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') : Math.floor(s / 60)) + ':' + String(s % 60).padStart(2, '0'); };
  const paint = () => {
    const el = openRunner(`${runnerHeader('Cronómetro')}
      <div class="clock" id="clk">${fmt(now())}</div>
      <div class="grid2 section">
        <button class="btn ${t0 ? 'ghost' : ''}" id="c-go">${t0 ? 'Pausa' : acc ? 'Seguir' : 'Empezar'}</button>
        <button class="btn ghost" id="c-lap" ${t0 ? '' : 'disabled'}>Vuelta</button>
      </div>
      ${laps.length ? `<div class="card section">${laps.map((l, i) => `<div class="rec"><span>Vuelta ${i + 1}</span><b style="font-variant-numeric:tabular-nums">${fmt(l - (laps[i - 1] || 0))}</b></div>`).reverse().join('')}</div>` : ''}
      ${now() >= 60000 && !t0 ? `<div class="section"><button class="btn green" id="c-log">Terminar y anotar (${Math.round(now() / 60000)} min)</button></div>` : ''}
      ${acc && !t0 ? '<div class="section" style="text-align:center"><button class="link" id="c-reset">Volver a cero</button></div>' : ''}`);
    bindRunnerCommon(el);
    $('#c-go', el).onclick = () => { if (t0){ acc += Date.now() - t0; t0 = null; clearInterval(RT); } else { t0 = Date.now(); tick(); } paint(); };
    $('#c-lap', el).onclick = () => { laps.push(now()); vibrate(30); paint(); };
    const lg = $('#c-log', el); if (lg) lg.onclick = () => logWithMinutes(now() / 60000);
    const rs = $('#c-reset', el); if (rs) rs.onclick = () => { acc = 0; laps = []; paint(); };
  };
  const tick = () => { clearInterval(RT); RT = setInterval(() => { const c = $('#clk'); if (c) c.textContent = fmt(now()); }, 200); };
  paint();
}

const healthOn = () => IS_NATIVE && LS.get('fueguitos_salud') === '1';
function healthBlock(){

    <button class="toggle ${healthOn() ? 'on' : ''}" role="switch" aria-checked="${healthOn()}" aria-label="Anotar con Salud" id="hl-tg"></button></div>
    <p class="hint" style="margin-bottom:0">Sirve con el Apple Watch, Strava, Nike Run Club o cualquier app que guarde tus entrenamientos en Salud.</p>`;
}
async function toggleHealth(){
  if (healthOn()){ LS.del('fueguitos_salud'); renderPerfil(); return; }
  const r = await nat('healthAuthorize');
  if (!r || !r.ok){ toast('No pudimos conectar con Salud. Revisá Ajustes → Salud → Acceso a datos → Fueguitos.', 4500); return; }
  LS.set('fueguitos_salud', '1'); renderPerfil(); toast('Conectado con Salud 🍎'); autoHealth();

let healthBusy = false;
async function autoHealth(){
  if (!healthOn() || !S.me || healthBusy) return;
  healthBusy = true;
  try {
    const since = parseDay(S.me.today).getTime() + 5 * 36e5; // el día arranca a las 5 AM
    const r = await nat('healthSince', { since });
    if (!r) return;
    const hs = S.me.habits.filter(h => !h.done_today);
    const dep = hs.find(h => /deporte|entren|gym|gimnas|ejerc|correr/i.test(h.name));
    const med = hs.find(h => /medita|mindful/i.test(h.name));
    const ws = (r.workouts || []).filter(w => w.minutes >= 10);
    const ids = [], notes = [];
    if (dep && ws.length){ ids.push(dep.id); notes.push(ws.map(w => `${w.type} ${w.minutes} min`).join(', ')); }
    if (med && (r.mindful || 0) >= 5){ ids.push(med.id); notes.push(`meditación ${r.mindful} min`); }
    if (!ids.length) return;
    const res = await rpc('api_checkin', { ...P(), p_habits: ids, p_photo: null, p_note: `Anotado por Salud: ${notes.join(' · ')}` });
    S.me.habits = res.habits; renderMain();
    if (dep && ids.includes(dep.id)){
      const map = { Correr: 'correr', Caminata: 'caminar', Bici: 'bici', 'Natación': 'nadar', Gimnasio: 'gym', 'Fútbol': 'futbol' };
      for (const w of ws) rpc('api_activity_add', { ...P(), p_habit: dep.id, p_kind: map[w.type] || 'deporte', p_km: null, p_minutes: w.minutes, p_note: `Salud: ${w.type}` }).catch(() => {});
      S.acts = null;
    }
    toast(`🍎 Salud: anotamos ${hs.filter(h => ids.includes(h.id)).map(h => h.name).join(' y ')} (${notes.join(' · ')})`, 4500);
  } catch(e){ console.warn('salud', e); }
  finally { healthBusy = false; }
}

/* ============ Progreso (gráficos de línea de una serie) ============ */
let progSel = null;
async function loadProgress(){
  try { const [a, l] = await Promise.all([rpc('api_activities', P()), rpc('api_lifts', P())]); S.acts = a || []; S.lifts = l || []; } catch(e){ S.acts = S.acts || []; S.lifts = S.lifts || []; }
  const box = $('#prog'); if (box && S.tab === 'perfil'){ box.innerHTML = progressBlock(); bindProgress(); }
}
// Opciones: una por actividad con distancia o tiempo, y una por ejercicio del gimnasio.
function progressOptions(){
  const out = [];
  Object.entries(ACT).forEach(([k, [ic, l, dist]]) => {
    const xs = (S.acts || []).filter(a => a.kind === k);
    if (dist && xs.some(a => a.km)) out.push({ id: 'a:' + k, label: `${ic} ${l}`, unit: 'km', title: `${l}: km por salida`, pts: xs.filter(a => a.km).map(a => ({ d: a.day, v: +a.km })) });
    else if (xs.some(a => a.minutes)) out.push({ id: 'a:' + k, label: `${ic} ${l}`, unit: 'min', title: `${l}: minutos por sesión`, pts: xs.filter(a => a.minutes).map(a => ({ d: a.day, v: a.minutes })) });
  });
  const byEx = {};
  (S.lifts || []).forEach(l => { const k = l.exercise.toLowerCase(); (byEx[k] = byEx[k] || { name: capEx(l.exercise), days: {} }); const d = String(l.created_at).slice(0, 10); byEx[k].days[d] = Math.max(byEx[k].days[d] || 0, +l.kg); });
  Object.values(byEx).forEach(x => out.push({ id: 'l:' + x.name.toLowerCase(), label: `🏋️ ${x.name}`, unit: 'kg', title: `${x.name}: kg máximos por día`, pts: Object.entries(x.days).sort().map(([d, v]) => ({ d, v })) }));
  return out;
}
function progressBlock(){
  if (!S.acts || !S.lifts) return '<div class="spinner" style="margin:12px auto"></div>';
  const opts = progressOptions();
  if (!opts.length) return '<p class="muted" style="margin:0">Cuando anotes Deporte, tocá "Agregar detalle" y cargá la distancia, el tiempo o el peso. Acá vas a ver si cada vez corrés más o levantás más.</p>';
  if (!opts.find(o => o.id === progSel)) progSel = opts[0].id;
  const o = opts.find(x => x.id === progSel);
  const vs = o.pts.map(p => p.v), last = vs[vs.length - 1], first = vs[0], best = Math.max(...vs);
  const nf = (v) => Number(v).toLocaleString('es-AR', { maximumFractionDigits: 1 });
  const since30 = addDays(S.me.today, -30);
  const tot30 = o.pts.filter(p => p.d > since30).reduce((a, p) => a + p.v, 0);
  const delta = vs.length > 1 ? last - first : null;
  return `<div class="chips" style="margin-bottom:10px">${opts.map(x => `<button class="chip ${x.id === progSel ? 'on' : ''}" data-pg="${esc(x.id)}">${esc(x.label)}</button>`).join('')}</div>
    <div class="tiles">
      <div class="tile"><div class="tl">Récord</div><div class="tv">${nf(best)} ${o.unit}</div></div>
      ${o.unit !== 'kg' ? `<div class="tile"><div class="tl">Últimos 30 días</div><div class="tv">${nf(tot30)} ${o.unit}</div></div>` : ''}
      ${o.unit === 'kg' && delta !== null ? `<div class="tile"><div class="tl">Desde el primero</div><div class="tv">${delta > 0 ? '+' : ''}${nf(delta)} ${o.unit}</div></div>`
        : `<div class="tile"><div class="tl">${o.unit === 'km' ? 'Salidas' : 'Sesiones'}</div><div class="tv">${o.pts.length}</div></div>`}
    </div>
    <h3 style="margin:14px 0 6px;font-size:15px">${esc(o.title)}</h3>
    ${o.pts.length > 1 ? lineChart(o.pts, o.unit) : `<p class="muted small" style="margin:0">Con una marca más ya ves la línea de progreso.</p>`}
    <details class="more" style="margin-top:8px"><summary>Ver como lista</summary>
      <div style="margin-top:6px">${o.pts.slice().reverse().map(p => `<div class="rec"><span>${fmtDay(p.d)}</span><b>${nf(p.v)} ${o.unit}</b></div>`).join('')}</div></details>`;
}
function bindProgress(){
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { progSel = b.dataset.pg; const box = $('#prog'); box.innerHTML = progressBlock(); bindProgress(); });
  const ch = $('#prog .chart'); if (ch) bindChart(ch);
}
// Línea de una serie: 2px, puntos de 8px con anillo del color de la superficie, grilla recesiva, un solo eje.
function lineChart(pts, unit){
  const W = 320, H = 170, L = 34, R = 14, T = 12, B = 22;
  const vs = pts.map(p => p.v), max = Math.max(...vs), min = Math.min(...vs);
  const niceStep = (span) => { const raw = span / 3, pow = 10 ** Math.floor(Math.log10(raw || 1)); return [1, 2, 2.5, 5, 10].map(m => m * pow).find(s => s >= raw) || pow * 10; };
  let lo = Math.max(0, min - (max - min) * 0.15), hi = max + (max - min) * 0.1 || max + 1;
  const step = niceStep(hi - lo); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
  const t0 = parseDay(pts[0].d).getTime(), t1 = parseDay(pts[pts.length - 1].d).getTime() || t0 + 1;
  const x = (d) => L + (t1 === t0 ? (W - L - R) / 2 : (parseDay(d).getTime() - t0) / (t1 - t0) * (W - L - R));
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
  const nf = (v) => Number(v).toLocaleString('es-AR', { maximumFractionDigits: 1 });
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${path}L${x(pts[pts.length - 1].d).toFixed(1)},${H - B}L${x(pts[0].d).toFixed(1)},${H - B}Z`;
  const lp = pts[pts.length - 1];
  const dd = (d) => { const z = parseDay(d); return `${z.getDate()}/${z.getMonth() + 1}`; };
  return `<div class="chart" data-pts='${esc(JSON.stringify(pts.map(p => [p.d, p.v, x(p.d), y(p.v)])))}' data-unit="${esc(unit)}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de progreso, último valor ${nf(lp.v)} ${esc(unit)}">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="cg"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" class="ct" text-anchor="end">${nf(v)}</text>`).join('')}
      <path d="${area}" class="ca"/>
      <path d="${path}" class="cl"/>
      ${pts.map(p => `<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" class="cd"/>`).join('')}
      <text x="${L}" y="${H - 5}" class="ct">${dd(pts[0].d)}</text><text x="${W - R}" y="${H - 5}" class="ct" text-anchor="end">${dd(lp.d)}</text>
      <line class="cx" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
    </svg>
    <div class="ctip" hidden></div>
  </div>`;
}
// Tocar o pasar el mouse muestra el punto más cercano (con línea guía y globito).
function bindChart(ch){
  const pts = JSON.parse(ch.dataset.pts), unit = ch.dataset.unit, svg = ch.querySelector('svg'), tip = ch.querySelector('.ctip'), cx = ch.querySelector('.cx');
  const show = (ev) => {
    const r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * 320;
    let best = pts[0]; pts.forEach(p => { if (Math.abs(p[2] - vx) < Math.abs(best[2] - vx)) best = p; });
    cx.setAttribute('x1', best[2]); cx.setAttribute('x2', best[2]); cx.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.innerHTML = `<b>${Number(best[1]).toLocaleString('es-AR', { maximumFractionDigits: 1 })} ${esc(unit)}</b><br>${esc(fmtDay(best[0]))}`;
    const px = best[2] / 320 * r.width, py = best[3] / 170 * r.height;
    tip.style.left = Math.min(Math.max(px, 60), r.width - 60) + 'px'; tip.style.top = Math.max(py - 8, 0) + 'px';
  };
  const hide = () => { tip.hidden = true; cx.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);
}

function heatmap(){
  const today = S.me.today, weeks = 18;
  const byDay = {};
  (S.history || []).forEach(x => { byDay[x.day] = byDay[x.day] || { d: 0, i: 0 }; if (x.kind === 'hecho') byDay[x.day].d++; else if (x.kind === 'hielo') byDay[x.day].i++; });
  const t = parseDay(today);
  // columnas = semanas (domingo arriba)
  const first = addDays(today, -t.getDay() - (weeks-1)*7);
  let cells = '';
  for (let i = 0; i < weeks*7; i++){
    const d = addDays(first, i);
    if (d > today){ cells += '<i class="fut"></i>'; continue; }
    const v = byDay[d]; let c = '';
    if (v && v.d) c = v.d >= 3 ? 'l3' : v.d === 2 ? 'l2' : 'l1';
    else if (v && v.i) c = 'ic';
    cells += `<i class="${c}" title="${d}"></i>`;
  }
  return `<div class="heat" aria-label="Historial de las últimas ${weeks} semanas">${cells}</div>`;
}
/* Widget de iPhone: código para la app gratis Scriptable, con la llave de este usuario adentro. */
function widgetScript(){
  const app = appBase();
  return `// Fueguitos · widget para Scriptable (iPhone)
// Tocá un hábito del widget para anotarlo (o desanotarlo). No compartas este código: tiene tu llave adentro.
const TOKEN = "${S.token}";
const APP = "${app}";
const API = "${SB_URL}/rest/v1/rpc/";
const KEY = "${SB_KEY}";

async function rpc(fn, body) {
  const r = new Request(API + fn);
  r.method = "POST";
  r.headers = { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" };
  r.body = JSON.stringify(Object.assign({ p_token: TOKEN }, body || {}));
  return await r.loadJSON();
}
const runUrl = (q) => "scriptable:///run/" + encodeURIComponent(Script.name()) + "?" + q;

// Tocaron el widget: anotar o desanotar, con confirmación y tick.
async function toggle(id) {
  const me = await rpc("api_me");
  const hs = me.habits || [];
  let h = hs.find(x => x.id === id);
  if (!h) {
    const a = new Alert(); a.title = "¿Qué anotás hoy?";
    hs.forEach(x => a.addAction((x.done_today ? "✓ " : "") + x.emoji + " " + x.name));
    a.addCancelAction("Nada");
    const i = await a.presentSheet(); if (i < 0) return;
    h = hs[i];
  }
  const a = new Alert();
  if (!h.done_today) {
    const r = await rpc("api_checkin", { p_habits: [h.id], p_photo: null, p_note: null });
    const x = (r.results || [])[0] || {};
    a.title = "✓ " + h.name + " anotado";
    a.message = "Día " + (x.streak || h.streak + 1) + " 🔥" + (x.earned_ice ? "\\n¡Ganaste un hielito! 🧊" : "");
    a.addAction("Listo"); a.addDestructiveAction("Me equivoqué, desanotar");
    if (await a.presentAlert() === 1) { await rpc("api_undo_checkin", { p_habit: h.id }); }
  } else {
    a.title = "✓ " + h.name + " ya está anotado hoy";
    a.message = "Día " + h.streak + " 🔥";
    a.addAction("Dejarlo así"); a.addDestructiveAction("Desanotar");
    if (await a.presentAlert() === 1) { await rpc("api_undo_checkin", { p_habit: h.id }); }
  }
}

async function buildWidget() {
  const FIRE = new Color("#FF5A1F"), GOLD = new Color("#FFB800"), OK = new Color("#2BC273"), DIM = new Color("#8E7A70");
  const w = new ListWidget();
  const g = new LinearGradient(); g.colors = [new Color("#2A140C"), new Color("#170E0B")]; g.locations = [0, 1];
  w.backgroundGradient = g;
  w.setPadding(12, 14, 12, 14);
  w.url = runUrl("h=menu");
  try {
    const me = await rpc("api_me");
    const hs = me.habits || [];
    const faltan = hs.filter(h => h.required_today && !h.done_today);
    const t = w.addText(faltan.length ? "🔥 Te falta hoy" : "🔥 Día completo");
    t.font = Font.heavySystemFont(13); t.textColor = faltan.length ? FIRE : GOLD;
    w.addSpacer(6);
    const big = config.widgetFamily !== "small";
    for (const h of hs.slice(0, big ? 4 : 3)) {
      const row = w.addStack(); row.centerAlignContent();
      if (big) row.url = runUrl("h=" + h.id);
      const tick = row.addText(h.done_today ? "✓" : "○");
      tick.font = Font.heavySystemFont(big ? 20 : 17); tick.textColor = h.done_today ? OK : (h.required_today ? FIRE : DIM);
      row.addSpacer(6);
      const n = row.addText(h.emoji + " " + h.streak);
      n.font = Font.heavySystemFont(big ? 20 : 17); n.textColor = h.done_today ? GOLD : Color.white();
      if (big) { row.addSpacer(); const i = row.addText("🧊" + h.ice + "  ⌛" + h.left_for_ice); i.font = Font.systemFont(12); i.textColor = new Color("#C2A69A"); }
      w.addSpacer(big ? 5 : 3);
    }
    // En el widget chico, si hay un solo hábito, el toque lo anota directo.
    if (hs.length === 1) w.url = runUrl("h=" + hs[0].id);
  } catch (e) {
    const t = w.addText("🔥 Fueguitos\\nSin conexión"); t.textColor = Color.white(); t.font = Font.boldSystemFont(14);
  }
  w.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);
  return w;
}

const q = args.queryParameters || {};
if (config.runsInWidget) {
  Script.setWidget(await buildWidget());
} else if (q.h) {
  await toggle(q.h === "menu" ? null : q.h);
} else {
  await (await buildWidget()).presentMedium();
}
Script.complete();
`;
}
