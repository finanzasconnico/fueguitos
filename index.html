<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fueguitos</title>
<meta name="description" content="Mantené el fueguito de deporte, lectura y meditación con tus amigos.">
<meta name="theme-color" content="#FFF4EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170E0B" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fueguitos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4EC; --card:#FFFFFF; --ink:#26140E; --muted:#7A5F55; --line:#F2DDD0;
  --fire:#FF5A1F; --fire-dark:#CC3F0B; --fire-soft:#FFE3D3;
  --gold:#FFB800; --ember:#FF2E63; --ice:#3AA9E6; --ice-dark:#1E86C0; --ice-soft:#E2F3FC;
  --ok:#23A566; --ok-soft:#DDF5E8; --danger:#D6364A;
  --gray-flame:#DCC9BF; --gray-flame-2:#EFE1D8;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --field:#FFFFFF; --nav:rgba(255,255,255,.96); --party:#1E0F0A; --toast:#26140E; --toast-ink:#FFFFFF;
  --ok-ink:#16603F; --ok-line:#BFE8D2; --fire-ink:#8A3208; --ice-ink:#155F88;
  --heat1:#FFD3BC; --heat2:#FF9E6E; --heat-ice:#A9DCF6;
  color-scheme:light;
}
/* Modo oscuro: se usa mucho de noche, antes del corte de las 5 AM */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#170E0B; --card:#241611; --ink:#FBEFE8; --muted:#C2A69A; --line:#3E2A21;
    --fire-dark:#B83A0C; --fire-soft:#41200F; --ice-soft:#132A38; --ice-dark:#4DB5EE; --ok-soft:#14301F;
    --gray-flame:#5A4439; --gray-flame-2:#735A4D;
    --field:#1D120E; --nav:rgba(23,14,11,.94); --party:#0E0705; --toast:#FBEFE8; --toast-ink:#170E0B;
    --ok-ink:#7DDBA8; --ok-line:#2C5A40; --fire-ink:#FFB08A; --ice-ink:#8FD2F7;
    --heat1:#6A3420; --heat2:#B9552A; --heat-ice:#2A5F80;
    color-scheme:dark;
  }
}
::selection{background:var(--fire);color:#fff}
input{caret-color:var(--fire)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,label,input,.habit{touch-action:manipulation}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--ice-dark)}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px;border-radius:8px}
.wrap{max-width:480px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(96px + var(--safe-b))}
.wrap.with-bar{padding-bottom:calc(160px + var(--safe-b))}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.section{margin-top:26px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}

/* Botones gorditos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:17px;background:var(--fire);color:#fff;box-shadow:0 4px 0 var(--fire-dark);transition:transform .06s,box-shadow .06s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--fire-dark)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ice{background:var(--ice);box-shadow:0 4px 0 var(--ice-dark)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.green{background:var(--ok);box-shadow:0 4px 0 #17804E}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px;width:auto}
.link{color:var(--ice-dark);font-weight:700;font-size:15px}
.link.danger{color:var(--danger)}

.card{background:var(--card);border-radius:20px;padding:16px;border:2px solid var(--line)}
.field{display:block}
.field span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.input{width:100%;min-height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:var(--field);font-size:17px}
.input:focus{border-color:var(--ice);outline:none}
textarea.input{padding:12px 14px;min-height:80px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

/* Encabezado */
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.top .date{font-size:15px;color:var(--muted);font-weight:600}

/* Tarjetas de hábito */
.habits{display:grid;gap:12px}
.habit{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 14px 12px 10px;text-align:left;width:100%;position:relative;transition:border-color .12s,background .12s}
.habit.sel{border-color:var(--fire);background:var(--fire-soft)}
.habit.done{border-color:var(--ok-line)}
.flamebox{position:relative;width:74px;height:78px;display:grid;place-items:center}
.flamebox svg{width:58px;height:72px}
.flamebox .n{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-weight:800;font-size:22px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.flamebox.off .n{color:var(--muted);text-shadow:none}
.habit .name{font-weight:800;font-size:19px;display:flex;align-items:center;gap:6px}
.meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--ink)}
.pill.ice{background:var(--ice-soft);color:var(--ice-dark)}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.fire{background:var(--fire-soft);color:var(--fire-ink)}
.check{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.habit.sel .check{background:var(--fire);border-color:var(--fire)}
.habit.done .check{background:var(--ok);border-color:var(--ok)}
.undo{font-size:12px;font-weight:700;color:var(--muted);text-decoration:underline;margin-top:4px}

.banner{border-radius:16px;padding:12px 14px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.banner.ice{background:var(--ice-soft);color:var(--ice-ink)}
.banner.ok{background:var(--ok-soft);color:var(--ok-ink)}
.banner.fire{background:var(--fire-soft);color:var(--fire-ink)}

/* Motivación */
.quote{position:relative;margin:0 0 16px;padding:14px 16px 14px 46px;border-radius:18px;background:var(--fire-soft);color:var(--fire-ink)}
.quote p{margin:0;font-weight:700;font-size:17px;line-height:1.3;text-wrap:balance}
.quote .qmark{position:absolute;left:12px;top:4px;font-size:52px;font-weight:800;color:var(--fire);line-height:1}
.banner.urgent{border:2px solid var(--fire)}
.music{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line);text-decoration:none;color:var(--ink)}
.music:last-child{border-bottom:0}
.music .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--fire-soft)}
.music b{display:block;font-size:16px}
.music .go{margin-left:auto;font-weight:800;color:var(--ok-ink);font-size:14px;flex:none}

/* PIN y extras */
.input.pin{letter-spacing:.5em;font-size:22px;font-weight:800;text-align:center;max-width:180px}
details.more summary{cursor:pointer;font-weight:700;color:var(--ice-dark);font-size:15px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.nudge{border-color:var(--fire)}

/* Subsecciones del grupo */
.subtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px;background:var(--line);margin:0 0 16px}
.subtabs button{min-height:40px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.subtabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Compartido */
.share{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:2px solid var(--line)}
.share:last-child{border-bottom:0}
.share .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--fire-soft)}
.share .stitle{display:block;font-weight:800;font-size:16px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.share .react{flex:none}

/* Torneos */
.emojis button.on{border-color:var(--fire);background:var(--fire-soft)}
.fmt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--card);min-height:84px}
.fmt.on{border-color:var(--fire);background:var(--fire-soft)}
.fmt .small{color:var(--muted);font-weight:600}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.prow .link{font-size:18px;padding:0 6px}
.avbtn{border-radius:50%}
.avpick{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.avpick button{font-size:22px;width:40px;height:40px;border-radius:12px}
.pav{display:inline-grid;place-items:center;border-radius:50%;flex:none;object-fit:cover;color:#fff;font-weight:800;line-height:1}
.tview .inner{max-width:760px}
.champ{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:radial-gradient(circle at 20% 40%, #6B240B 0, var(--party) 80%);color:#fff;margin-bottom:16px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.champ .cname{font-size:26px;font-weight:800;color:var(--gold)}
.stand{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
.stand th{font-size:12px;color:var(--muted);font-weight:700;padding:4px 6px;text-align:center}
.stand td{padding:6px;text-align:center;border-top:2px solid var(--line)}
.stand td:nth-child(2){text-align:left}
.stand tr.q td:first-child{color:var(--ok-ink);font-weight:800}
.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bracket{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.bcol{flex:0 0 220px;display:flex;flex-direction:column;justify-content:space-around;gap:10px;scroll-snap-align:start}
.bhead{font-weight:800;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bmatch{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 10px}
.bmatch.done{border-color:var(--ok-line)}
.bmatch[disabled]{opacity:.75}
.bp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:5px 0;font-weight:700}
.bp+.bp{border-top:2px solid var(--line)}
.bp b{font-size:18px;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.bp.win{color:var(--ok-ink)}
.bp.lose{opacity:.55}
.bplay{display:block;font-size:12px;font-weight:800;color:var(--fire);padding-top:2px}
.tsheet{position:fixed}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vsp{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.vsp b{overflow-wrap:anywhere}
.input.score{text-align:center;font-size:28px;font-weight:800;max-width:110px}

/* Guía de instalación */
.guide{position:fixed;inset:0;z-index:90;background:rgba(20,10,6,.82);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 70px) 18px calc(var(--safe-b) + 70px);animation:fade .2s}
.gcard{background:var(--bg);border-radius:26px;padding:22px 20px 18px;width:100%;max-width:400px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.glogo{width:56px;height:70px;margin-bottom:8px}
.gsteps{margin:0 0 16px;padding:0;list-style:none;counter-reset:s}
.gsteps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;font-size:17px;line-height:1.35}
.gsteps li::before{content:counter(s);position:absolute;left:0;top:6px;width:30px;height:30px;border-radius:50%;background:var(--fire);color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px}
.gcard .btn+.btn{margin-top:12px}
.ios-share{display:inline-block;width:16px;height:18px;vertical-align:-3px;border:2px solid currentColor;border-top:0;border-radius:0 0 4px 4px;position:relative;margin:0 2px}
.ios-share::before{content:"↑";position:absolute;left:50%;top:-11px;transform:translateX(-50%);font-weight:800;font-size:14px;line-height:1}
.garrow{position:fixed;color:var(--gold);width:40px;height:62px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.garrow svg{width:100%;height:100%}
.garrow.tr{top:calc(var(--safe-t) + 6px);right:14px;animation:nudgeUp 1s ease-in-out infinite alternate}
.garrow.br{bottom:calc(var(--safe-b) + 6px);right:18px;transform:rotate(180deg);animation:nudgeDown 1s ease-in-out infinite alternate}
@keyframes nudgeUp{to{transform:translateY(-10px)}}
@keyframes nudgeDown{from{transform:rotate(180deg)}to{transform:rotate(180deg) translateY(-10px)}}

/* Anotado con un toque */
.tickscreen{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 34%, #6B240B 0, var(--party) 62%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--safe-b));text-align:center;animation:fade .2s}
.bigtick{width:120px;height:120px;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-size:70px;font-weight:800;margin-bottom:18px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.tickscreen .lbl{font-size:20px;font-weight:700;margin:6px 0 0;color:var(--gold)}
.tickscreen .btns{width:100%;max-width:340px;margin-top:28px;display:grid;gap:14px}
.tickscreen .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.25);box-shadow:0 4px 0 rgba(255,255,255,.12)}

/* Barra de acción */
.actionbar{position:fixed;left:0;right:0;bottom:calc(74px + var(--safe-b));padding:0 16px;z-index:20;pointer-events:none}
.actionbar .inner{max-width:480px;margin:0 auto;pointer-events:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* Navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);backdrop-filter:blur(10px);border-top:2px solid var(--line);padding-bottom:var(--safe-b);z-index:30}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--fire)}

/* Hojas (modales desde abajo) */
.scrim{position:fixed;inset:0;background:rgba(38,20,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:10px 16px calc(20px + var(--safe-b));max-height:92dvh;overflow:auto;animation:sheet .22s cubic-bezier(.2,.9,.3,1)}
@keyframes sheet{from{transform:translateY(40%)}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.photo-drop{border:2px dashed var(--gray-flame);border-radius:20px;background:var(--card);min-height:180px;display:grid;place-items:center;overflow:hidden;position:relative}
.photo-drop img{width:100%;max-height:52dvh;object-fit:cover;display:block}
.photo-drop .x{position:absolute;top:10px;right:10px;background:rgba(27,26,46,.7);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}

/* Festejo */
.party{position:fixed;inset:0;z-index:60;background:var(--party);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--safe-b));text-align:center;animation:fade .2s}
.party .bigflame{width:150px;height:186px;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.party .bigflame .inner-f{transform-origin:50% 100%;animation:flick 1.1s ease-in-out .7s infinite alternate}
@keyframes pop{0%{transform:scale(.2) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes flick{to{transform:scaleY(1.08) scaleX(.95)}}
.party{background:radial-gradient(circle at 50% 34%, #6B240B 0, var(--party) 62%)}
.party .hito{margin-top:14px;font-weight:800;font-size:22px}
.party .hito.big{font-size:30px;color:var(--gold);animation:pop .6s .8s both}
.party .count{font-size:88px;font-weight:800;line-height:1;margin-top:6px;color:var(--gold)}
.party .lbl{font-size:20px;font-weight:700;margin-top:4px}
.party .others{margin-top:18px;display:grid;gap:8px;width:100%;max-width:340px}
.party .others .o{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:700}
.party .gotice{margin-top:16px;background:var(--ice);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;font-size:18px;animation:pop .6s .5s both}
.party .btns{width:100%;max-width:340px;margin-top:28px;display:grid;gap:14px}
.party .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.25);box-shadow:0 4px 0 rgba(255,255,255,.12)}

/* Grupo */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.board{display:grid;gap:10px}
.member{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.member .who{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.mh{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mh .m{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:14px;padding:4px 8px;border-radius:10px;background:var(--bg);color:var(--muted)}
.mh .m.done{background:var(--fire-soft);color:var(--fire-ink)}
.post{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.post img{width:100%;display:block;max-height:70dvh;object-fit:cover;background:#ddd}
.post .pbody{padding:12px 14px}
.reacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.react{border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-size:15px;font-weight:700;background:var(--card)}
.react.mine{border-color:var(--fire);background:var(--fire-soft)}
.empty{text-align:center;padding:26px 16px;border:2px dashed var(--line);border-radius:20px;color:var(--muted)}
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .v{font-weight:800;font-size:22px;color:var(--fire)}

/* Rutinas */
.routine{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.routine .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.runner{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:calc(var(--safe-t) + 14px) 16px calc(24px + var(--safe-b))}
.runner .inner{max-width:480px;margin:0 auto}
.clock{font-size:76px;font-weight:800;text-align:center;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.rest{color:var(--ice-dark)}
.ex{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.ex.done{border-color:var(--ok-line);background:var(--ok-soft)}
.ex .reps{font-weight:800;font-size:22px;color:var(--fire);font-variant-numeric:tabular-nums}
.ex.done .reps{color:var(--ok-ink)}
.progress{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--fire);border-radius:10px;transition:width .3s}
.video{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Perfil */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--line);display:block}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--fire)}
.heat i.ic{background:var(--heat-ice)}.heat i.fut{background:transparent}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle.on{background:var(--ok)}
.toggle.on::after{transform:translateX(20px)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.hrow:last-child{border-bottom:0}
.days{display:flex;gap:6px}
.day{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.emojis{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.emojis button{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--card);border:2px solid var(--line)}
.stepper{display:flex;align-items:center;gap:0;border:2px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;width:max-content}
.stepper button{width:46px;height:46px;font-size:22px;font-weight:800}
.stepper output{min-width:48px;text-align:center;font-weight:800;font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc{min-height:50px;display:flex;flex-direction:column;justify-content:center;font-size:15px}
.calc b{font-size:22px;font-weight:800}

/* Bienvenida */
.welcome{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:24px 20px calc(24px + var(--safe-b))}
.welcome .logo{width:92px;height:114px;margin-bottom:18px}
.welcome h1{font-size:44px}

.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);background:var(--toast);color:var(--toast-ink);padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;max-width:88vw;text-align:center;animation:up .2s}
.spinner{width:28px;height:28px;border:4px solid var(--line);border-top-color:var(--fire);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>

/* ============ App nativa (iPhone) ============ */
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const PUBLIC_URL = 'https://fueguitos.vercel.app/';
const appBase = () => IS_NATIVE ? PUBLIC_URL : `${location.origin}${location.pathname}`;

const nat = (method, opts = {}) => IS_NATIVE ? window.Capacitor.nativePromise('Fueguitos', method, opts).catch(e => { console.warn('nativo', method, e); return null; }) : Promise.resolve(null);

/* ============ Utilidades ============ */
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['D','L','M','M','J','V','S'];
const DAY_NAMES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const AV_COLORS = ['#FF6B2C','#3AA9E6','#23A566','#8A5CF6','#E8457A','#E0A100','#1B1A2E'];
const avColor = (s) => { let h=0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0))>>>0; return AV_COLORS[h % AV_COLORS.length]; };
const parseDay = (d) => { const [y,m,dd] = d.split('-').map(Number); return new Date(y, m-1, dd); };
const fmtDay = (d) => { const x = parseDay(d); return `${DAY_NAMES[x.getDay()][0].toUpperCase()+DAY_NAMES[x.getDay()].slice(1)} ${x.getDate()} de ${MONTHS[x.getMonth()]}`; };
const addDays = (d, n) => { const x = parseDay(d); x.setDate(x.getDate()+n); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso).getTime())/60000); if (m < 1) return 'recién'; if (m < 60) return `hace ${m} min`; const h = Math.round(m/60); return `hace ${h} h`; };
const expiresIn = (iso) => { const h = Math.max(0, Math.round((new Date(iso).getTime() + 864e5 - Date.now())/36e5)); return h <= 1 ? 'se borra en menos de 1 h' : `se borra en ${h} h`; };
const daysLabel = (days) => {
  const s = [...days].sort((a,b)=>a-b).join(',');
  if (s === '0,1,2,3,4,5,6') return 'Todos los días';
  if (s === '0,1,2,3,4') return 'Domingo a jueves';
  if (s === '1,2,3,4,5') return 'Lunes a viernes';
  return [...days].sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d => DAY_NAMES[d].slice(0,3)).join(', ');
};

function flameSVG(on=true, cls=''){

  const b = on ? 'var(--gold)' : 'var(--gray-flame-2)';

}
const ICONS = {
  hoy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1.5 5 7 7.5 7 13.5a7 7 0 0 1-14 0c0-3.5 2-6 3.8-7.8 0 2.4 1.2 3.6 2.4 3.6C10.6 7.6 11 4.8 12 2z"/></svg>',
  grupo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.6c2.6.1 4.5 1.8 5 4.9"/></svg>',
  rutinas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5"/></svg>',
  perfil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/></svg>'
};

function toast(msg, ms=2400){
  document.querySelectorAll('.toast').forEach(x => x.remove()); // uno a la vez, sin encimarse
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); let ok=false; try { ok = document.execCommand('copy'); } catch(_){} ta.remove(); return ok;
  }
}
function vibrate(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
let audioCtx;
function beep(freq=880, dur=0.18, times=1){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i=0;i<times;i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + i*0.28;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.start(t0); o.stop(t0+dur+0.02);
    }
  } catch(e){}
}

/* ============ API ============ */
const ERRORS = {
  SESION_INVALIDA: 'Tu sesión no existe más. Volvé a entrar con tu apodo.',
  CODIGO_INVALIDO: 'Ese código no existe. Revisalo con quien te invitó.',
  FOTO_MUY_GRANDE: 'La foto es muy pesada. Probá con otra.',
  SOLO_ADMIN: 'Solo quien administra el grupo puede hacer esto.',
  NO_PERMITIDO: 'No tenés acceso a eso.',
  HABITO_NO_EXISTE: 'Ese hábito ya no existe.',
  DATOS_INVALIDOS: 'Revisá los datos y probá de nuevo.',
  APODO_EN_USO: 'Ese apodo ya lo usa otra persona. Probá con otro. Si es tuyo, tocá «Ya tengo cuenta» y entrá con tu PIN.',
  APODO_INVALIDO: 'Poné un apodo de hasta 30 letras.',
  PIN_INVALIDO: 'El PIN son 4 números.',
  EMPATE_KO: 'EMPATE_KO',
  PARTIDO_INCOMPLETO: 'Todavía falta saber quién juega ese partido.',
  YA_SE_JUGO_SIGUIENTE: 'Ese resultado ya definió el partido siguiente. Borrá primero el de la ronda siguiente.'
};
async function rpc(fn, args={}){
  let res;
  try {
    res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
  } catch(e){ throw new Error('Sin conexión. Revisá tu internet y probá de nuevo.'); }
  const txt = await res.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!res.ok){
    const code = (data && data.message) || '';
    if (code === 'SESION_INVALIDA'){ LS.del('racha_token'); S.token = null; }
    throw new Error(ERRORS[code] || 'Algo falló. Probá de nuevo en un rato.');
  }
  return data;
}

/* ============ Estado ============ */
const S = {
  token: LS.get('racha_token'),
  me: null, history: [],
  tab: 'hoy',
  groupId: LS.get('racha_group'),
  group: null, groupLoading: false,
  sel: new Set(),
  pendingJoin: null, quick: null,
  onboarding: false,
  lifts: null,
  gsub: ['racha','compartido','torneos'].includes(LS.get('fueguitos_gsub')) ? LS.get('fueguitos_gsub') : 'racha',
  shares: {}, tourns: {}
};
const P = () => ({ p_token: S.token });

async function loadMe(){
  S.me = await rpc('api_me', P());
  rpc('api_history', P()).then(h => { S.history = h || []; if (S.tab === 'hoy' || S.tab === 'perfil') renderMain(); }).catch(()=>{});
}
async function loadGroup(){
  const groups = S.me?.groups || [];
  if (!groups.length){ S.group = null; return; }
  if (!groups.find(g => g.id === S.groupId)) S.groupId = groups[0].id;
  LS.set('racha_group', S.groupId);
  S.groupLoading = true;
  try { S.group = await rpc('api_group', { ...P(), p_group: S.groupId }); }
  finally { S.groupLoading = false; }
}

/* ============ Arranque ============ */
async function boot(){
  const q = new URLSearchParams(location.search);
  if (q.get('k')) { S.token = q.get('k'); LS.set('racha_token', S.token); }
  if (q.get('g')) S.pendingJoin = q.get('g').toUpperCase();
  if (q.get('anotar')) S.quick = q.get('anotar');
  S.rapido = q.get('rapido') === '1';
  if (['hoy','grupo','rutinas','perfil'].includes(q.get('tab'))) S.tab = q.get('tab');
  // Dentro de WhatsApp/Instagram se deja el link intacto, para que "Abrir en el navegador" conserve la invitación.
  if (q.toString() && !inAppBrowser()) history.replaceState(null, '', location.pathname);

  if (!S.token){ renderWelcome(); maybeInstallGuide(); return; }
  try {
    await loadMe();
  } catch(e){
    if (!S.token){ renderWelcome(); return; }
    renderOffline(e.message); return;
  }
  await afterLogin();
  maybeInstallGuide();
  syncPush().then(() => { if (IS_NATIVE && S.me && !S.onboarding) renderMain(); });
  autoHealth();
}

async function afterLogin(){
  if (S.pendingJoin){
    try {
      const g = await rpc('api_join_group', { ...P(), p_code: S.pendingJoin });
      S.groupId = g.id; LS.set('racha_group', g.id);
      toast(`Te sumaste a ${g.name} 🔥`);
      S.me = await rpc('api_me', P());
    } catch(e){ toast(e.message, 3500); }
    S.pendingJoin = null;
  }
  if (!S.me.habits.length){ S.onboarding = true; renderOnboarding(); return; }
  renderShell();
  if (S.quick){
    const h = S.me.habits.find(x => x.name.toLowerCase() === S.quick.toLowerCase());
    S.quick = null;
    if (h && S.rapido) quickToggle(h);
    else if (h && !h.done_today){ S.sel = new Set([h.id]); openCheckinSheet(); }
  }
}

/* ============ Plataforma e instalación ============ */
const UA = navigator.userAgent;
const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /android/i.test(UA);
// Navegadores metidos adentro de otras apps (WhatsApp, Instagram…): no dejan instalar.
const inAppBrowser = () => /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(UA);

// Cartel grande la primera vez que se entra desde el navegador del celu.
function maybeInstallGuide(){
  if (isStandalone() || !(isIOS || isAndroid)) return;
  if (LS.get('fueguitos_guia') && !inAppBrowser()) return;
  const inApp = inAppBrowser();
  const iosOther = isIOS && /CriOS|FxiOS|EdgiOS/i.test(UA);
  // En iPhone la app instalada no comparte datos con Safari: se lleva la invitación o la cuenta copiando un link.
  const hasPin = !!(S.me && S.me.user.has_pin);
  const carry = S.token && !hasPin ? `${appBase()}?k=${S.token}` : (!S.token && S.pendingJoin ? inviteLink(S.pendingJoin) : '');
  let arrow = 'tr', title, steps;
  if (inApp){
    title = 'Abrila en el navegador';
    steps = [`Tocá el menú <b>⋮</b> o <b>···</b> ${isIOS ? '(arriba o abajo a la derecha)' : 'arriba a la derecha'}.`, `Elegí <b>Abrir en ${isIOS ? 'Safari' : 'Chrome'}</b> (o "Abrir en el navegador").`, 'Ahí te mostramos cómo instalarla.'];
  } else if (isIOS){
    arrow = iosOther ? 'tr' : 'br';
    title = 'Instalá Fueguitos';
    steps = [
      ...(carry ? [`Primero tocá <b>${S.token ? 'Copiar mi cuenta' : 'Copiar mi invitación'}</b> (acá abajo).`] : []),
      iosOther ? 'Tocá <b>Compartir</b> <span class="ios-share" aria-hidden="true"></span> arriba a la derecha.' : 'Tocá <b>···</b> abajo a la derecha y después <b>Compartir</b> <span class="ios-share" aria-hidden="true"></span> (en iPhone más viejos, Compartir está abajo al medio).',
      'Bajá y elegí <b>Agregar a pantalla de inicio</b>.',
      S.token && hasPin ? 'Abrí Fueguitos desde el ícono nuevo y entrá con tu apodo y PIN.' : carry ? 'Abrí Fueguitos desde el ícono nuevo, tocá <b>Ya tengo cuenta</b> y pegá el link abajo de todo.' : 'Abrí Fueguitos desde el ícono nuevo y creá tu cuenta ahí.'
    ];
  } else {
    title = 'Instalá Fueguitos';
    steps = deferredInstall ? ['Tocá el botón naranja. Listo, queda en tu pantalla como cualquier app.'] : ['Tocá el menú <b>⋮</b> arriba a la derecha.', 'Elegí <b>Instalar app</b> (o "Agregar a pantalla principal").', 'Abrí Fueguitos desde el ícono nuevo.'];
  }
  const g = document.createElement('div');
  g.className = 'guide'; g.setAttribute('role', 'dialog'); g.setAttribute('aria-modal', 'true'); g.setAttribute('aria-label', title);
  g.innerHTML = `${(inApp || !deferredInstall || isIOS) ? `<div class="garrow ${arrow}" aria-hidden="true"><svg viewBox="0 0 48 72"><path d="M24 70V8M8 24 24 6l16 18" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>` : ''}
    <div class="gcard">
      <div class="glogo">${flameSVG(true)}</div>
      <h2>${title}</h2>
      <p class="muted" style="margin:6px 0 14px">Queda con su ícono en tu pantalla, a pantalla completa, como cualquier app.</p>
      <ol class="gsteps">${steps.map(x => `<li>${x}</li>`).join('')}</ol>
      ${!inApp && carry ? `<button class="btn ice" id="g-copy">${S.token ? 'Copiar mi cuenta' : 'Copiar mi invitación'}</button>` : ''}
      ${!inApp && !isIOS && deferredInstall ? '<button class="btn" id="g-inst">Instalar Fueguitos</button>' : ''}
      <button class="link" id="g-skip" style="display:block;margin:14px auto 0">${inApp ? 'Seguir acá igual' : 'Ahora no, seguir en el navegador'}</button>
    </div>`;
  document.body.appendChild(g);
  const close = () => { LS.set('fueguitos_guia', '1'); g.remove(); };
  $('#g-skip', g).onclick = close;
  const c = $('#g-copy', g); if (c) c.onclick = async () => { (await copy(carry)) ? toast('Copiado. Ahora instalala 👇', 3000) : toast(carry, 6000); };
  const i = $('#g-inst', g); if (i) i.onclick = async () => { deferredInstall.prompt(); const r = await deferredInstall.userChoice; deferredInstall = null; if (r.outcome === 'accepted') close(); };
}

const pinInput = (id, ph = '••••') => `<input class="input pin" id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="${ph}">`;

// Entrar desde otro dispositivo: apodo + PIN. También acepta el link de acceso o una invitación.
function haveAccountSheet(){
  const el = openSheet(`<h2>Entrar a mi cuenta</h2>
    <p class="muted">Con tu apodo y tu PIN entrás desde cualquier celu.</p>
    <form class="stack section" id="lg">
      <label class="field"><span>Apodo</span><input class="input" id="lg-n" maxlength="30" autocomplete="username" placeholder="Tu apodo"></label>
      <label class="field"><span>PIN</span>${pinInput('lg-p')}</label>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <details class="section more"><summary>No tengo PIN / tengo un link o invitación</summary>
      <p class="muted small">Pegá tu link de acceso (Perfil → Copiar mi link) o el link de invitación de tu grupo.</p>
      <div class="stack">
        <input class="input" id="h-link" inputmode="url" autocomplete="off" placeholder="https://fueguitos.vercel.app/?k=…">
        <div class="grid2">${navigator.clipboard && navigator.clipboard.readText ? '<button class="btn ghost sm" style="width:100%" id="h-paste">Pegar</button>' : '<span></span>'}<button class="btn ice sm" style="width:100%" id="h-go">Usar link</button></div>
      </div>
    </details>`);
  $('#lg', el).onsubmit = async (e) => {
    e.preventDefault();

/* ============ Notificaciones ============ */
const VAPID = 'BNI5NZVkLJbDX8l1e32yE__SU_NzbJMWF0tBVc5eAoB7K0VU84HXuraEqiGI37FrwWz8tzD9_jNg1-YRJwjHeoE';
const PUSH_FN = `${SB_URL}/functions/v1/push-recordatorios`;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
// En iPhone solo funcionan con la app instalada en la pantalla de inicio.
const pushNeedsInstall = () => isIOS && !isStandalone();
const b64u = (s) => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushSubscribe(){
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
  const j = sub.toJSON();
  await rpc('api_push_subscribe', { ...P(), p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
}
async function enablePushNative(){
  const r = await nat('registerPush');
  if (!r || !r.granted){ S.npush = 'denied'; toast('Sin permiso no te podemos avisar. Activalo en Ajustes → Fueguitos → Notificaciones.', 4200); return false; }
  try {
    await rpc('api_push_subscribe_apns', { ...P(), p_device: r.token });
    S.npush = 'granted';
    if (S.me.user.remind_hour == null){ await rpc('api_set_reminder', { ...P(), p_hour: 22 }); S.me.user.remind_hour = 22; }
    toast('¡Listo! Te avisamos si te falta anotar 🔔'); return true;
  } catch(e){ toast('No se pudo activar: ' + e.message, 4000); return false; }
}
async function enablePush(){
  if (IS_NATIVE) return enablePushNative();
  if (!pushSupported()){ toast('Este navegador no permite avisos'); return false; }
  if (pushNeedsInstall()){ toast('En iPhone los avisos andan con la app instalada. Instalala primero.', 4000); return false; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted'){ toast('Sin permiso no te podemos avisar. Lo podés activar en los ajustes del celu.', 4200); return false; }
  try {
    await pushSubscribe();
    if (S.me.user.remind_hour == null){ await rpc('api_set_reminder', { ...P(), p_hour: 22 }); S.me.user.remind_hour = 22; }
    toast('¡Listo! Te avisamos si te falta anotar 🔔'); return true;
  } catch(e){ toast('No se pudo activar: ' + e.message, 4000); return false; }
}
// Si ya dio permiso, se re-sincroniza la suscripción en cada arranque (cambia de cuenta, se renueva, etc.).
async function syncPush(){
  if (IS_NATIVE){
    const st = await nat('pushStatus'); S.npush = st ? st.status : 'default';
    if (S.npush === 'granted'){ const r = await nat('registerPush'); if (r && r.token) rpc('api_push_subscribe_apns', { ...P(), p_device: r.token }).catch(() => {}); }
    return;
  }
  if (pushSupported() && Notification.permission === 'granted' && S.token) pushSubscribe().catch(() => {}); }
async function testPush(){
  try { const r = await fetch(PUSH_FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ test_token: S.token }) }).then(r => r.json());

  } catch(e){ toast('No se pudo mandar la prueba'); }
}
const pushState = () => IS_NATIVE ? (S.npush || 'default') : !pushSupported() ? 'no' : pushNeedsInstall() ? 'instalar' : Notification.permission;

function bindHabitToggles(rerender){
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const h = S.me.available.find(x => x.id === b.dataset.toggle);
    if (h.active){

      catch(e){ toast(e.message); }

    const h = S.me.available.find(x => x.id === b.dataset.adjust);
    openActivateSheet(h, true, rerender);
  });

function stepper(id, val, min, max){
  return `<div class="stepper" data-stepper="${id}" data-min="${min}" data-max="${max}"><button type="button" data-d="-1" aria-label="Menos">−</button><output id="${id}">${val}</output><button type="button" data-d="1" aria-label="Más">+</button></div>`;
}
function bindSteppers(root){
  root.querySelectorAll('[data-stepper]').forEach(s => {
    const out = s.querySelector('output'); const min = +s.dataset.min, max = +s.dataset.max;
    s.querySelectorAll('button').forEach(b => b.onclick = () => { out.value = out.textContent = Math.max(min, Math.min(max, (+out.textContent) + (+b.dataset.d))); });
  });
}

// Con las reglas del hábito, la racha define sola cuánto falta para el próximo hielo.
const leftFor = (streak, every) => every - (streak % every);
const iceFor = (streak, every, max) => Math.min(max, Math.floor(streak / every));
function openActivateSheet(h, adjusting, rerender){
  const mine = S.me.habits.find(x => x.id === h.id);
  const streak = mine ? mine.streak : 0;
  let iceTouched = !!mine;
  const el = openSheet(`
    <h2>${esc(h.emoji)} ${adjusting ? 'Corregir' : 'Activar'} ${esc(h.name)}</h2>
    <p class="muted">${adjusting ? 'Ajustá la racha si algo quedó mal. Lo demás se calcula solo.' : '¿Ya venías con racha? Poné los días que llevás. Si arrancás de cero, dejalo en 0.'}</p>
    <div class="stack section">
      <label class="field"><span>Días de racha 🔥</span><input class="input" id="a-streak" type="number" inputmode="numeric" min="0" max="9999" value="${streak}"></label>
      <div class="grid2">
        <div class="field"><span>Hielos que tenés 🧊</span>${stepper('a-ice', mine ? mine.ice : 0, 0, h.max_ice)}</div>
        <div class="field"><span>Faltan para hielo ⌛</span><div class="calc"><div><b id="a-left">${leftFor(streak, h.ice_every)}</b> días</div><div class="hint" style="margin:2px 0 0">calculado solo</div></div></div>
      </div>
      <p class="hint">Se gana un hielo cada ${h.ice_every} días anotados (máximo ${h.max_ice}). Si ya usaste alguno, bajalo.</p>
      <button class="btn" id="a-save">${adjusting ? 'Guardar' : 'Activar'}</button>
    </div>`);
  bindSteppers(el);
  const streakVal = () => Math.max(0, parseInt($('#a-streak', el).value || '0', 10) || 0);
  el.querySelector('[data-stepper="a-ice"]').addEventListener('click', () => { iceTouched = true; });
  $('#a-streak', el).oninput = () => {
    const n = streakVal();
    $('#a-left', el).textContent = leftFor(n, h.ice_every);
    if (!iceTouched) $('#a-ice', el).textContent = iceFor(n, h.ice_every, h.max_ice);
  };
  $('#a-save', el).onclick = async (e) => {
    e.target.disabled = true;
    const n = streakVal();
    try {
      await rpc('api_set_habit', { ...P(), p_habit: h.id, p_active: true,
        p_streak: n, p_ice: +$('#a-ice', el).textContent, p_left: leftFor(n, h.ice_every) });
      S.me = await rpc('api_me', P()); closeSheet(); rerender();
      toast(adjusting ? 'Racha corregida' : `${h.name} activado 🔥`);
    } catch(err){ toast(err.message); e.target.disabled = false; }
  };
}

/* ============ Hojas ============ */
/* El botón "atrás" de Android cierra la hoja/pantalla abierta en vez de salir de la app. */
let layerInHistory = false, skipPop = false;
function pushLayer(){ if (!layerInHistory){ history.pushState({ layer: 1 }, ''); layerInHistory = true; } }
function popLayer(){
  // Se espera un instante: si enseguida se abre otra capa (ej. el festejo), reusa la misma entrada.
  setTimeout(() => { if (layerInHistory && !$('#layer').innerHTML){ layerInHistory = false; skipPop = true; history.back(); } }, 60);
}
function closeLayer(){ $('#layer .runner') ? closeRunner() : closeSheet(); }
window.addEventListener('popstate', () => {
  if (skipPop){ skipPop = false; return; }
  layerInHistory = false;
  if ($('#layer .runner')){ clearInterval(RT); RT = null; keepAwake(false); }
  $('#layer').innerHTML = '';
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#layer').innerHTML) closeLayer(); });

function openSheet(html, onClose){
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  pushLayer();
  const scrim = $('#scrim');
  scrim.addEventListener('click', (e) => { if (e.target === scrim){ closeSheet(); onClose && onClose(); } });
  return scrim.querySelector('.sheet');
}
function closeSheet(){ $('#layer').innerHTML = ''; popLayer(); }

function hastaCorte(){
  const now = new Date(), cut = new Date(now); cut.setHours(5, 0, 0, 0);
  if (now >= cut) cut.setDate(cut.getDate() + 1);

}

function compress(file, max = 1080, limit = 900000){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.75, out = c.toDataURL('image/jpeg', q);
      while (out.length > limit && q > 0.35){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

// Orden de siembra estándar: 1 contra el último, y los mejores se cruzan recién en la final.
function seedOrder(n){ let a = [1, 2]; while (a.length < n){ const m = a.length * 2; a = a.flatMap(x => [x, m + 1 - x]); } return a; }
function koMatches(entrants){
  let size = 2; while (size < entrants.length) size *= 2;
  const order = seedOrder(size), rounds = Math.log2(size), out = [];
  for (let r = 1; r <= rounds; r++) for (let s = 0; s < size / 2 ** r; s++){
    const m = { stage: 'ko', grp: null, round: r, slot: s, a: null, b: null };
    if (r === 1){ const ea = entrants[order[2*s] - 1], eb = entrants[order[2*s + 1] - 1]; m.a = ea === undefined ? null : ea; m.b = eb === undefined ? null : eb; }
    out.push(m);
  }
  return out;
}
function roundRobin(idxs, grp){
  const l = [...idxs]; if (l.length % 2) l.push(null);
  const n = l.length, out = [];
  for (let r = 0; r < n - 1; r++){
    let slot = 0;
    for (let i = 0; i < n / 2; i++){ const a = l[i], b = l[n - 1 - i]; if (a !== null && b !== null) out.push({ stage: 'grupo', grp, round: r + 1, slot: slot++, a, b }); }
    l.splice(1, 0, l.pop());
  }
  return out;
}
const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const roundName = (r, total) => ({ 0: 'Final', 1: 'Semifinal', 2: 'Cuartos', 3: 'Octavos', 4: '16avos' })[total - r] || `Ronda ${r}`;

      e.target.disabled = true;

function paintTournament(){

  root.querySelectorAll('[data-m]').forEach(b => b.onclick = () => resultSheet(matches.find(m => m.id === b.dataset.m), P_));
  const tk = $('#to-ko', root); if (tk) tk.onclick = () => toKnockout();
  const d = $('#tv-del', root); if (d) d.onclick = () => tSheet(`<h2>¿Borrar ${esc(t.name)}?</h2><p class="muted">Se borra para todo el grupo, con todos los resultados.</p>

const passN = () => +(LS.get('t_pass_' + TV.t.id) || 2);
function standings(ps, ms){
  const t = Object.fromEntries(ps.map(p => [p.id, { p, pj: 0, pts: 0, gf: 0, gc: 0, dif: 0 }]));
  ms.filter(m => m.played).forEach(m => {
    const A = t[m.a], B = t[m.b]; if (!A || !B) return;
    const sa = m.sa ?? (m.winner === m.a ? 1 : 0), sb = m.sb ?? (m.winner === m.b ? 1 : 0);
    A.pj++; B.pj++; A.gf += sa; A.gc += sb; B.gf += sb; B.gc += sa;
    if (m.winner === m.a) A.pts += 3; else if (m.winner === m.b) B.pts += 3; else { A.pts++; B.pts++; }
  });
  return Object.values(t).map(r => ({ ...r, dif: r.gf - r.gc })).sort((x, y) => y.pts - x.pts || y.dif - x.dif || y.gf - x.gf || x.p.seed - y.p.seed);
}
function matchCard(m, P_, bracket){
  const A = P_[m.a], B = P_[m.b], can = A && B;
  const side = (p, sc, won) => `<div class="bp ${won ? 'win' : ''} ${m.played && !won && m.winner ? 'lose' : ''}">${pAv(p, 26)}<span class="pname">${p ? esc(p.name) : (m.round === 1 && m.stage === 'ko' && m.played ? 'Pasa directo' : 'A definir')}</span><b>${sc ?? (m.played && won && m.sa == null ? '✓' : '')}</b></div>`;
  return `<button class="bmatch ${m.played ? 'done' : ''}" ${can ? `data-m="${m.id}"` : 'disabled'}>
    ${side(A, m.sa, m.played && m.winner && m.winner === m.a)}${side(B, m.sb, m.played && m.winner && m.winner === m.b)}
    ${!m.played && can ? '<span class="bplay">Cargar resultado</span>' : ''}</button>`;
}

async function toKnockout(){
  const { players, matches } = TV;
  const grps = [...new Set(players.map(p => p.grp).filter(Boolean))].sort();
  const n = passN(), tables = grps.map(g => standings(players.filter(p => p.grp === g), matches.filter(m => m.stage === 'grupo' && m.grp === g)));
  // Siembra: todos los primeros, después los segundos… así los de un mismo grupo se cruzan lo más tarde posible.
  const seeds = [];
  for (let k = 0; k < n; k++) seeds.push(...tables.map(t => t[k]).filter(Boolean).sort((x, y) => y.pts - x.pts || y.dif - x.dif).map(r => r.p.id));
  if (seeds.length < 2){ toast('Hacen falta al menos 2 clasificados'); return; }
  try { await rpc('api_tournament_to_ko', { ...P(), p_t: TV.t.id, p_matches: koMatches(seeds) }); await openTournament(TV.t.id, 'llaves'); toast('¡Llaves armadas! 🔥'); }
  catch(e){ toast(e.message); }
}

function habitEditor(h){
  let days = h ? [...h.days] : [0,1,2,3,4,5,6];
  let autoIce = !h;
  const EM = ['🏃','🚴','🏊','⚽','📚','🧘','💧','🥗','😴','✍️','🎸','🧠','📵','🙏','🚶','🏋️'];

    <div class="stack section">
      <label class="field"><span>Nombre</span><input class="input" id="h-name" maxlength="30" placeholder="Ej: Tomar agua" value="${esc(h ? h.name : '')}"></label>

      <div class="field"><span>Días que cuenta</span><div class="days" id="h-days">${DAYS.map((d,i) => `<button type="button" class="day" data-day="${i}" aria-label="${DAY_NAMES[i]}">${d}</button>`).join('')}</div>
        <div class="hint">Los días sin marcar son libres: no suman obligación ni cortan la racha.</div></div>
      <div class="grid2">
        <div class="field"><span>Hielo cada</span>${stepper('h-ice', h ? h.ice_every : 14, 1, 90)}<div class="hint">días anotados</div></div>
        <div class="field"><span>Máximo de hielos</span>${stepper('h-max', h ? h.max_ice : 2, 0, 5)}</div>
      </div>
      <p class="hint" id="h-rule"></p>
      <button class="btn" id="h-save">${h ? 'Guardar cambios' : 'Crear hábito'}</button>
      ${h ? '<button class="link danger" id="h-del">Eliminar hábito</button>' : ''}
    </div>`);
  bindSteppers(el);
  const paint = () => {
    el.querySelectorAll('[data-day]').forEach(b => b.classList.toggle('on', days.includes(+b.dataset.day)));

    $('#h-rule', el).textContent = `${days.length} veces por semana → un hielo cada ${$('#h-ice', el).textContent} días (el doble del hábito semanal).`;
  };
  el.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { const d = +b.dataset.day; days = days.includes(d) ? days.filter(x => x !== d) : [...days, d]; if (!days.length) days = [d]; paint(); });
  el.querySelectorAll('[data-em]').forEach(b => b.onclick = () => { $('#h-emoji', el).value = b.dataset.em; paint(); });
  ['#h-name','#h-wpp','#h-emoji'].forEach(s => $(s, el).oninput = paint);
  el.querySelector('[data-stepper="h-ice"]').addEventListener('click', () => { autoIce = false; setTimeout(paint); });
  paint();
  $('#h-save', el).onclick = async (e) => {
    const name = $('#h-name', el).value.trim(); if (!name){ toast('Ponele un nombre'); return; }
    e.target.disabled = true;
    try {
      await rpc('api_save_habit', { ...P(), p_group: S.groupId, p_id: h ? h.id : null, p_name: name, p_emoji: $('#h-emoji', el).value, p_wpp: $('#h-wpp', el).value,
        p_days: days.sort(), p_ice_every: +$('#h-ice', el).textContent, p_max_ice: +$('#h-max', el).textContent });
      S.me = await rpc('api_me', P()); await loadGroup(); closeSheet(); renderGrupo();
      toast(h ? 'Hábito actualizado' : 'Hábito creado. Cada uno lo activa desde Perfil.', 3500);
    } catch(err){ toast(err.message); e.target.disabled = false; }
  };
  const d = $('#h-del', el); if (d) d.onclick = () => confirmSheet(`¿Eliminar ${h.name}?`, 'Deja de aparecer para todos los del grupo.', 'Eliminar hábito', async () => {

  });
}

const R_QTY = { series: 4, rest: 60, ex: [
  { n: 'Flexiones', r: '20' }, { n: 'Plancha', r: '1 min', t: 60 }, { n: 'Rodillas al pecho en plancha', r: '50' },
  { n: 'Fondos de tríceps', r: '20' }, { n: 'Sentadillas con salto', r: '15' } ] };
const R_TIME = { min: 12, ex: [
  { n: 'Sentadillas', k: 1 }, { n: 'Estocadas', k: 2, note: 'una por pierna' }, { n: 'Flexiones', k: 1 }, { n: 'Escaladores', k: 1 },
  { n: 'Burpees', k: 1 }, { n: 'Abro y cierro', k: 1 }, { n: 'Escaleras', fixed: 1, note: 'o un pique ida y vuelta' } ] };
const MED_VIDEO = '9-IOMXpv7Ys';

/* ============ Marcas del gym ============ */
const EJERCICIOS = ['Press plano', 'Press inclinado', 'Sentadilla', 'Peso muerto', 'Press militar', 'Remo con barra', 'Dominadas', 'Hip thrust', 'Prensa', 'Curl de bíceps'];
const capEx = (t) => { t = String(t).trim().replace(/\s+/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1); };
const kgTxt = (n) => `${Number(n).toLocaleString('es-AR', { maximumFractionDigits: 2 })} kg`;
const shortDate = (iso) => { const d = new Date(iso); return `${d.getDate()}/${d.getMonth()+1}`; };
async function loadLifts(){
  try { S.lifts = await rpc('api_lifts', P()); } catch(e){ S.lifts = S.lifts || []; }
  const box = $('#lifts'); if (box && S.tab === 'rutinas'){ box.innerHTML = liftsBlock(); bindLifts(); }
}
function liftGroups(){
  const g = {};
  (S.lifts || []).forEach(l => { const k = l.exercise.toLowerCase(); (g[k] = g[k] || { name: capEx(l.exercise), items: [] }).items.push(l); });
  return Object.values(g).map(x => ({ ...x, best: x.items.reduce((a, l) => Math.max(a, +l.kg), 0), last: x.items[0] }))
    .sort((a, b) => new Date(b.last.created_at) - new Date(a.last.created_at));
}
function liftsBlock(){
  if (!S.lifts) return '<div class="spinner" style="margin:12px auto"></div>';
  const gs = liftGroups();
  if (!gs.length) return '<p class="muted" style="margin:0">Anotá cuánto levantás en cada ejercicio (ej: Press plano 80 kg × 8) y seguí tu progreso. Cada récord nuevo se festeja.</p>';
  return gs.map(x => `<button class="hrow" style="width:100%;text-align:left" data-lift="${esc(x.name)}">
    <div><div style="font-weight:800;font-size:17px">${esc(x.name)}</div><div class="small muted">Último: ${kgTxt(x.last.kg)}${x.last.reps ? ` × ${x.last.reps}` : ''} · ${shortDate(x.last.created_at)}</div></div>
    <span class="pill fire">🏆 ${kgTxt(x.best)}</span></button>`).join('');
}
function bindLifts(){
  document.querySelectorAll('[data-lift]').forEach(b => b.onclick = () => liftHistory(b.dataset.lift));
}
function liftHistory(name){
  const x = liftGroups().find(g => g.name === name); if (!x) return;
  const el = openSheet(`<h2>${esc(x.name)}</h2><p class="muted">Récord: <b>${kgTxt(x.best)}</b> · ${x.items.length} ${x.items.length === 1 ? 'marca' : 'marcas'}</p>
    <div class="card section">${x.items.map(l => `<div class="hrow"><div><b>${kgTxt(l.kg)}</b>${l.reps ? ` × ${l.reps}` : ''}${+l.kg === x.best ? ' 🏆' : ''}<div class="small muted">${shortDate(l.created_at)}${l.note ? ` · ${esc(l.note)}` : ''}</div></div><button class="link small danger" data-ldel="${l.id}">Borrar</button></div>`).join('')}</div>
    <div class="section"><button class="btn" id="l-more">Cargar otra marca</button></div>`);
  $('#l-more', el).onclick = () => liftSheet(x.name);
  el.querySelectorAll('[data-ldel]').forEach(b => b.onclick = async () => {
    try { await rpc('api_lift_delete', { ...P(), p_id: b.dataset.ldel }); S.lifts = S.lifts.filter(l => l.id !== b.dataset.ldel); closeSheet(); renderRutinas(); toast('Marca borrada'); }
    catch(err){ toast(err.message); }
  });
}
function liftSheet(name){
  const seen = new Set(), known = [...liftGroups().map(g => g.name), ...EJERCICIOS].filter(e => !seen.has(e.toLowerCase()) && seen.add(e.toLowerCase())).slice(0, 10);
  const el = openSheet(`<h2>🏋️ Cargar peso</h2>
    <div class="stack section">
      <label class="field"><span>Ejercicio</span><input class="input" id="l-ex" maxlength="40" placeholder="Ej: Press plano" value="${esc(name)}"></label>
      <div class="chips" style="flex-wrap:wrap;margin:0">${known.map(e => `<button type="button" class="chip" data-lex="${esc(e)}">${esc(e)}</button>`).join('')}</div>
      <div class="grid2">
        <label class="field"><span>Peso (kg)</span><input class="input" id="l-kg" type="number" inputmode="decimal" min="0" max="1000" step="0.5" placeholder="80"></label>
        <label class="field"><span>Repeticiones</span><input class="input" id="l-reps" type="number" inputmode="numeric" min="1" max="200" placeholder="8"></label>
      </div>
      <label class="field"><span>Nota (opcional)</span><input class="input" id="l-note" maxlength="140" placeholder="Ej: con spotter, última serie al fallo"></label>
      <button class="btn" id="l-save">Guardar marca</button>
    </div>`);
  el.querySelectorAll('[data-lex]').forEach(b => b.onclick = () => { $('#l-ex', el).value = b.dataset.lex; $('#l-kg', el).focus(); });
  $('#l-save', el).onclick = async (e) => {
    const ex = capEx($('#l-ex', el).value), kg = parseFloat(($('#l-kg', el).value || '').replace(',', '.')), reps = parseInt($('#l-reps', el).value, 10);
    if (!ex){ toast('Elegí el ejercicio'); return; }
    if (!(kg >= 0 && kg <= 1000)){ toast('Poné el peso en kg'); return; }
    e.target.disabled = true;
    try {
      const r = await rpc('api_lift_add', { ...P(), p_exercise: ex, p_kg: kg, p_reps: reps > 0 ? reps : null, p_note: $('#l-note', el).value || null });
      closeSheet(); S.lifts = null; renderRutinas();
      if (r && r.pr && r.prev != null){ vibrate([30, 60, 30]); beep(660, .12); setTimeout(() => beep(990, .16), 120); toast(`🏆 ¡Récord nuevo en ${ex}! ${kgTxt(kg)} (antes ${kgTxt(r.prev)})`, 4000); }
      else toast(`Marca guardada: ${ex} ${kgTxt(kg)} 💪`);
    } catch(err){ toast(err.message); e.target.disabled = false; }
  };
}

let RT = null; // runner timer
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
function openRunner(html){
  $('#layer').innerHTML = `<div class="runner" role="dialog" aria-modal="true"><div class="inner">${html}</div></div>`;
  pushLayer();
  keepAwake(true);
  return $('#layer .runner');
}
function closeRunner(){ clearInterval(RT); RT = null; keepAwake(false); $('#layer').innerHTML = ''; popLayer(); }
const mmss = (s) => `${Math.floor(s/60)}:${String(Math.max(0, s%60)).padStart(2,'0')}`;
function countdown(seconds, onTick, onEnd){
  clearInterval(RT);
  const end = Date.now() + seconds*1000;
  const tick = () => { const left = Math.max(0, Math.round((end - Date.now())/1000)); onTick(left); if (left <= 0){ clearInterval(RT); RT = null; onEnd && onEnd(); } };
  tick(); RT = setInterval(tick, 250);
}
function runnerHeader(title){
  const music = myPlaylist() || spotifySearch(title.includes('Medita') ? 'meditacion relajacion' : 'beast mode');
  return `<div class="row between" style="margin-bottom:18px"><h2>${title}</h2><div class="row" style="gap:8px"><a class="btn ghost sm" href="${esc(music)}" target="_blank" rel="noopener" aria-label="Poner música">🎧</a><button class="btn ghost sm" data-close>Cerrar</button></div></div>`;
}
function finishBlock(habitName, msg){

function bindRunnerCommon(el){

function runQty(){
  let serie = 1, done = new Set(), resting = false;
  const paint = () => {
    if (serie > R_QTY.series){ const el = openRunner(runnerHeader('Rutina por cantidad') + finishBlock('Deporte', '¡Rutina completa! 4 series 💪')); bindRunnerCommon(el); beep(880,.2,3); vibrate([200,100,200]); return; }
    const el = openRunner(`${runnerHeader('Rutina por cantidad')}
      <div class="row between"><h3>Serie ${serie} de ${R_QTY.series}</h3><span class="small muted">${done.size}/${R_QTY.ex.length}</span></div>
      <div class="progress" style="margin:10px 0 16px"><i style="width:${((serie-1)*R_QTY.ex.length + done.size)/(R_QTY.series*R_QTY.ex.length)*100}%"></i></div>
      ${resting ? `<div class="card" style="text-align:center"><div class="small muted">Descanso</div><div class="clock rest" id="clk">1:00</div><button class="btn ghost sm" id="skip" style="margin-top:12px">Saltar descanso</button></div>` :
      `<div class="stack">${R_QTY.ex.map((x,i) => `<button class="ex ${done.has(i) ? 'done' : ''}" data-ex="${i}"><span style="font-weight:700">${done.has(i) ? '✓ ' : ''}${x.n}</span><span class="reps" ${x.t ? `id="t${i}"` : ''}>${x.r}</span></button>`).join('')}</div>
      <p class="hint" style="text-align:center">Tocá cada ejercicio cuando lo termines.${R_QTY.ex.some(x=>x.t) ? ' La plancha arranca un cronómetro de 1 min.' : ''}</p>`}
    `);
    bindRunnerCommon(el);
    if (resting){
      countdown(R_QTY.rest, (l) => { const c = $('#clk'); if (c) c.textContent = mmss(l); if (l === 3 || l === 2 || l === 1) beep(520,.1); }, () => { beep(990,.25,2); vibrate(300); resting = false; serie++; done = new Set(); paint(); });
      $('#skip', el).onclick = () => { clearInterval(RT); resting = false; serie++; done = new Set(); paint(); };
      return;
    }
    el.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
      const i = +b.dataset.ex, x = R_QTY.ex[i];
      if (done.has(i)){ done.delete(i); paint(); return; }
      if (x.t && !b.dataset.running){
        b.dataset.running = '1';
        countdown(x.t, (l) => { const t = $('#t'+i); if (t) t.textContent = mmss(l); }, () => { beep(990,.25,2); vibrate(300); done.add(i); after(); });
        return;
      }
      clearInterval(RT); done.add(i); after();
    });
    function after(){
      if (done.size === R_QTY.ex.length){ if (serie < R_QTY.series) resting = true; else serie++; }
      paint();
    }
  };
  paint();
}

function runTime(){
  let round = 1, started = false, finished = false, left = R_TIME.min*60, paused = false;
  const reps = (x) => x.fixed ?? x.k * round;
  const paint = () => {
    if (finished){ const el = openRunner(runnerHeader('Rutina por tiempo') + finishBlock('Deporte', `¡Tiempo! Llegaste a la ronda ${round} 🔥`)); bindRunnerCommon(el); return; }
    const el = openRunner(`${runnerHeader('Rutina por tiempo')}
      <div class="clock" id="clk">${mmss(left)}</div>
      <div class="progress" style="margin:14px 0"><i id="bar" style="width:${(1 - left/(R_TIME.min*60))*100}%"></i></div>
      <div class="row between" style="margin-bottom:10px"><h3>Ronda ${round}</h3><span class="small muted">Sube 1 por ronda</span></div>
      <div class="stack">${R_TIME.ex.map(x => `<div class="ex"><span><b>${x.n}</b>${x.note ? `<br><span class="small muted">${x.note}</span>` : ''}</span><span class="reps">${reps(x)}</span></div>`).join('')}</div>
      <div class="section grid2">
        <button class="btn ghost" id="pause">${!started ? 'Empezar' : paused ? 'Seguir' : 'Pausa'}</button>
        <button class="btn" id="next" ${started ? '' : 'disabled'}>Ronda ${round+1}</button>
      </div>`);
    bindRunnerCommon(el);
    const start = () => countdown(left, (l) => { left = l; const c = $('#clk'); if (c) c.textContent = mmss(l); const b = $('#bar'); if (b) b.style.width = `${(1 - l/(R_TIME.min*60))*100}%`; if (l === 60) beep(700,.15,2); }, () => { beep(990,.3,3); vibrate([300,100,300]); finished = true; paint(); });
    $('#pause', el).onclick = () => {
      if (!started){ started = true; paused = false; paint(); start(); return; }
      if (paused){ paused = false; paint(); start(); } else { paused = true; clearInterval(RT); paint(); }
    };
    $('#next', el).onclick = () => { round++; vibrate(40); const run = !paused; paint(); if (run) start(); };
  };
  paint();
}

let healthBusy = false;
async function autoHealth(){
  if (!healthOn() || !S.me || healthBusy) return;
  healthBusy = true;
  try {
    const since = parseDay(S.me.today).getTime() + 5 * 36e5; // el día arranca a las 5 AM
    const r = await nat('healthSince', { since });
    if (!r) return;
    const hs = S.me.habits.filter(h => !h.done_today);
    const dep = hs.find(h => /deporte|entren|gym|gimnas|ejerc|correr/i.test(h.name));
    const med = hs.find(h => /medita|mindful/i.test(h.name));
    const ws = (r.workouts || []).filter(w => w.minutes >= 10);
    const ids = [], notes = [];
    if (dep && ws.length){ ids.push(dep.id); notes.push(ws.map(w => `${w.type} ${w.minutes} min`).join(', ')); }
    if (med && (r.mindful || 0) >= 5){ ids.push(med.id); notes.push(`meditación ${r.mindful} min`); }
    if (!ids.length) return;
    const res = await rpc('api_checkin', { ...P(), p_habits: ids, p_photo: null, p_note: `Anotado por Salud: ${notes.join(' · ')}` });
    S.me.habits = res.habits; renderMain();
    toast(`🍎 Salud: anotamos ${hs.filter(h => ids.includes(h.id)).map(h => h.name).join(' y ')} (${notes.join(' · ')})`, 4500);
  } catch(e){ console.warn('salud', e); }
  finally { healthBusy = false; }
}

function heatmap(){
  const today = S.me.today, weeks = 18;
  const byDay = {};
  (S.history || []).forEach(x => { byDay[x.day] = byDay[x.day] || { d: 0, i: 0 }; x.kind === 'hecho' ? byDay[x.day].d++ : byDay[x.day].i++; });
  const t = parseDay(today);
  // columnas = semanas (domingo arriba)
  const first = addDays(today, -t.getDay() - (weeks-1)*7);
  let cells = '';
  for (let i = 0; i < weeks*7; i++){
    const d = addDays(first, i);
    if (d > today){ cells += '<i class="fut"></i>'; continue; }
    const v = byDay[d]; let c = '';
    if (v && v.d) c = v.d >= 3 ? 'l3' : v.d === 2 ? 'l2' : 'l1';
    else if (v && v.i) c = 'ic';
    cells += `<i class="${c}" title="${d}"></i>`;
  }
  return `<div class="heat" aria-label="Historial de las últimas ${weeks} semanas">${cells}</div>`;
}

async function rpc(fn, body) {

  r.headers = { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" };
  r.body = JSON.stringify(Object.assign({ p_token: TOKEN }, body || {}));
  return await r.loadJSON();
}

    const big = config.widgetFamily !== "small";
    for (const h of hs.slice(0, big ? 4 : 3)) {
      const row = w.addStack(); row.centerAlignContent();
      if (big) row.url = runUrl("h=" + h.id);
      const tick = row.addText(h.done_today ? "✓" : "○");
      tick.font = Font.heavySystemFont(big ? 20 : 17); tick.textColor = h.done_today ? OK : (h.required_today ? FIRE : DIM);
      row.addSpacer(6);
      const n = row.addText(h.emoji + " " + h.streak);
      n.font = Font.heavySystemFont(big ? 20 : 17); n.textColor = h.done_today ? GOLD : Color.white();
      if (big) { row.addSpacer(); const i = row.addText("🧊" + h.ice + "  ⌛" + h.left_for_ice); i.font = Font.systemFont(12); i.textColor = new Color("#C2A69A"); }
      w.addSpacer(big ? 5 : 3);
    }
    // En el widget chico, si hay un solo hábito, el toque lo anota directo.
    if (hs.length === 1) w.url = runUrl("h=" + hs[0].id);
  } catch (e) {
    const t = w.addText("🔥 Fueguitos\\nSin conexión"); t.textColor = Color.white(); t.font = Font.boldSystemFont(14);
  }
  w.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);
  return w;
}

const q = args.queryParameters || {};
if (config.runsInWidget) {
  Script.setWidget(await buildWidget());
} else if (q.h) {
  await toggle(q.h === "menu" ? null : q.h);
} else {
  await (await buildWidget()).presentMedium();
}
Script.complete();
`;
}

const isStandalone = () => IS_NATIVE || matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const showInstallCard = () => !isStandalone() && !LS.get('fueguitos_no_install');
function installHelp(){
  if (isStandalone()) return '<p style="margin:0">✅ Ya la tenés instalada. Mantené apretado el ícono para ir directo a Anotar Deporte, Lectura o Rutinas.</p>';
  const ua = navigator.userAgent;
  const ios = /iphone|ipad|ipod/i.test(ua);
  // Navegadores metidos adentro de otras apps (WhatsApp, Instagram…) no dejan instalar.
  const inApp = inAppBrowser();
  if (inApp) return `<p style="margin:0">Estás abriendo el link desde adentro de otra app. Para instalarla, abrilo en <b>${ios ? 'Safari' : 'Chrome'}</b> (menú ⋮ o ··· → <b>Abrir en el navegador</b>).</p>`;
  return ios
    ? '<p style="margin:0">En iPhone: abrí este link en <b>Safari</b>, tocá el botón <b>Compartir</b> (el cuadrado con la flecha) y elegí <b>Agregar a pantalla de inicio</b>.</p>'
    : `<p style="margin:0 0 10px">En Android: tocá el menú <b>⋮</b> de Chrome y elegí <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</p>${deferredInstall ? '<button class="btn sm" id="inst" style="width:100%">Instalar ahora</button>' : ''}`;
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredInstall = e;
  const g = $('.guide'); if (g){ g.remove(); maybeInstallGuide(); } // ahora se puede ofrecer el botón de instalar directo
  if (S.me && (S.tab === 'hoy' || S.tab === 'perfil')) renderMain();
});
document.addEventListener('click', async (e) => {
  if (e.target && e.target.id === 'inst' && deferredInstall){ deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; renderMain(); }
});

/* Al volver a la app (por ej. al día siguiente), refrescar */
let lastHidden = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden){ lastHidden = Date.now(); return; }
  if (S.token && S.me && !S.onboarding && Date.now() - lastHidden > (IS_NATIVE ? 3000 : 60000) && !$('#layer').innerHTML){
    try { await loadMe(); S.sel.clear(); renderMain(); if (S.tab === 'grupo') refreshGroup(); autoHealth(); } catch(e){}
  }
});

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
